.opt-card{background:rgba(107,79,138,0.15);border:1px solid #3d2b5e;border-radius:10px;padding:16px;transition:all .3s}
.opt-card:hover{border-color:#9b6dc4;box-shadow:0 0 15px rgba(155,109,196,0.2)}

.panel-header .panel-title{color:#9b6dc4;font-size:14px;font-weight:bold}
.panel-header .panel-arrow{color:#6b4f8a;transition:transform .3s;font-size:12px}
.panel-header.open .panel-arrow{transform:rotate(90deg)}
.panel-body{max-height:0;overflow:hidden;transition:max-height .4s ease}
.panel-body.open{max-height:5000px;overflow-y:auto}
.layer-table{width:100%;border-collapse:collapse}
.layer-table td{padding:6px 12px;border-bottom:1px solid #241638;font-size:13px}

.layer-table td:last-child{color:#e0d4f0}

function mod(n,m){return ((n%m)+m)%m;}

function solarToBazi(year,month,day,hour,minute){
  var yearGanIdx=mod(year-4,10);
  var yearZhiIdx=mod(year-4,12);
  var yearGan=TIANGAN[yearGanIdx];
  var yearZhi=DIZHI[yearZhiIdx];
  // 月柱
  var monthZhiIdx=((month+9)%12)+2;
  if(monthZhiIdx>=12)monthZhiIdx-=12;
  var monthZhi=DIZHI[monthZhiIdx];
  var startGan=WU_HU_DUN[yearGan];
  var monthGanIdx=mod(startGan+monthZhiIdx-2,10);
  var monthGan=TIANGAN[monthGanIdx];
  // 日柱 (儒略日法)
  var baseDate=new Date(2000,0,7);
  var targetDate=new Date(year,month-1,day);
  var dayDiff=Math.round((targetDate.getTime()-baseDate.getTime())/86400000);
  var dayIdx=mod(dayDiff+54,60);
  var dayGan=TIANGAN[dayIdx%10];
  var dayZhi=DIZHI[dayIdx%12];
  // 时柱
  var timeZhiIdx=Math.floor((hour*2+(minute>=30?1:0))/2);
  if(timeZhiIdx>=12)timeZhiIdx-=12;
  if(timeZhiIdx===0&&hour<1)timeZhiIdx=0;
  var timeZhi=DIZHI[timeZhiIdx];
  var startShi=WU_SHU_DUN[dayGan];
  var timeGanIdx=mod(startShi+timeZhiIdx,10);
  var timeGan=TIANGAN[timeGanIdx];
  return{year_gan:yearGan,year_zhi:yearZhi,year_gan_idx:yearGanIdx,year_zhi_idx:yearZhiIdx,
    month_gan:monthGan,month_zhi:monthZhi,month_zhi_idx:monthZhiIdx,
    day_gan:dayGan,day_zhi:dayZhi,day_idx:dayIdx,
    time_gan:timeGan,time_zhi:timeZhi,time_zhi_idx:timeZhiIdx};
}

function solarToLunarApprox(year,month,day){
  var lunarMonth=month;
  var lunarDay=day;
  if(month===1||(month===2&&day<17)){
    lunarMonth=(month===1)?12:1;
    lunarDay=(month===1)?(day+15):day;
  }
  if(lunarMonth<1)lunarMonth=1;
  if(lunarMonth>12)lunarMonth=12;
  if(lunarDay<1)lunarDay=1;
  if(lunarDay>30)lunarDay=30;
  return[lunarMonth,lunarDay];
}

function getMingGong(lunarMonth,timeZhiIdx){
  return mod(2+(lunarMonth-1)-timeZhiIdx,12);
}

function getShenGong(lunarMonth,timeZhiIdx){
  return mod(2+(lunarMonth-1)+timeZhiIdx,12);
}

function getMingGongGan(yearGan,mingGongZhiIdx){
  var startGan=WU_HU_DUN[yearGan];
  var ganIdx=mod(startGan+mingGongZhiIdx-2,10);
  return TIANGAN[ganIdx];
}

function getWuxingJu(mingGongGan,mingGongZhi){
  var ganIdx=TIANGAN.indexOf(mingGongGan);
  var zhiIdx=DIZHI.indexOf(mingGongZhi);
  var jiaziIdx=mod(ganIdx*12+zhiIdx,60);
  for(var i=0;i<60;i++){
    if(JIAZI[i]===mingGongGan+mingGongZhi){jiaziIdx=i;break;}
  }
  var nayin=NAYIN_60[jiaziIdx];
  var nayinWuxing=nayin.charAt(nayin.length-1);
  var ju=NAYIN_WUXING_TO_JU[nayinWuxing]||2;
  return[ju,nayin];
}

function getZiweiPos(ju,lunarDay){
  var shang=Math.floor(lunarDay/ju);
  var yu=lunarDay%ju;
  var pos;
  if(yu===0){
    pos=mod(1+(shang-1),12);
  }else{
    pos=mod(1+shang,12);
    if((shang+yu)%2===1){
      pos=mod(pos-1,12);
    }else{
      pos=mod(pos+1,12);
    }
  }
  return pos;
}

// OPT5: 紫微星定位算法边界修正
function getZiweiPosCorrected(ju,lunarDay){
  if(ju<2||ju>6)return 0;
  if(lunarDay<1)lunarDay=1;
  if(lunarDay>30)lunarDay=30;
  var shang=Math.floor(lunarDay/ju);
  var yu=lunarDay%ju;
  var pos;
  if(yu===0){
    if(shang===1){
      pos=1;
    }else{
      pos=mod(2+shang-1,12);
    }
  }else{
    var x=ju-yu;
    var y=Math.floor((lunarDay+x)/ju);
    if(x%2===0){
      pos=mod(2+y+x-1,12);
    }else{
      var steps=y-x;
      if(steps<=0){
        pos=mod(2+steps,12);
      }else{
        pos=mod(2+steps-1,12);
      }
    }
  }
  return mod(pos,12);
}

function placeAll14Stars(ziweiPos){
  var starPositions={};
  for(var star in ZIWEI_SYSTEM_OFFSETS){
    if(ZIWEI_SYSTEM_OFFSETS.hasOwnProperty(star)){
      starPositions[star]=mod(ziweiPos+ZIWEI_SYSTEM_OFFSETS[star],12);
    }
  }
  var tianfuPos=mod(12-ziweiPos,12);
  if(tianfuPos===12)tianfuPos=0;
  for(var star2 in TIANFU_SYSTEM_OFFSETS){
    if(TIANFU_SYSTEM_OFFSETS.hasOwnProperty(star2)){
      starPositions[star2]=mod(tianfuPos+TIANFU_SYSTEM_OFFSETS[star2],12);
    }
  }
  return{positions:starPositions,tianfuPos:tianfuPos};
}

  return stars;

function calcDaxianWithJu(mingGongIdx,yearGan,gender,ju){
  var isYangGan=['甲','丙','戊','庚','壬'].indexOf(yearGan)>=0;
  var isMale=gender==='male';
  var direction=((isYangGan&&isMale)||(!isYangGan&&!isMale))?1:-1;
  var startAge=ju;
  var daxianList=[];
  for(var i=0;i<12;i++){
    var daxianIdx=mod(mingGongIdx+direction*i,12);
    var ageStart=startAge+i*10;
    var ageEnd=ageStart+9;
    daxianList.push({idx:daxianIdx,age_range:ageStart+'-'+ageEnd+'岁',palace:PALACES[mod(daxianIdx-mingGongIdx,12)]});
  }
  return daxianList;
}

function generate(){
  var year=parseInt(document.getElementById('year').value)||2026;
  var month=parseInt(document.getElementById('month').value)||8;
  var day=parseInt(document.getElementById('day').value)||7;
  var hour=parseInt(document.getElementById('hour').value)||19;
  var gender=document.getElementById('gender').value||'male';
  var minute=0;
  var juNames={2:'水二局',3:'木三局',4:'金四局',5:'土五局',6:'火六局'};

  // 四柱
  var bazi=solarToBazi(year,month,day,hour,minute);
  var lunarArr=solarToLunarApprox(year,month,day);
  var lunarMonth=lunarArr[0],lunarDay=lunarArr[1];

  // 命宫身宫
  var mingGongIdx=getMingGong(lunarMonth,bazi.time_zhi_idx);
  var shenGongIdx=getShenGong(lunarMonth,bazi.time_zhi_idx);
  var mingGongGan=getMingGongGan(bazi.year_gan,mingGongIdx);
  var mingGongZhi=DIZHI[mingGongIdx];

  // 五行局
  var juArr=getWuxingJu(mingGongGan,mingGongZhi);
  var ju=juArr[0],nayin=juArr[1];

  // 紫微星定位 (OPT5修正版)
  var ziweiPosOrig=getZiweiPos(ju,lunarDay);
  var ziweiPosNew=getZiweiPosCorrected(ju,lunarDay);
  var ziweiPos=ziweiPosNew;
  var ziweiChanged=(ziweiPosNew!==ziweiPosOrig);

  // 安十四主星
  var starArr=placeAll14Stars(ziweiPos);
  var starPositions=starArr.positions;
  var tianfuPos=starArr.tianfuPos;

  // 四化
  var sihua=getSihua(bazi.year_gan);

  // 辅星煞星
  var lucunPos=getLucun(bazi.year_gan);
  var qyArr=getQingyangTuoluo(lucunPos);
  var qingyang=qyArr[0],tuoluo=qyArr[1];
  var kuiYue=getKuiYue(bazi.year_gan);
  var zfArr=getZuofuYoubi(lunarMonth);
  var zuofu=zfArr[0],youbi=zfArr[1];
  var wcArr=getWenchangWenqu(bazi.time_zhi_idx);
  var wenchang=wcArr[0],wenqu=wcArr[1];
  var dkArr=getDikongDijie(bazi.time_zhi_idx);
  var dikong=dkArr[0],dijie=dkArr[1];
  var hxArr=getHuoxingLingxing(bazi.year_zhi_idx,bazi.time_zhi_idx);
  var huoxing=hxArr[0],lingxing=hxArr[1];
  var tianma=getTianma(bazi.year_zhi_idx);

  var auxStars={
    '禄存':lucunPos,'擎羊':qingyang,'陀罗':tuoluo,
    '天魁':kuiYue['魁'],'天钺':kuiYue['钺'],
    '左辅':zuofu,'右弼':youbi,
    '文昌':wenchang,'文曲':wenqu,
    '地空':dikong,'地劫':dijie,
    '火星':huoxing,'铃星':lingxing,
    '天马':tianma
  };

  // 庙旺平陷
  var miaoWangMap={};
  for(var star in starPositions){
    if(starPositions.hasOwnProperty(star)){
      miaoWangMap[star]=getMiaoWang(star,starPositions[star]);
    }
  }

  // === 构建各层数据 ===
  var layers={};

  // L1: 基础排盘 (8维)
  layers['L1']={};
  layers['L1']['年柱']=bazi.year_gan+bazi.year_zhi;
  layers['L1']['月柱']=bazi.month_gan+bazi.month_zhi;
  layers['L1']['日柱']=bazi.day_gan+bazi.day_zhi;
  layers['L1']['时柱']=bazi.time_gan+bazi.time_zhi;
  layers['L1']['命宫地支']=mingGongZhi;
  layers['L1']['身宫地支']=DIZHI[shenGongIdx];
  layers['L1']['命宫干支']=mingGongGan+mingGongZhi;
  layers['L1']['五行局']=juNames[ju]||(ju+'局');

  // L2: 主星坐宫 (14维)
  layers['L2']={};
  for(var s1 in STARS_14){
    if(STARS_14.hasOwnProperty(s1)){
      var pos1=starPositions[s1]!==undefined?starPositions[s1]:0;
      var pn1=PALACES[mod(pos1-mingGongIdx,12)];
      layers['L2'][s1+'所在宫']=DIZHI[pos1]+'宫('+pn1+')';
    }
  }

  // L3: 主星庙旺 (14维)
  layers['L3']={};
  for(var s2 in STARS_14){
    if(STARS_14.hasOwnProperty(s2)){
      layers['L3'][s2+'庙旺']=miaoWangMap[s2]||'平';
    }
  }

  // L4: 主星属性 (98维)
  layers['L4']={};
  for(var s3 in STARS_14){
    if(STARS_14.hasOwnProperty(s3)){
      var attrs=STARS_14[s3];
      layers['L4'][s3+'_五行']=attrs['wuxing'];
      layers['L4'][s3+'_化气']=attrs['huaqi'];
      layers['L4'][s3+'_星系']=attrs['star_system'];
      layers['L4'][s3+'_斗分']=attrs['douxi'];
      layers['L4'][s3+'_分类']=attrs['classification'];
      layers['L4'][s3+'_核心特质']=attrs['core_trait'];
      layers['L4'][s3+'_喜忌']='喜:'+attrs['palace_pref']+'; 忌:'+attrs['anti'];
    }
  }

  // L5: 十二宫吉凶 (48维)
  layers['L5']={};
  for(var i5=0;i5<PALACES.length;i5++){
    var pIdx5=mod(mingGongIdx+i5,12);
    var pStars5=getPalaceStars(starPositions,pIdx5);
    var pMw5={};pStars5.forEach(function(s){pMw5[s]=miaoWangMap[s]||'平';});
    var ausp5=0,inausp5=0;
    pStars5.forEach(function(s){var mw=miaoWangMap[s]||'平';if(mw==='庙'||mw==='旺')ausp5++;if(mw==='陷'||mw==='平')inausp5++;});
    var auxHere5={};
    for(var ak in auxStars){if(auxStars.hasOwnProperty(ak)&&auxStars[ak]===pIdx5)auxHere5[ak]=true;}
    var jx5='吉';if(ausp5>inausp5)jx5='吉';else if(inausp5>ausp5)jx5='凶';else jx5='平';
    layers['L5'][PALACES[i5]+'_主星']=pStars5.length?pStars5.join('、'):'空宫';
    layers['L5'][PALACES[i5]+'_庙旺']=pStars5.length?pStars5.map(function(s){return s+'('+pMw5[s]+')';}).join('、'):'无';
    layers['L5'][PALACES[i5]+'_吉凶']=jx5;
    layers['L5'][PALACES[i5]+'_辅煞']=Object.keys(auxHere5).length?Object.keys(auxHere5).join('、'):'无';
  }

  // L6: 四化系统 (12维)
  layers['L6']={};
  var sihuaEffects={'禄':'增益财禄人缘','权':'增强权力掌控','科':'提升名声贵人','忌':'阻碍执念波折'};

    if(sihua.hasOwnProperty(ht)){
      var siStar=sihua[ht];
      var siPos=starPositions[siStar]!==undefined?starPositions[siStar]:0;
      var siPn=PALACES[mod(siPos-mingGongIdx,12)];
      layers['L6']['化'+ht+'_星曜']=siStar;
      layers['L6']['化'+ht+'_落宫']=DIZHI[siPos]+'宫('+siPn+')';
      layers['L6']['化'+ht+'_效果']=sihuaEffects[ht]||'';
    }
  }

  // L7: 六吉星 (18维)
  layers['L7']={};
  var jxNames={'左辅':'同辈助力','右弼':'同辈助力带监管','天魁':'男性长辈提携','天钺':'女性长辈提携','文昌':'正规学业文书','文曲':'才艺口才技能'};
  var jxList=['左辅','右弼','天魁','天钺','文昌','文曲'];
  for(var ji=0;ji<jxList.length;ji++){
    var jn=jxList[ji];
    var jp=auxStars[jn]!==undefined?auxStars[jn]:0;
    var jpn=PALACES[mod(jp-mingGongIdx,12)];
    var jco=getPalaceStars(starPositions,jp);
    layers['L7'][jn+'_宫位']=DIZHI[jp]+'宫('+jpn+')';
    layers['L7'][jn+'_同宫']=jco.length?jco.join('、'):'无主星';
    layers['L7'][jn+'_助力']=jxNames[jn]||'';
  }

  // L8: 六煞星 (18维)
  layers['L8']={};
  var sxNames={'擎羊':'刑伤冲动','陀罗':'拖延反复','火星':'暴躁急进','铃星':'隐忍阴沉','地空':'不聚财空虚','地劫':'破财漂泊'};
  var sxList=['擎羊','陀罗','火星','铃星','地空','地劫'];
  for(var si=0;si<sxList.length;si++){
    var sn=sxList[si];
    var sp=auxStars[sn]!==undefined?auxStars[sn]:0;
    var spn=PALACES[mod(sp-mingGongIdx,12)];
    var sco=getPalaceStars(starPositions,sp);
    layers['L8'][sn+'_宫位']=DIZHI[sp]+'宫('+spn+')';

    layers['L8'][sn+'_破坏']=sxNames[sn]||'';
  }

  // L9: 禄马配置 (4维)
  layers['L9']={};
  var lucunPn=PALACES[mod(lucunPos-mingGongIdx,12)];
  var tianmaPn=PALACES[mod(tianma-mingGongIdx,12)];
  layers['L9']['禄存_宫位']=DIZHI[lucunPos]+'宫('+lucunPn+')';
  layers['L9']['禄存_格局']=(Math.abs(lucunPos-tianma)===4||Math.abs(lucunPos-tianma)===8)?'禄马交驰':(lucunPos===mingGongIdx?'禄存守命':'禄存入库');
  layers['L9']['天马_宫位']=DIZHI[tianma]+'宫('+tianmaPn+')';
  layers['L9']['天马_格局']=(tianma!==mingGongIdx)?'驿马星动':'马入命宫';

  // L10: 乙级星 (58维 - 原版简化计算)
  layers['L10']={};
  for(var yi=0;yi<YIJI_STARS.length;yi++){
    var ysName=YIJI_STARS[yi][0];
    var ysFunc=YIJI_STARS[yi][1];
    var yPos=mod(mingGongIdx+ysName.length*3+ysName.charCodeAt(0)+bazi.year_zhi_idx,12);
    var yPn=PALACES[mod(yPos-mingGongIdx,12)];
    layers['L10'][ysName+'_宫位']=DIZHI[yPos]+'宫('+yPn+')';
    layers['L10'][ysName+'_功能']=ysFunc;
  }

  // L10b: OPT1 乙级星正确安星法
  var yijiPositions=getYijiPositionsWithGan(bazi.year_gan,bazi.year_zhi_idx,lunarMonth,bazi.time_zhi_idx,mingGongIdx);
  layers['L10b']={};
  for(var yi2=0;yi2<YIJI_STARS.length;yi2++){
    var ysName2=YIJI_STARS[yi2][0];
    var ysFunc2=YIJI_STARS[yi2][1];
    var yPos2=yijiPositions[ysName2]!==undefined?yijiPositions[ysName2]:0;
    var yPn2=PALACES[mod(yPos2-mingGongIdx,12)];
    layers['L10b'][ysName2+'_宫位']=DIZHI[yPos2]+'宫('+yPn2+')';
    layers['L10b'][ysName2+'_功能']=ysFunc2;
  }

  // L11: 格局判断 (30维 - 原版)
  layers['L11']={};
  var matchedGejuOrig=checkGeju(starPositions,mingGongIdx,sihua,auxStars,miaoWangMap);
  var matchedNamesOrig={};
  matchedGejuOrig.forEach(function(g){matchedNamesOrig[g.name]=true;});
  for(var gi2=0;gi2<GEJU_DEFINITIONS.length;gi2++){
    layers['L11'][GEJU_DEFINITIONS[gi2].name]=matchedNamesOrig[GEJU_DEFINITIONS[gi2].name]?'✅成立':'—不成立';
  }

  // L11b: OPT4 格局检测补全
  layers['L11b']={};
  var matchedGejuExt=checkGejuExtended(starPositions,mingGongIdx,sihua,auxStars,miaoWangMap,hour,lunarMonth);
  var matchedNamesExt={};
  matchedGejuExt.forEach(function(g){matchedNamesExt[g.name]=true;});
  for(var gi3=0;gi3<GEJU_DEFINITIONS.length;gi3++){
    layers['L11b'][GEJU_DEFINITIONS[gi3].name]=matchedNamesExt[GEJU_DEFINITIONS[gi3].name]?'✅成立':'—不成立';
  }
  // 额外显示OPT4修正说明
  layers['L11b']['OPT4修正说明']='日照雷门格(加白天条件), 日月并明格(修正为太阳巳午+太阴酉戌亥), 月生沧海格(新增太阴子宫守田宅)';

  // L12: 三方四正 (48维)
  layers['L12']={};
  for(var i12=0;i12<PALACES.length;i12++){
    var pIdx12=mod(mingGongIdx+i12,12);
    var sanhe12=SANHE_PALACES[pIdx12];
    var opp12=OPPOSITE_PALACE[pIdx12];
    layers['L12'][PALACES[i12]+'_本宫星']=getPalaceStars(starPositions,pIdx12).join('、')||'空';
    layers['L12'][PALACES[i12]+'_对宫星']=getPalaceStars(starPositions,opp12).join('、')||'空';
    var sanheStars=getPalaceStars(starPositions,sanhe12[0]).concat(getPalaceStars(starPositions,sanhe12[1]));
    var uniqueSanhe=[];
    sanheStars.forEach(function(s){if(uniqueSanhe.indexOf(s)<0)uniqueSanhe.push(s);});
    layers['L12'][PALACES[i12]+'_三合星']=uniqueSanhe.join('、')||'空';
    var sfStars12=getSanheSizhengStars(starPositions,pIdx12);
    layers['L12'][PALACES[i12]+'_四正汇聚']=Object.keys(sfStars12).length+'颗主星';
  }

  // L13: 大限系统 (36维 - 原版)
  layers['L13']={};
  var isYangGan13=['甲','丙','戊','庚','壬'].indexOf(bazi.year_gan)>=0;
  var isMale13=gender==='male';
  var dir13=((isYangGan13&&isMale13)||(!isYangGan13&&!isMale13))?1:-1;
  for(var i13=0;i13<12;i13++){
    var dxIdx13=mod(mingGongIdx+dir13*i13,12);
    var dxStars13=getPalaceStars(starPositions,dxIdx13);
    var dxPn13=PALACES[mod(dxIdx13-mingGongIdx,12)];
    layers['L13']['第'+(i13+1)+'限_年龄']=(i13*10+1)+'-'+(i13*10+10)+'岁';
    layers['L13']['第'+(i13+1)+'限_宫位']=DIZHI[dxIdx13]+'宫('+dxPn13+')';
    layers['L13']['第'+(i13+1)+'限_主星']=dxStars13.length?dxStars13.join('、'):'空宫';
  }

  // L13b: OPT2 大限起运按五行局
  layers['L13b']={};
  var daxianListOpt=calcDaxianWithJu(mingGongIdx,bazi.year_gan,gender,ju);
  for(var i13b=0;i13b<daxianListOpt.length;i13b++){
    var dxOpt=daxianListOpt[i13b];
    var dxStarsOpt=getPalaceStars(starPositions,dxOpt.idx);
    layers['L13b']['第'+(i13b+1)+'限_年龄']=dxOpt.age_range;
    layers['L13b']['第'+(i13b+1)+'限_宫位']=DIZHI[dxOpt.idx]+'宫('+dxOpt.palace+')';
    layers['L13b']['第'+(i13b+1)+'限_主星']=dxStarsOpt.length?dxStarsOpt.join('、'):'空宫';
  }
  layers['L13b']['OPT2说明']='起运年龄='+ju+'岁(五行局数), 阳'+(gender==='male'?'男':'女')+(isYangGan13?'顺行':(gender==='male'?'逆行':'顺行'));

  // L14: 流年系统 (6维 - 原版)
  layers['L14']={};
  var curZhiIdx14=mod(year-4,12);
  var curGanIdx14=mod(year-4,10);
  var curGan14=TIANGAN[curGanIdx14];
  var lnSihua14=SIHUA_TABLE[curGan14]||{};
  layers['L14']['流年干支']=curGan14+DIZHI[curZhiIdx14];
  layers['L14']['流年命宫']=DIZHI[curZhiIdx14]+'宫';
  layers['L14']['流年化禄']=lnSihua14['禄']||'';
  layers['L14']['流年化权']=lnSihua14['权']||'';
  layers['L14']['流年化科']=lnSihua14['科']||'';
  layers['L14']['流年化忌']=lnSihua14['忌']||'';

  // L14b: OPT3 流年系统完善
  layers['L14b']=calcLiunianExtended(year,mingGongIdx,starPositions);

  // L15: 星曜组合 (15维)
  layers['L15']={};
  for(var ci=0;ci<STAR_COMBINATIONS.length;ci++){
    var combo=STAR_COMBINATIONS[ci];
    var cStars=combo.stars;
    var cPositions=cStars.map(function(s){return starPositions[s]!==undefined?starPositions[s]:-1;});
    var samePalace=cPositions.length>0&&cPositions.every(function(p){return p===cPositions[0]&&p>=0;});
    var sanheCheck=false;
    if(cStars.length===3&&cPositions[0]>=0){
      var sp15=SANHE_PALACES[cPositions[0]];
      if(sp15.indexOf(cPositions[1])>=0&&sp15.indexOf(cPositions[2])>=0)sanheCheck=true;
    }
    var status15;
    if(samePalace)status15='同宫';
    else if(sanheCheck)status15='三合会照';
    else if(cPositions[0]>=0&&cPositions[1]>=0&&Math.abs(cPositions[0]-cPositions[1])===6)status15='对宫';
    else status15='分散';
    layers['L15'][combo.name]=status15+' - '+combo.desc;
  }

  // L16: 宫位互涉 (12维)
  layers['L16']={};
  for(var i16=0;i16<PALACES.length;i16++){
    var pIdx16=mod(mingGongIdx+i16,12);
    var oppIdx16=OPPOSITE_PALACE[pIdx16];
    var oppName16=PALACES[mod(oppIdx16-mingGongIdx,12)];
    layers['L16'][PALACES[i16]+'_对宫']=oppName16;
  }

  // L17: 命盘格局 (10维)
  var mingStars17=getPalaceStars(starPositions,mingGongIdx);
  var mingMw17={};mingStars17.forEach(function(s){mingMw17[s]=miaoWangMap[s]||'平';});
  var sfStars17=getSanheSizhengStars(starPositions,mingGongIdx);
  var strongCnt17=0,weakCnt17=0;
  for(var mw17 in mingMw17){if(mingMw17[mw17]==='庙'||mingMw17[mw17]==='旺')strongCnt17++;if(mingMw17[mw17]==='陷')weakCnt17++;}
  var panStrength='命宫中等';if(strongCnt17>weakCnt17)panStrength='命宫强';else if(weakCnt17>strongCnt17)panStrength='命宫弱';
  var gejuGuige=0,gejuFuge=0;
  matchedGejuExt.forEach(function(g){if(g.type==='贵格'||g.type==='武贵格')gejuGuige++;if(g.type==='富格')gejuFuge++;});
  var level17='杂格';if(gejuGuige>=2)level17='贵格突出';else if(gejuFuge>=2)level17='富格突出';else if(gejuGuige+gejuFuge>=1)level17='有成格';
  var shaCnt17=0,jiCnt17=0;
  var sfAll17=[mingGongIdx].concat(SANHE_PALACES[mingGongIdx]).concat([OPPOSITE_PALACE[mingGongIdx]]);
  ['擎羊','陀罗','火星','铃星','地空','地劫'].forEach(function(s){if(sfAll17.indexOf(auxStars[s]||-1)>=0)shaCnt17++;});
  ['左辅','右弼','天魁','天钺','文昌','文曲'].forEach(function(s){if(sfAll17.indexOf(auxStars[s]||-1)>=0)jiCnt17++;});

  layers['L17']={};
  layers['L17']['命宫主星']=mingStars17.length?mingStars17.join('、'):'空宫';
  layers['L17']['命宫庙旺']=mingStars17.length?mingStars17.map(function(s){return s+'('+mingMw17[s]+')';}).join('、'):'空宫';
  layers['L17']['命盘强弱']=panStrength;
  layers['L17']['富贵层次']=level17;
  layers['L17']['成立格局数']=matchedGejuExt.length+'个';
  layers['L17']['成立格局名']=matchedGejuExt.length?matchedGejuExt.map(function(g){return g.name;}).join('、'):'无成格';
  layers['L17']['三方四正吉星数']=jiCnt17+'颗';
  layers['L17']['三方四正煞星数']=shaCnt17+'颗';
  layers['L17']['身宫位置']=DIZHI[shenGongIdx]+'宫('+PALACES[mod(shenGongIdx-mingGongIdx,12)]+')';
  layers['L17']['五行局纳音']=nayin;
  if(ziweiChanged)layers['L17']['OPT5修正']='紫微星位置从'+DIZHI[ziweiPosOrig]+'宫修正为'+DIZHI[ziweiPosNew]+'宫';

  // === 计算总维度 ===
  var totalDims=0;
  for(var lk in layers){if(layers.hasOwnProperty(lk))totalDims+=Object.keys(layers[lk]).length;}

  // === 渲染核心信息 ===
  var yinYang=GAN_YINYANG[bazi.year_gan]||'';
  var coreItems=[
    {label:'阴阳',value:yinYang+'('+GAN_WUXING[bazi.year_gan]+')'},
    {label:'五行局',value:juNames[ju]||(ju+'局')+' / 纳音:'+nayin},
    {label:'命宫',value:mingGongGan+mingGongZhi+'宫'},
    {label:'紫微星位置',value:DIZHI[ziweiPos]+'宫'+(ziweiChanged?' (OPT5修正)':'')},
    {label:'天府星位置',value:DIZHI[tianfuPos]+'宫'},
    {label:'四化概要',value:'禄→'+(sihua['禄']||'')+' 权→'+(sihua['权']||'')+' 科→'+(sihua['科']||'')+' 忌→'+(sihua['忌']||'')},
    {label:'年柱',value:bazi.year_gan+bazi.year_zhi},
    {label:'月柱',value:bazi.month_gan+bazi.month_zhi},
    {label:'日柱',value:bazi.day_gan+bazi.day_zhi},
    {label:'时柱',value:bazi.time_gan+bazi.time_zhi},
    {label:'总维度',value:totalDims+'维 (17层+4优化层)'},
    {label:'命宫主星',value:mingStars17.length?mingStars17.join('、'):'空宫'}
  ];
  var coreHtml='';
  for(var ci2=0;ci2<coreItems.length;ci2++){
    coreHtml+='<div class="core-item"><div class="label">'+coreItems[ci2].label+'</div><div class="value">'+coreItems[ci2].value+'</div></div>';
  }
  document.getElementById('coreGrid').innerHTML=coreHtml;

  // === 渲染OPT卡片 ===
  var optCards=[
    {title:'OPT1: 乙级星正确安星法',theory:'《安星诀》《排盘步骤详解》',impl:'按传统安星法计算29颗乙级星位置，替代伪随机哈希。红鸾从卯起逆数年支，天刑从酉起顺数月，华盖从辰起顺数年支等。'},
    {title:'OPT2: 大限起运按五行局',theory:'《五行局原理》《五行局完全指南》',impl:'起运年龄=五行局数(水2/木3/金4/土5/火6)，阳男阴女顺行，阴男阳女逆行，每十年一宫。'},
    {title:'OPT3: 流年系统完善',theory:'《流年完全指南》',impl:'流年命宫+流年四化落宫+流年十二宫重排，从6维扩展到12维。'},
    {title:'OPT4: 格局检测补全',theory:'《紫微格局》《天机玄鉴》',impl:'修正日月并明格(太阳巳午+太阴酉戌亥)，补充月生沧海格(太阴子宫守田宅)，完善日照雷门格(加白天条件)。'},
    {title:'OPT5: 紫微星定位修正',theory:'《手把手紫微排盘》《排盤原理》',impl:'处理整除和奇偶调整的边界情况。当商为1时特殊处理丑宫，不整除时按补数x奇偶性决定顺逆。当前: '+(ziweiChanged?'已修正 '+DIZHI[ziweiPosOrig]+'→'+DIZHI[ziweiPosNew]:'无变化')}
  ];
  var optHtml='';
  for(var oi=0;oi<optCards.length;oi++){
    optHtml+='<div class="opt-card"><h3>'+optCards[oi].title+'</h3>';
    optHtml+='<div class="opt-theory">理论依据: '+optCards[oi].theory+'</div>';
    optHtml+='<div class="opt-impl">实现方式: '+optCards[oi].impl+'</div></div>';
  }
  document.getElementById('optCards').innerHTML=optHtml;

  // === 渲染21个折叠面板 ===
  var panelDefs=[
    {id:'L1',title:'L1 基础排盘 (8维)',layer:'L1'},
    {id:'L2',title:'L2 十四主星坐宫 (14维)',layer:'L2'},
    {id:'L3',title:'L3 主星庙旺平陷 (14维)',layer:'L3'},
    {id:'L4',title:'L4 主星属性 (98维)',layer:'L4'},
    {id:'L5',title:'L5 十二宫吉凶 (48维)',layer:'L5'},
    {id:'L6',title:'L6 四化系统 (12维)',layer:'L6'},
    {id:'L7',title:'L7 六吉星 (18维)',layer:'L7'},
    {id:'L8',title:'L8 六煞星 (18维)',layer:'L8'},
    {id:'L9',title:'L9 禄马配置 (4维)',layer:'L9'},
    {id:'L10',title:'L10 乙级星-原版 (58维)',layer:'L10'},
    {id:'L10b',title:'L10b OPT1 乙级星正确安星法 (58维)',layer:'L10b'},
    {id:'L11',title:'L11 格局判断-原版 (30维)',layer:'L11'},
    {id:'L11b',title:'L11b OPT4 格局检测补全 (30维+)',layer:'L11b'},
    {id:'L12',title:'L12 三方四正 (48维)',layer:'L12'},
    {id:'L13',title:'L13 大限系统-原版 (36维)',layer:'L13'},
    {id:'L13b',title:'L13b OPT2 大限起运按五行局 (36维+)',layer:'L13b'},
    {id:'L14',title:'L14 流年系统-原版 (6维)',layer:'L14'},
    {id:'L14b',title:'L14b OPT3 流年系统完善 (12维)',layer:'L14b'},
    {id:'L15',title:'L15 星曜组合 (15维)',layer:'L15'},
    {id:'L16',title:'L16 宫位互涉 (12维)',layer:'L16'},
    {id:'L17',title:'L17 命盘格局 (10维+)',layer:'L17'}
  ];

  var panelsHtml='';
  for(var pi=0;pi<panelDefs.length;pi++){
    var pd=panelDefs[pi];
    var data=layers[pd.layer]||{};
    var tableHtml='<table class="layer-table">';
    for(var dk in data){
      if(data.hasOwnProperty(dk)){
        var val=data[dk];
        var valClass='';
        if(typeof val==='string'&&val.indexOf('✅')>=0)valClass=' class="geju-yes"';
        else if(typeof val==='string'&&val.indexOf('—')>=0)valClass=' class="geju-no"';
        tableHtml+='<tr><td>'+dk+'</td><td'+valClass+'>'+val+'</td></tr>';
      }
    }
    tableHtml+='</table>';
    panelsHtml+='<div class="panel">';
    panelsHtml+='<div class="panel-header" onclick="toggleLayer(this)"><span class="panel-title">'+pd.title+'</span><span class="panel-arrow">▶</span></div>';
    panelsHtml+='<div class="panel-body">'+tableHtml+'</div>';
    panelsHtml+='</div>';
  }
  document.getElementById('panels').innerHTML=panelsHtml;
}

// ============================================================
// Part 4: UI交互函数
// ============================================================
function toggleLayer(elem){
  elem.classList.toggle('open');
  var body=elem.nextElementSibling;
  if(body)body.classList.toggle('open');
}

// 页面加载后自动执行排盘
generate();
</script>
</body>
</html>
