.highlight-item.gold .value{color:#f1c40f}

.opt-card .opt-detail{color:#5dade2;font-size:13px;margin-top:4px}

var XIAO_XIANG_FULL={"乾为天":"初九潜藏勿用，九二见龙在田，九三终日乾乾，九四或跃在渊，九五飞龙在天，上九亢龙有悔","坤为地":"初六履霜坚冰，六二直方大不习无不利，六三含章可贞，六四括囊无咎，六五黄裳元吉，上六龙战于野","水雷屯":"初九磐桓居贞，六二屯如邅如，六三即鹿无虞，六四乘马班如，九五屯其膏，上六泣血涟如","山水蒙":"初六发蒙利用刑人，九二包蒙吉，六三勿用取女，六四困蒙吝，六五童蒙吉，上九击蒙不利为寇","水天需":"初九需于郊不犯难，九二需于沙小有言，九三需于泥致寇至，六四需于血出自穴，九五需于酒食贞吉，上六入于穴不速之客来","天水讼":"初六不永所事，九二不克讼归逋，六三食旧德，九四不克讼复即命，九五讼元吉，上九或锡之鞶带终朝三褫","地水师":"初六师出以律否臧凶，九二在师中吉，六三师或舆尸凶，六四师左次无咎，六五田有禽利执言，上六大君有命开国承家","水地比":"初六有孚比之无咎，六二比之自内贞吉，六三比之匪人不亦伤乎，六四外比之贞吉，九五显比王用三驱，上六比之无首凶","风天小畜":"初九复自道何其咎，九二牵复吉，九三舆说辐夫妻反目，六四有孚血去惕出，九五有孚挛如富以其邻，上九既雨既处尚德载","天泽履":"初九素履往无咎，九二履道坦坦幽人贞吉，六三眇能视跛能履履虎尾咥人凶，九四履虎尾愬愬终吉，九五夬履贞厉，上九视履考祥其旋元吉","地天泰":"初九拔茅茹以其汇征吉，九二包荒用冯河不遐遗，九三无平不陂无往不复，六四翩翩不富以其邻，六五帝乙归妹以祉元吉，上六城复于隍勿用师","天地否":"初六拔茅茹以其汇贞吉，六二包承小人吉大人否，六三包羞，九四有命无咎畴离祉，九五休否大人吉其亡其亡，上九倾否先否后喜","天火同人":"初九同人于门无咎，六二同人于宗吝，九三伏戎于莽升其高陵，九四乘其墉弗克攻吉，九五同人先号咷而后笑大师克相遇，上九同人于郊无悔","火天大有":"初九无交害匪咎艰则无咎，九二大车以载有攸往无咎，九三公用亨于天子小人弗克，九四匪其彭无咎，六五厥孚交如威如吉，上九自天佑之吉无不利","地山谦":"初六谦谦君子用涉大川吉，六二鸣谦贞吉，九三劳谦君子有终吉，六四无不利撝谦，六五不富以其邻利用侵伐，上六鸣谦利用行师征邑国","雷地豫":"初六鸣豫凶，六二介于石不终日贞吉，六三盱豫悔迟有悔，九四由豫大有得勿疑朋盍簪，六五贞疾恒不死，上六冥豫成有渝无咎","泽雷随":"初九官有渝贞吉出门交有功，六二系小子失丈夫，六三系丈夫失小子随有求得，九四随有获贞凶有孚在道明，九五孚于嘉吉，上六拘系之乃从维之","山风蛊":"初六干父之蛊有子考无咎，九二干母之蛊不可贞，九三干父之蛊小有悔无大咎，六四裕父之蛊往见吝，六五干父之蛊用誉，上九不事王侯高尚其事","地泽临":"初九咸临贞吉，九二咸临吉无不利，六三甘临无攸利既忧之无咎，六四至临无咎，六五知临大君之宜吉，上六敦临吉无咎","风地观":"初六童观小人无咎君子吝，六二窥观利女贞，六三观我生进退，六四观国之光利用宾于王，九五观我生君子无咎，上九观其生君子无咎","火雷噬嗑":"初九屦校灭趾无咎，六二噬肤灭鼻无咎，六三噬腊肉遇毒小吝无咎，九四噬干胏得金矢利艰贞吉，六五噬干肉得黄金贞厉无咎，上九何校灭耳凶","山火贲":"初九贲其趾舍车而徒，六二贲其须，九三贲如濡如永贞吉，六四贲如皤如白马翰如匪寇婚媾，六五贲于丘园束帛戋戋吝终吉，上九白贲无咎","山地剥":"初六剥床以足蔑贞凶，六二剥床以辨蔑贞凶，六三剥之无咎，六四剥床以肤凶，六五贯鱼以宫人宠无不利，上九硕果不食君子得舆小人剥庐","地雷复":"初九不远复无祗悔元吉，六二休复吉，六三频复厉无咎，六四中行独复，六五敦复无悔，上六迷复凶有灾眚","天雷无妄":"初九无妄往吉，六二不耕获不菑畲则利有攸往，六三无妄之灾或系之牛行人之得邑人之灾，九四可贞无咎，九五无妄之疾勿药有喜，上九无妄行有眚无攸利","山天大畜":"初九有厉利已，九二舆说輹，九三良马逐利艰贞日闲舆卫利有攸往，六四童牛之牿元吉，六五豮豕之牙吉，上九何天之衢亨","山雷颐":"初九舍尔灵龟观我朵颐凶，六二颠颐拂经于丘颐征凶，六三拂颐贞凶十年勿用无攸利，六四颠颐吉虎视眈眈其欲逐逐无咎，六五拂经居贞吉不可涉大川，上九由颐厉吉利涉大川","泽风大过":"初六藉用白茅无咎，九二枯杨生稊老夫得其女妻无不利，九三栋桡凶，九四栋隆吉有它吝，九五枯杨生华老妇得其士夫无咎无誉，上六过涉灭顶凶无咎","坎为水":"初六习坎入于坎窞凶，九二坎有险求小得，六三来之坎坎险且枕入于坎窞勿用，六四樽酒簋贰用缶纳约自牖终无咎，九五坎不盈祗既平无咎，上六系用徽纆置于丛棘三岁不得凶","离为火":"初九履错然敬之无咎，六二黄离元吉，九三日昃之离不鼓缶而歌则大耋之嗟凶，九四突如其来如焚如死如弃如，六五出涕沱若戚嗟若吉，上九王用出征有嘉折首获匪其丑无咎","泽山咸":"初六咸其拇，六二咸其腓凶居吉，九三咸其股执其随往吝，九四贞吉悔亡憧憧往来朋从尔思，九五咸其脢无悔，上六咸其辅颊舌","雷风恒":"初六浚恒贞凶无攸利，九二悔亡，九三不恒其德或承之羞贞吝，九四田无禽，六五恒其德贞妇人吉夫子凶，上六振恒凶","天山遁":"初六遁尾厉勿用有攸往，六二执之用黄牛之革莫之胜说，九三系遁有疾厉畜臣妾吉，九四好遁君子吉小人否，九五嘉遁贞吉，上九肥遁无不利","雷天大壮":"初九壮于趾征凶有孚，九二贞吉，九三小人用壮君子用罔贞厉羝羊触藩羸其角，九四贞吉悔亡藩决不羸壮于大舆之輹，六五丧羊于易无悔，上六羝羊触藩不能退不能遂无攸利艰则吉","火地晋":"初六晋如摧如贞吉罔孚裕无咎，六二晋如愁如贞吉受兹介福于其王母，六三众允悔亡，九四晋如鼫鼠贞厉，六五悔亡失得勿恤往吉无不利，上九晋其角维用伐邑厉吉无咎贞吝","地火明夷":"初九明夷于飞垂其翼君子于行三日不食有攸往主人有言，六二明夷夷于左股用拯马壮吉，九三明夷于南狩得其大首不可疾贞，六四入于左腹获明夷之心于出门庭，六五箕子之明夷利贞，上六不明晦初登于天后入于地","风火家人":"初九闲有家悔亡，六二无攸遂在中馈贞吉，九三家人嗃嗃悔厉吉妇子嘻嘻终吝，六四富家大吉，九五王假有家勿恤吉，上九有孚威如终吉","火泽睽":"初九悔亡丧马勿逐自复见恶人无咎，九二遇主于巷无咎，六三见舆曳其牛掣其人天且劓无初有终，九四睽孤遇元夫交孚厉无咎，六五悔亡厥宗噬肤往何咎，上九睽孤见豕负涂载鬼一车先张之弧后说之弧匪寇婚媾往遇雨则吉","水山蹇":"初六往蹇来誉，六二王臣蹇蹇匪躬之故，九三往蹇来反，六四往蹇来连，九五大蹇朋来，上六往蹇来硕吉利见大人","雷水解":"初六无咎，九二田获三狐得黄矢贞吉，六三负且乘致寇至贞吝，九四解而拇朋至斯孚，六五君子维有解吉有孚于小人，上六公用射隼于高墉之上获之无不利","山泽损":"初九已事遄往无咎酌损之，九二利贞征凶勿用损益之，六三三人行则损一人一人行则得其友，六四损其疾使遄有喜无咎，六五或益之十朋之龟弗克违元吉，上九弗损益之无咎贞吉利有攸往得臣无家","风雷益":"初九利用为大作元吉无咎，六二或益之十朋之龟弗克违永贞吉王用享于帝吉，六三益之用凶事无咎有孚中行告公用圭，六四中行告公从利用为依迁国，九五有孚惠心勿问元吉有孚惠我德，上九莫益之或击之立心勿恒凶","泽天夬":"初九壮于前趾往不胜为咎，九二惕号莫夜有戎勿恤，九三壮于頄有凶君子夬夬独行遇雨若濡有愠无咎，九四臀无肤其行次且牵羊悔亡闻言不信，九五苋陆夬夬中行无咎，上六无号终有凶","天风姤":"初六系于金柅贞吉有攸往见凶羸豕孚蹢躅，九二包有鱼无咎不利宾，九三臀无肤其行次且厉无大咎，九四包无鱼起凶，九五以杞包瓜含章有陨自天，上九姤其角吝无咎","泽地萃":"初六有孚不终乃乱乃萃若号一握为笑勿恤往无咎，六二引吉无咎孚乃利用禴，六三萃如嗟如无攸利往无咎小吝，九四大吉无咎，九五萃有位无咎匪孚元永贞悔亡，上六赍咨涕洟无咎","地风升":"初六允升大吉，九二孚乃利用禴无咎，九三升虚邑，六四王用亨于岐山吉无咎，六五贞吉升阶，上六冥升利于不息之贞","泽水困":"初六臀困于株木入于幽谷三岁不觌，九二困于酒食朱绂方来利用享祀征凶无咎，六三困于石据于蒺藜入于其宫不见其妻凶，九四来徐徐困于金车吝有终，九五劓刖困于赤绂乃徐有说利用祭祀，上六困于葛藟于臲卼曰动悔有悔征吉","水风井":"初六井泥不食旧井无禽，九二井谷射鲋瓮敝漏，九三井渫不食为我心恻可用汲王明并受其福，六四井甃无咎，九五井冽寒泉食，上六井收勿幕有孚元吉","泽火革":"初九巩用黄牛之革，六二己日乃革之征吉无咎，九三征凶贞厉革言三就有孚，九四悔亡有孚改命吉，九五大人虎变未占有孚，上六君子豹变小人革面征凶居贞吉","火风鼎":"初六鼎颠趾利出否得妾以其子无咎，九二鼎有实我仇有疾不我能即吉，九三鼎耳革其行塞雉膏不食方雨亏悔终吉，九四鼎折足覆公餗其形渥凶，六五鼎黄耳金铉利贞，上九鼎玉铉大吉无不利","震为雷":"初九震来虩虩后笑言哑哑吉，六二震来厉亿丧贝跻于九陵勿逐七日得，六三震苏苏震行无眚，九四震遂泥，六五震往来厉亿无丧有事，上六震索索视矍矍征凶震不于其躬于其邻无咎婚媾有言","艮为山":"初六艮其趾无咎利永贞，六二艮其腓不拯其随其心不快，九三艮其限列其夤厉熏心，六四艮其身无咎，六五艮其辅言有序悔亡，上九敦艮吉","风山渐":"初六鸿渐于干小子厉有言无咎，六二鸿渐于磐饮食衎衎吉，九三鸿渐于陆夫征不复妇孕不育凶利用御寇，六四鸿渐于木或得其桷无咎，九五鸿渐于陵妇三岁不孕终莫之胜吉，上九鸿渐于陆其羽可用为仪吉","雷泽归妹":"初九归妹以娣跛能履征吉，九二眇能视利幽人之贞，六三归妹以须反归以娣，九四归妹愆期迟归有时，六五帝乙归妹其君之袂不如其娣之袂良月几望吉，上六女承筐无实士刲羊无血无攸利","雷火丰":"初九遇其配主虽旬无咎往有尚，六二丰其蔀日中见斗往得疑疾有孚发若吉，九三丰其沛日中见沫折其右肱无咎，九四丰其蔀日中见斗遇其夷主吉，六五来章有庆誉吉，上六丰其屋蔀其家窥其户阒其无人三岁不觌凶","火山旅":"初六旅琐琐斯其所取灾，六二旅即次怀其资得童仆贞，九三旅焚其次丧其童仆贞厉，九四旅于处得其资斧我心不快，六五射雉一矢亡终以誉命，上九鸟焚其巢旅人先笑后号咷丧牛于易凶","巽为风":"初六进退利武人之贞，九二巽在床下用史巫纷若吉无咎，九三频巽吝，六四悔亡田获三品，九五贞吉悔亡无不利无初有终先庚三日後庚三日吉，上九巽在床下丧其资斧贞凶","兑为泽":"初九和兑吉，九二孚兑吉悔亡，六三来兑凶，九四商兑未宁介疾有喜，九五孚于剥有厉，上六引兑","风水涣":"初六用拯马壮吉，九二涣奔其机悔亡，六三涣其躬无悔，六四涣其群元吉涣有丘匪夷所思，九五涣汗其大号涣王居无咎，上九涣其血去逖出无咎","水泽节":"初九不出户庭无咎，九二不出门庭凶，六三不节若则嗟若无咎，六四安节亨，九五甘节吉往有尚，上六苦节贞凶悔亡","风泽中孚":"初九虞吉有它不燕，九二鸣鹤在阴其子和之我有好爵吾与尔靡之，六三得敌或鼓或罢或泣或歌，六四月几望马匹亡无咎，九五有孚挛如无咎，上九翰音登于天贞凶","雷山小过":"初六飞鸟以凶，六二过其祖遇其妣不及其君遇其臣无咎，九三弗过防之从或戕之凶，九四无咎弗过遇之往厉必戒勿用永贞，六五密云不雨自我西郊公弋取彼在穴，上六弗遇过之飞鸟离之凶是谓灾眚","水火既济":"初九曳其轮濡其尾无咎，六二妇丧其茀勿逐七日得，九三高宗伐鬼方三年克之小人勿用，六四繻有衣袽终日戒，九五东邻杀牛不如西邻之禴祭实受其福，上六濡其首厉","火水未济":"初六濡其尾吝，九二曳其轮贞吉，六三未济征凶利涉大川，九四贞吉悔亡震用伐鬼方三年有赏于大国，六五贞吉无悔君子之光有孚吉，上九有孚于饮酒无咎濡其首有孚失是"};
var GUA_CI={"乾为天":"元亨利贞","坤为地":"元亨，利牝马之贞","水雷屯":"元亨利贞，勿用有攸往","山水蒙":"亨。匪我求童蒙，童蒙求我","水天需":"有孚，光亨，贞吉","天水讼":"有孚窒惕，中吉，终凶","地水师":"贞，丈人吉，无咎","水地比":"吉，原筮，元永贞，无咎","风天小畜":"亨。密云不雨，自我西郊","天泽履":"履虎尾，不咥人，亨","地天泰":"小往大来，吉亨","天地否":"否之匪人，不利君子贞","天火同人":"同人于野，亨","火天大有":"元亨","地山谦":"亨，君子有终","雷地豫":"利建侯行师","泽雷随":"元亨利贞，无咎","山风蛊":"元亨，利涉大川","地泽临":"元亨利贞，至于八月有凶","风地观":"盥而不荐，有孚颙若","火雷噬嗑":"亨，利用狱","山火贲":"亨，小利有攸往","山地剥":"不利有攸往","地雷复":"亨，出入无疾","天雷无妄":"元亨利贞，其匪正有眚","山天大畜":"利贞，不家食吉","山雷颐":"贞吉，观颐，自求口实","泽风大过":"栋桡，利有攸往，亨","坎为水":"习坎，有孚，维心亨","离为火":"利贞，亨，畜牝牛吉","泽山咸":"亨，利贞，取女吉","雷风恒":"亨，无咎，利贞","天山遁":"亨，小利贞","雷天大壮":"利贞","火地晋":"康侯用锡马蕃庶，昼日三接","地火明夷":"利艰贞","风火家人":"利女贞","火泽睽":"小事吉","水山蹇":"利西南，不利东北","雷水解":"利西南，无所往，其来复吉","山泽损":"有孚，元吉，无咎","风雷益":"利有攸往，利涉大川","泽天夬":"扬于王庭，孚号有厉","天风姤":"女壮，勿用取女","泽地萃":"亨，王假有庙","地风升":"元亨，用见大人","泽水困":"亨，贞，大人吉","水风井":"改邑不改井，无丧无得","泽火革":"己日乃孚，元亨利贞","火风鼎":"元吉，亨","震为雷":"亨，震来虩虩，笑言哑哑","艮为山":"艮其背，不获其身","风山渐":"女归吉，利贞","雷泽归妹":"征凶，无攸利","雷火丰":"亨，王假之，勿忧","火山旅":"小亨，旅贞吉","巽为风":"小亨，利有攸往，利见大人","兑为泽":"亨，利贞","风水涣":"亨，王假有庙，利涉大川","水泽节":"亨，苦节不可贞","风泽中孚":"豚鱼吉，利涉大川","雷山小过":"亨，利贞，可小事","水火既济":"亨小，利贞，初吉终乱","火水未济":"亨，小狐汔济，濡其尾"};
var TUAN_ZHUAN={"乾为天":"大哉乾元，万物资始，乃统天","坤为地":"至哉坤元，万物资生，乃顺承天","水雷屯":"屯，刚柔始交而难生，动乎险中，大亨贞。雷雨之动满盈，天造草昧，宜建侯而不宁","山水蒙":"蒙，山下有险，险而止，蒙。蒙亨，以亨行时中也。匪我求童蒙，童蒙求我，志应也。初筮告，以刚中也。再三渎，渎则不告，渎蒙也。蒙以养正，圣功也","水天需":"需，须也。险在前也。刚健而不陷，其义不困穷矣。需有孚，光亨，贞吉。位乎天位，以正中也。利涉大川，往有功也","天水讼":"讼，上刚下险，险而健，讼。讼有孚窒惕，中吉，刚来而得中也。终凶，讼不可成也。利见大人，尚中正也。不利涉大川，入于渊也","地水师":"师，众也。贞，正也。能以众正，可以王矣。刚中而应，行险而顺，以此毒天下而民从之，吉又何咎矣","水地比":"比，吉也。比，辅也，下顺从也。原筮元永贞，无咎，以刚中也。不宁方来，上下应也。后夫凶，其道穷也","风天小畜":"小畜，柔得位而上下应之，曰小畜。健而巽，刚中而志行，乃亨。密云不雨，尚往也。自我西郊，施未行也","天泽履":"履，柔履刚也。说而应乎乾，是以履虎尾，不咥人，亨。刚中正，履帝位而不疚，光明也","地天泰":"泰，小往大来，吉亨。则是天地交而万物通也，上下交而其志同也。内阳而外阴，内健而外顺，内君子而外小人，君子道长，小人道消也","天地否":"否之匪人，不利君子贞，大往小来。则是天地不交而万物不通也，上下不交而天下无邦也。内阴而外阳，内柔而外刚，内小人而外君子，小人道长，君子道消也","天火同人":"同人，柔得位得中而应乎乾，曰同人。同人曰：同人于野，亨。利涉大川，乾行也。文明以健，中正而应，君子正也。唯君子为能通天下之志","火天大有":"大有，柔得尊位大中，而上下应之，曰大有。其德刚健而文明，应乎天而时行，是以元亨","地山谦":"谦亨，天道下济而光明，地道卑而上行。天道亏盈而益谦，地道变盈而流谦，鬼神害盈而福谦，人道恶盈而好谦。谦尊而光，卑而不可逾，君子之终也","雷地豫":"豫，刚应而志行，顺以动，豫。豫顺以动，故天地如之，而况建侯行师乎。天地以顺动，故日月不过，而四时不忒。圣人以顺动，则刑罚清而民服。豫之时义大矣哉","泽雷随":"随，刚来而下柔，动而说，随。大亨贞，无咎，而天下随时。随时之义大矣哉","山风蛊":"蛊，刚上而柔下，巽而止，蛊。蛊元亨，而天下治也。利涉大川，往有事也。先甲三日，后甲三日，终则有始，天行也","地泽临":"临，刚浸而长。说而顺，刚中而应。大亨以正，天之道也。至于八月有凶，消不久也","风地观":"观，盥而不荐，有孚颙若，下观而化也。观天之神道，而四时不忒。圣人以神道设教，而天下服矣","火雷噬嗑":"颐中有物曰噬嗑。噬嗑而亨。刚柔分，动而明，雷电合而章。柔得中而上行，虽不当位，利用狱也","山火贲":"贲亨，柔来而文刚，故亨。分刚上而文柔，故小利有攸往。天文也。文明以止，人文也。观乎天文以察时变，观乎人文以化成天下","山地剥":"剥，剥也，柔变刚也。不利有攸往，小人长也。顺而止之，观象也。君子尚消息盈虚，天行也","地雷复":"复亨，刚反，动而以顺行，是以出入无疾，朋来无咎。反复其道，七日来复，天行也。利有攸往，刚长也。复，其见天地之心乎","天雷无妄":"无妄，刚自外来而为主于内，动而健，刚中而应。大亨以正，天之命也。其匪正有眚，不利有攸往，无妄之往，何之矣。天命不祐，行矣哉","山天大畜":"大畜，刚健笃实辉光，日新其德。刚上而尚贤，能止健，大正也。不家食吉，养贤也。利涉大川，应乎天也","山雷颐":"颐，贞吉，养正则吉也。观颐，观其所养也。自求口实，观其自养也。天地养万物，圣人养贤以及万民。颐之时大矣哉","泽风大过":"大过，大者过也。栋桡，本末弱也。刚过而中，巽而说行，利有攸往，乃亨。大过之时大矣哉","坎为水":"习坎，重险也。水流而不盈，行险而不失其信。维心亨，乃以刚中也。行有尚，往有功也。天险不可升也，地险山川丘陵也，王公设险以守其国，险之时用大矣哉","离为火":"离，丽也。日月丽乎天，百谷草木丽乎土。重明以丽乎正，乃化成天下。柔丽乎中正，故亨，是以畜牝牛吉也","泽山咸":"咸，感也。柔上而刚下，二气感应以相与。止而说，男下女，是以亨利贞，取女吉也。天地感而万物化生，圣人感人心而天下和平。观其所感，而天地万物之情可见矣","雷风恒":"恒，久也。刚上而柔下，雷风相与，巽而动，刚柔皆应，恒。恒亨无咎利贞，久于其道也。天地之道，恒久而不已也。利有攸往，终则有始也。日月得天而能久照，四时变化而能久成，圣人久于其道而天下化成。观其所恒，而天地万物之情可见矣","天山遁":"遁亨，遁而亨也。刚当位而应，与时行也。小利贞，浸而长也。遁之时义大矣哉","雷天大壮":"大壮，大者壮也。刚以动，故壮。大壮利贞，大者正也。正大而天地之情可见矣","火地晋":"晋，进也。明出地上，顺而丽乎大明，柔进而上行，是以康侯用锡马蕃庶，昼日三接也","地火明夷":"明入地中，明夷。内文明而外柔顺，以蒙大难，文王以之。利艰贞，晦其明也，内难而能正其志，箕子以之","风火家人":"家人，女正位乎内，男正位乎外。男女正，天地之大义也。家人有严君焉，父母之谓也。父父，子子，兄兄，弟弟，夫夫，妇妇，而家道正。正家而天下定矣","火泽睽":"睽，火动而上，泽动而下，二女同居，其志不同行。说而丽乎明，柔进而上行，得中而应乎刚，是以小事吉。天地睽而其事同也，男女睽而其志通也，万物睽而其事类也，睽之时用大矣哉","水山蹇":"蹇，难也，险在前也。见险而能止，知矣哉。蹇利西南，往得中也。不利东北，其道穷也。利见大人，往有功也。当位贞吉，以正邦也。蹇之时用大矣哉","雷水解":"解，险以动，动而免乎险，解。解利西南，往得众也。其来复吉，乃得中也。有攸往夙吉，往有功也。天地解而雷雨作，雷雨作而百果草木皆甲坼。解之时大矣哉","山泽损":"损，损下益上，其道上行。损而有孚，元吉，无咎，可贞，利有攸往。曷之用，二簋可用享，二簋应有时，损刚益柔有时。损益盈虚，与时偕行","风雷益":"益，损上益下，民说无疆。自上下下，其道大光。利有攸往，中正有庆。利涉大川，木道乃行。益动而巽，日进无疆。天施地生，其益无方。凡益之道，与时偕行","泽天夬":"夬，决也，刚决柔也。健而说，决而和。扬于王庭，柔乘五刚也。孚号有厉，其危乃光也。告自邑，不利即戎，所尚乃穷也。利有攸往，刚长乃终也","天风姤":"姤，遇也，柔遇刚也。勿用取女，不可与长也。天地相遇，品物咸章也。刚遇中正，天下大行也。姤之时义大矣哉","泽地萃":"萃，聚也。顺以说，刚中而应，故聚也。王假有庙，致孝享也。利见大人亨，聚以正也。用大牲吉，利有攸往，顺天命也。观其所聚，而天地万物之情可见矣","地风升":"柔以时升，巽而顺，刚中而应，是以大亨。用见大人，勿恤，有庆也。南征吉，志行也","泽水困":"困，刚揜也。险以说，困而不失其所亨，其唯君子乎。贞大人吉，以刚中也。有言不信，尚口乃穷也","水风井":"巽乎水而上水，井。井养而不穷也。改邑不改井，乃以刚中也。汔至亦未繘井，未有功也。羸其瓶，是以凶也","泽火革":"革，水火相息，二女同居，其志不相得，曰革。巳日乃孚，革而信之。文明以说，大亨以正，革而当，其悔乃亡。天地革而四时成。汤武革命，顺乎天而应乎人。革之时义大矣哉","火风鼎":"鼎，象也。以木巽火，亨饪也。圣人亨以享上帝，而大亨以养圣贤。巽而耳目聪明，柔进而上行，得中而应乎刚，是以元亨","震为雷":"震亨。震来虩虩，恐致福也。笑言哑哑，后有则也。震惊百里，惊远而惧迩也。出可以守宗庙社稷，以为祭主也","艮为山":"艮，止也。时止则止，时行则行，动静不失其时，其道光明。艮其止，止其所也。上下敌应，不相与也。是以不获其身，行其庭不见其人，无咎也","风山渐":"渐，之进也，女归吉也。进得位，往有功也。进以正，可以正邦也。其位刚得中也。止而巽，动不穷也","雷泽归妹":"归妹，天地之大义也。天地不交而万物不兴。归妹，人之终始也。说以动，所归妹也。征凶，位不当也。无攸利，柔乘刚也","雷火丰":"丰，大也。明以动，故丰。王假之，尚大也。勿忧宜日中，宜照天下也。日中则昃，月盈则食，天地盈虚，与时消息，而况于人乎，况于鬼神乎","火山旅":"旅，小亨。柔得中乎外而顺乎刚，止而丽乎明，是以小亨，旅贞吉也。旅之时义大矣哉","巽为风":"重巽以申命，刚巽乎中正而志行。柔皆顺乎刚，是以小亨，利有攸往，利见大人","兑为泽":"兑，说也。刚中而柔外，说以利贞，是以顺乎天而应乎人。说以先民，民忘其劳。说以犯难，民忘其死。说之大，民劝矣哉","风水涣":"涣亨，刚来而不穷，柔得位乎外而上同。王假有庙，王乃在中也。利涉大川，乘木有功也","水泽节":"节亨，刚柔分而刚得中。苦节不可贞，其道穷也。说以行险，当位以节，中正以通。天地节而四时成。节以制度，不伤财，不害民","风泽中孚":"中孚，柔在内而刚得中。说而巽，孚乃化邦也。豚鱼吉，信及豚鱼也。利涉大川，乘木舟虚也。中孚以利贞，乃应乎天也","雷山小过":"小过，小者过而亨也。过以利贞，与时行也。柔得中，是以小事吉也。刚失位而不中，是以不可大事也。有飞鸟之象焉，飞鸟遗之音，不宜上宜下，大吉，上逆而下顺也","水火既济":"既济亨，小者亨也。利贞，刚柔正而位当也。初吉，柔得中也。终止则乱，其道穷也","火水未济":"未济亨，柔得中也。小狐汔济，未出中也。濡其尾，无攸利，不续终也。虽不当位，刚柔应也"};
var DA_XIANG={"乾为天":"天行健，君子以自强不息","坤为地":"地势坤，君子以厚德载物","水雷屯":"云雷屯，君子以经纶","山水蒙":"山下出泉，蒙。君子以果行育德","水天需":"云上于天，需。君子以饮食宴乐","天水讼":"天与水违行，讼。君子以作事谋始","地水师":"地中有水，师。君子以容民畜众","水地比":"地上有水，比。先王以建万国，亲诸侯","风天小畜":"风行天上，小畜。君子以懿文德","天泽履":"上天下泽，履。君子以辩上下，定民志","地天泰":"天地交，泰。后以财成天地之道，辅相天地之宜","天地否":"天地不交，否。君子以俭德辟难，不可荣以禄","天火同人":"天与火，同人。君子以类族辨物","火天大有":"火在天上，大有。君子以遏恶扬善，顺天休命","地山谦":"地中有山，谦。君子以裒多益寡，称物平施","雷地豫":"雷出地奋，豫。先王以作乐崇德，殷荐之上帝","泽雷随":"泽中有雷，随。君子以向晦入宴息","山风蛊":"山下有风，蛊。君子以振民育德","地泽临":"泽上有地，临。君子以教思无穷，容保民无疆","风地观":"风行地上，观。先王以省方观民设教","火雷噬嗑":"雷电噬嗑。先王以明罚敕法","山火贲":"山下有火，贲。君子以明庶政，无敢折狱","山地剥":"山附于地，剥。上以厚下安宅","地雷复":"雷在地中，复。先王以至日闭关，商旅不行，后不省方","天雷无妄":"天下雷行，物与无妄。先王以茂对时育万物","山天大畜":"天在山中，大畜。君子以多识前言往行，以畜其德","山雷颐":"山下有雷，颐。君子以慎言语，节饮食","泽风大过":"泽灭木，大过。君子以独立不惧，遁世无闷","坎为水":"水洊至，习坎。君子以常德行，习教事","离为火":"明两作，离。大人以继明照于四方","泽山咸":"山上有泽，咸。君子以虚受人","雷风恒":"雷风恒。君子以立不易方","天山遁":"天下有山，遁。君子以远小人，不恶而严","雷天大壮":"雷在天上，大壮。君子以非礼弗履","火地晋":"明出地上，晋。君子以自昭明德","地火明夷":"明入地中，明夷。君子以莅众，用晦而明","风火家人":"风自火出，家人。君子以言有物而行有恒","火泽睽":"上火下泽，睽。君子以同而异","水山蹇":"山上有水，蹇。君子以反身修德","雷水解":"雷雨作，解。君子以赦过宥罪","山泽损":"山下有泽，损。君子以惩忿窒欲","风雷益":"风雷益。君子以见善则迁，有过则改","泽天夬":"泽上于天，夬。君子以施禄及下，居德则忌","天风姤":"天下有风，姤。后以施命诰四方","泽地萃":"泽上于地，萃。君子以除戎器，戒不虞","地风升":"地中生木，升。君子以顺德，积小以高大","泽水困":"泽无水，困。君子以致命遂志","水风井":"木上有水，井。君子以劳民劝相","泽火革":"泽中有火，革。君子以治历明时","火风鼎":"木上有火，鼎。君子以正位凝命","震为雷":"洊雷震。君子以恐惧修省","艮为山":"兼山艮。君子以思不出其位","风山渐":"山上有木，渐。君子以居贤德善俗","雷泽归妹":"泽上有雷，归妹。君子以永终知敝","雷火丰":"雷电皆至，丰。君子以折狱致刑","火山旅":"山上有火，旅。君子以明慎用刑而不留狱","巽为风":"随风巽。君子以申命行事","兑为泽":"丽泽兑。君子以朋友讲习","风水涣":"风行水上，涣。先王以享于帝立庙","水泽节":"泽上有水，节。君子以制数度，议德行","风泽中孚":"泽上有风，中孚。君子以议狱缓死","雷山小过":"山上有雷，小过。君子以行过乎恭，丧过乎哀，用过乎俭","水火既济":"水在火上，既济。君子以思患而预防之","火水未济":"火在水上，未济。君子以慎辨物居方"};

function flipBit(b){return b==='0'?'1':'0';}

function binaryToTrigrams(binary){
var lower=binary.substring(0,3);
var upper=binary.substring(3,6);
return{lower:BINARY_TO_TRIGRAM[lower]||'?',upper:BINARY_TO_TRIGRAM[upper]||'?'};
}

function getHexagramByBinary(binary){
for(var palace in PALACES){
var pure=PALACES[palace]["pure_binary"];
for(var pos=1;pos<=8;pos++){
var changed=pure.split('');
var changes=PALACE_CHANGES[pos];
for(var c=0;c<changes.length;c++){changed[changes[c]]=flipBit(changed[changes[c]]);}
if(changed.join('')===binary){
return{name:PALACES[palace]["names"][pos-1],palace:palace,palacePos:pos,palaceElem:PALACES[palace]["element"]};
}
}
}
return{name:null,palace:null,palacePos:null,palaceElem:null};
}

function cuoHexagram(binary){var r='';for(var i=0;i<binary.length;i++){r+=flipBit(binary[i]);}return r;}
function zongHexagram(binary){return binary.split('').reverse().join('');}
function huHexagram(binary){return binary[1]+binary[2]+binary[3]+binary[2]+binary[3]+binary[4];}
function bianHexagram(binary,movingLine){var lst=binary.split('');lst[movingLine-1]=flipBit(lst[movingLine-1]);return lst.join('');}
function fuHexagram(binary,palace){var pure=PALACES[palace]["pure_binary"];return cuoHexagram(pure);}
function lianHu(binary){var hu=huHexagram(binary);return huHexagram(hu);}

function getLiuQin(zhiElem,palaceElem){
if(zhiElem===palaceElem)return'兄弟';
if(WUXING_SHENG[palaceElem]===zhiElem)return'子孙';
if(WUXING_SHENG[zhiElem]===palaceElem)return'父母';
if(WUXING_KE[palaceElem]===zhiElem)return'妻财';
if(WUXING_KE[zhiElem]===palaceElem)return'官鬼';
return'未知';
}

function getNaJiaForHexagram(binary,palace){
var tr=binaryToTrigrams(binary);
var palaceElem=PALACES[palace]["element"];
var naJiaLower=NA_JIA[tr.lower]["internal"];
var naJiaUpper=NA_JIA[tr.upper]["external"];
var all=naJiaLower.concat(naJiaUpper);
var result=[];
for(var i=0;i<all.length;i++){
var gan=all[i][0],zhi=all[i][1];
var elem=ZHI_WUXING[zhi];
var liuQin=getLiuQin(elem,palaceElem);
result.push({gan:gan,zhi:zhi,element:elem,liuQin:liuQin,ganElement:GAN_WUXING[gan]});
}
return result;
}

function getWuxingRelation(elem1,elem2){
if(elem1===elem2)return'比和';
if(WUXING_SHENG[elem1]===elem2)return'相生';
if(WUXING_SHENG[elem2]===elem1)return'被生';
if(WUXING_KE[elem1]===elem2)return'相克';
if(WUXING_KE[elem2]===elem1)return'被克';
return'无关';
}

function getTiYong(binary){
var tr=binaryToTrigrams(binary);
var tiElem=TRIGRAMS[tr.lower]["element"];
var yongElem=TRIGRAMS[tr.upper]["element"];
var relation=getWuxingRelation(yongElem,tiElem);
var judgments={"比和":"大吉","相生":"吉","被生":"吉","相克":"凶","被克":"凶","无关":"平"};
return{tiTrigram:tr.lower,yongTrigram:tr.upper,tiElement:tiElem,yongElement:yongElem,relation:relation,tiYongJudgment:judgments[relation]||'平'};
}

function getPalacePos(binary,palace){
var pure=PALACES[palace]["pure_binary"];
for(var pos=1;pos<=8;pos++){
var changed=pure.split('');
var changes=PALACE_CHANGES[pos];
for(var c=0;c<changes.length;c++){changed[changes[c]]=flipBit(changed[changes[c]]);}
if(changed.join('')===binary)return pos;
}
return 1;
}

}

}

    else if(diffs.length===2&&diffs[0]===0&&diffs[1]===1)pos="二世(二爻变)";
    else if(diffs.length===3&&diffs[0]===0&&diffs[1]===1&&diffs[2]===2)pos="三世(三爻变)";
    else if(diffs.length===4&&diffs[0]===0&&diffs[1]===1&&diffs[2]===2&&diffs[3]===3)pos="四世(四爻变)";
    else if(diffs.length===5&&diffs[0]===0&&diffs[1]===1&&diffs[2]===2&&diffs[3]===3&&diffs[4]===4)pos="五世(五爻变)";
    else if(diffs.length===6)pos="上世(六爻变)";
    else if(diffs.length===4&&diffs.indexOf(3)>=0&&diffs.indexOf(4)<0)pos="游魂卦";
    else if(diffs.length<=2&&diffs.indexOf(0)<0&&diffs.indexOf(1)<0&&diffs.indexOf(2)<0)pos="归魂卦";
    if(pos)return palaces[p].n+"宫·"+pos;
  }
  return "八宫十六变序列";
}

// 七十二候配卦计算
function calcQiShiErHou(month,day){
  var terms=["小寒","大寒","立春","雨水","惊蛰","春分","清明","谷雨","立夏","小满","芒种","夏至","小暑","大暑","立秋","处暑","白露","秋分","寒露","霜降","立冬","小雪","大雪","冬至"];
  var msgGua=["复","临","泰","大壮","夬","乾","姤","遁","否","观","剥","坤"];
  var mi=month-1;
  if(mi<0)mi=0;if(mi>11)mi=11;
  var pentad=Math.floor((day-1)/10);
  if(pentad>2)pentad=2;
  var pentadNames=["初候","二候","三候"];
  return terms[mi*2]+"·"+pentadNames[pentad]+" 配十二消息卦:"+msgGua[mi];
}
