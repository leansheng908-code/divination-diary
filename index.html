<!DOCTYPE html>
<html lang="zh">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no">
<title>🔮 术数日记 · 集成版</title>
<style>
*{margin:0;padding:0;box-sizing:border-box}
:root{--bg:#0f0c1a;--card:#1a1530;--border:#2d2348;--border-active:#5d4e7f;--text:#e8e0f0;--text-dim:#8a7aa0;--text-bright:#d4c5f0;--accent:#8b5cf6;--accent-dark:#6b3fa0;--accent-grad:linear-gradient(135deg,#6b3fa0,#8b5cf6);--danger:#e88;--success:#6dd58c;--radius:12px;--transition:.2s ease}
body{font-family:-apple-system,BlinkMacSystemFont,'Segoe UI',sans-serif;background:var(--bg);color:var(--text);min-height:100vh;padding-bottom:80px;-webkit-tap-highlight-color:transparent}
.header{background:linear-gradient(135deg,#1a1530,#2d1b4e);padding:20px 16px 16px;text-align:center;border-bottom:1px solid #3d2e5f;position:sticky;top:0;z-index:50;backdrop-filter:blur(10px)}
.header h1{font-size:20px;color:#c9b8e8;font-weight:600}
.header .sub{font-size:12px;color:#8a7aa0;margin-top:4px}
.container{max-width:600px;margin:0 auto;padding:16px}
.card{background:var(--card);border-radius:var(--radius);padding:16px;margin-bottom:12px;border:1px solid var(--border);transition:border-color var(--transition)}
.card:active{border-color:var(--border-active)}
.entry-title{font-size:16px;color:var(--text-bright);font-weight:600;margin-bottom:4px}
.entry-time{font-size:12px;color:#7a6b9a;margin-bottom:8px}
.tag-badge{display:inline-block;background:#2d1b4e;color:#b8a0d8;font-size:11px;padding:3px 8px;border-radius:6px;margin:2px 3px 2px 0}
.tag-badge.highlight{background:#4a2d7a;color:#e0c8ff}
.section-title{font-size:14px;color:#9a8ab8;margin:16px 0 8px;text-transform:uppercase;letter-spacing:1px}
.system-tag{display:inline-block;font-size:10px;padding:2px 6px;border-radius:4px;margin:1px;background:#2d1b4e;color:#b8a0d8}
.stats-bar{display:flex;align-items:center;gap:4px;margin:4px 0}
.stats-bar .count{font-size:12px;color:#c9a0e8;min-width:30px}
.stats-bar .label{font-size:11px;color:#b8a0d8;flex:1;word-break:break-all}
.stats-bar .bar{height:16px;background:#4a2d7a;border-radius:3px;min-width:2px}
.form-group{margin-bottom:14px}
.form-group label{display:block;font-size:13px;color:#9a8ab8;margin-bottom:6px}
.form-group input,.form-group textarea,.form-group select{width:100%;background:var(--bg);border:1px solid var(--border);border-radius:8px;padding:12px;color:var(--text);font-size:15px}
.form-group input:focus,.form-group textarea:focus,.form-group select:focus{outline:none;border-color:var(--border-active)}
.form-group textarea{resize:vertical;min-height:100px}
.form-row{display:flex;gap:8px}
.form-row .form-group{flex:1}
.btn{display:block;width:100%;padding:14px;border:none;border-radius:10px;font-size:16px;font-weight:600;cursor:pointer;text-align:center;text-decoration:none;transition:opacity var(--transition)}
.btn-primary{background:var(--accent-grad);color:#fff}
.btn-secondary{background:#2d2348;color:#c9b8e8;margin-top:8px}
.btn:active{opacity:.85}
.bottom-nav{position:fixed;bottom:0;left:0;right:0;background:var(--card);border-top:1px solid var(--border);display:flex;max-width:600px;margin:0 auto;z-index:100}
.nav-item{flex:1;text-align:center;padding:8px;color:#6a5b8a;text-decoration:none;font-size:12px;cursor:pointer;transition:color var(--transition)}
.nav-item.active{color:var(--accent)}
.nav-icon{font-size:20px;display:block;margin-bottom:2px}
.empty{text-align:center;padding:40px 20px;color:#6a5b8a}
.detail-content{background:var(--bg);border-radius:8px;padding:14px;margin:12px 0;font-size:15px;line-height:1.7;white-space:pre-wrap;color:var(--text-bright)}
.tag-section{margin-top:12px}
.tag-dim{display:flex;justify-content:space-between;padding:6px 0;border-bottom:1px solid #1f1838;font-size:13px}
.tag-dim .key{color:#8a7aa0}
.tag-dim .val{color:var(--text-bright);text-align:right;max-width:60%;word-break:break-all}
.search-box{display:flex;gap:8px;margin-bottom:16px}
.search-box input{flex:1;background:var(--bg);border:1px solid var(--border);border-radius:8px;padding:12px;color:var(--text);font-size:15px}
.search-box input:focus{outline:none;border-color:var(--border-active)}
.search-box button{background:var(--accent-dark);border:none;border-radius:8px;padding:0 20px;color:#fff;font-size:15px;cursor:pointer}
.profile-card{background:linear-gradient(135deg,#1a1530,#2d1b4e);border-radius:var(--radius);padding:16px;margin-bottom:16px;border:1px solid #3d2e5f}
.profile-name{font-size:18px;color:#e0c8ff;font-weight:600}
.profile-info{font-size:13px;color:#8a7aa0;margin-top:4px}
.progress-bar{margin-top:8px;height:6px;background:var(--bg);border-radius:3px;overflow:hidden}
.progress-fill{height:100%;background:var(--accent-grad)}
.page{display:none}
.page.active{display:block}
.sys-grid{display:grid;grid-template-columns:repeat(2,1fr);gap:10px}
.sys-card{background:var(--card);border-radius:10px;padding:14px;border:1px solid var(--border);cursor:pointer;transition:border-color var(--transition)}
.sys-card:active{border-color:var(--border-active)}
.sys-card .icon{font-size:24px;margin-bottom:6px}
.sys-card .name{font-size:14px;color:var(--text-bright);font-weight:600}
.sys-card .dims{font-size:11px;color:#7a6b9a;margin-top:2px}
.sys-card .status{font-size:10px;margin-top:4px}
.sys-card .status.on{color:var(--success)}
.sys-card .status.off{color:#6a5b8a}
.collapsible{cursor:pointer;padding:10px 0;display:flex;justify-content:space-between;align-items:center}
.collapsible .arrow{transition:transform var(--transition);font-size:12px;color:#8a7aa0}
.collapsible.open .arrow{transform:rotate(180deg)}
.collapsible-content{display:none;padding-top:4px}
.collapsible-content.show{display:block}
.loading{text-align:center;padding:20px;color:#8a7aa0}
</style>
</head>
<body>
<div class="header"><h1>🔮 术数日记 · 集成版</h1><div class="sub">十三术数系统 · 标记你的每一天</div></div>
<div class="container" id="app"><div class="loading">⏳ 加载中...</div></div>
<div class="bottom-nav" id="nav"></div>

<script src="https://cdn.jsdelivr.net/npm/lunar-javascript@1.6.12/lunar.js"></script>

<script>
// ============================================================
// M13 集成版 - 共享工具库
// ============================================================
const GAN = ['甲','乙','丙','丁','戊','己','庚','辛','壬','癸'];
const ZHI = ['子','丑','寅','卯','辰','巳','午','未','申','酉','戌','亥'];
const WUXING = ['金','木','水','火','土'];
const SHENGXIAO = ['鼠','牛','虎','兔','龙','蛇','马','羊','猴','鸡','狗','猪'];

function getGanzhi(year, month, day, hour, minute) {
    if (typeof Lunar !== 'undefined') {
        const solar = Solar.fromYmdHms(year, month, day, hour || 12, minute || 0, 0);
        const lunar = solar.getLunar();
        return {
            yearGz: lunar.getYearInGanZhiExact(),
            monthGz: lunar.getMonthInGanZhiExact(),
            dayGz: lunar.getDayInGanZhiExact(),
            hourGz: lunar.getTimeInGanZhi(),
            lunar: lunar.toString(),
            lunarMonth: lunar.getMonth(),
            lunarDay: lunar.getDay(),
            lunarYear: lunar.getYearInChinese(),
            animal: lunar.getYearShengXiao(),
            solarTerm: solar.getLunar().getJieQi() || ''
        };
    }
    return null;
}

// ============================================================
// 系统注册表
// ============================================================
const SYSTEM_LIST = [
    {id:'economic_cycle', name:'经济周期', icon:'📈', dims:22, file:'systems/economic_cycle.js'},
    {id:'tarot', name:'塔罗牌阵', icon:'🃏', dims:55, file:'systems/tarot.js'},
    {id:'jyotish', name:'印度占星', icon:'🪐', dims:55, file:'systems/jyotish.js'},
    {id:'canmou', name:'参考系统', icon:'📋', dims:114, file:'systems/canmou.js'},
    {id:'taiyi', name:'太乙神数', icon:'☯', dims:158, file:'systems/taiyi.js'},
    {id:'bazi', name:'八字四柱', icon:'🌳', dims:260, file:'systems/bazi.js'},
    {id:'tongsheng', name:'通胜择日', icon:'📅', dims:249, file:'systems/tongsheng.js'},
    {id:'zhongyi', name:'中医术数', icon:'⚕', dims:22, file:'systems/zhongyi.js'},
    {id:'qita', name:'其他术数', icon:'🔮', dims:227, file:'systems/qita.js'},
    {id:'yi_jing', name:'易经卦象', icon:'☰', dims:243, file:'systems/yi_jing.js'},
    {id:'liuren', name:'大六壬', icon:'🌊', dims:284, file:'systems/liuren.js'},
    {id:'qimen', name:'奇门遁甲', icon:'🌬', dims:417, file:'systems/qimen.js'},
    {id:'ziwei', name:'紫微斗数', icon:'⭐', dims:455, file:'systems/ziwei.js'},
];

window.Systems = {};

// 动态加载系统JS
let systemsLoaded = 0;
let systemsTotal = SYSTEM_LIST.length;

function loadSystem(sys) {
    return new Promise((resolve) => {
        const script = document.createElement('script');
        script.src = sys.file + '?v=' + Date.now();
        script.onload = () => { systemsLoaded++; resolve(); };
        script.onerror = () => { systemsLoaded++; resolve(); };
        document.head.appendChild(script);
    });
}

async function loadAllSystems() {
    await Promise.all(SYSTEM_LIST.map(s => loadSystem(s)));
    renderHome();
}

// ============================================================
// 日记数据管理
// ============================================================
function getProfile() {
    try { return JSON.parse(localStorage.getItem('m13_profile') || 'null'); } catch(e) { return null; }
}
function saveProfile(p) { localStorage.setItem('m13_profile', JSON.stringify(p)); }
function getEntries() {
    try { return JSON.parse(localStorage.getItem('m13_entries') || '[]'); } catch(e) { return []; }
}
function saveEntries(e) { localStorage.setItem('m13_entries', JSON.stringify(e)); }

function generateAllTags(year, month, day, hour, minute) {
    const profile = getProfile() || {};
    const options = {
        gender: profile.gender || 'male',
        lat: profile.lat || 41.4,
        lon: profile.lon || 119.6,
        birth: profile.birth_date || ''
    };
    const ganzhi = getGanzhi(year, month, day, hour, minute);
    if (ganzhi) options.ganzhi = ganzhi;

    const results = {};
    for (const sys of SYSTEM_LIST) {
        try {
            if (typeof window.Systems[sys.id] === 'function') {
                results[sys.id] = window.Systems[sys.id](year, month, day, hour || 12, minute || 0, options);
            }
        } catch(e) {
            results[sys.id] = { error: e.message, name: sys.name };
        }
    }
    return results;
}

// ============================================================
// 页面渲染
// ============================================================
const app = document.getElementById('app');

function renderNav(active) {
    const items = [
        {id:'home', icon:'📖', label:'日记'},
        {id:'overview', icon:'📊', label:'今日'},
        {id:'systems', icon:'🔮', label:'系统'},
        {id:'settings', icon:'⚙', label:'设置'},
    ];
    document.getElementById('nav').innerHTML = items.map(i =>
        `<div class="nav-item ${active===i.id?'active':''}" onclick="navigate('${i.id}')"><span class="nav-icon">${i.icon}</span>${i.label}</div>`
    ).join('');
}

function navigate(page) {
    if (page === 'home') renderHome();
    else if (page === 'overview') renderOverview();
    else if (page === 'systems') renderSystems();
    else if (page === 'settings') renderSettings();
}

function renderHome() {
    const entries = getEntries();
    let html = '<div class="search-box"><input id="searchInput" placeholder="搜索日记..." oninput="filterEntries(this.value)"><button onclick="showNewEntry()">➕</button></div>';

    if (entries.length === 0) {
        html += '<div class="empty"><div style="font-size:40px;margin-bottom:12px">📖</div><p>还没有日记</p><p style="font-size:13px;margin-top:8px">点击 ➕ 创建第一篇</p></div>';
    } else {
        const sorted = entries.sort((a,b) => (b.timestamp||'').localeCompare(a.timestamp||''));
        for (const e of sorted) {
            const sysCount = Object.keys(e.tags || {}).filter(k => !e.tags[k].error).length;
            const preview = (e.note || '').substring(0, 50);
            html += `<div class="card" onclick="showEntry('${e.id}')">
                <div class="entry-title">${e.timestamp || '?'}</div>
                <div class="entry-time">${e.lunar || ''} · ${sysCount}系统已生成</div>
                ${preview ? `<div style="font-size:13px;color:#b8a0d8;margin-top:4px">${preview}</div>` : ''}
            </div>`;
        }
    }
    app.innerHTML = html;
    renderNav('home');
}

function showNewEntry() {
    const now = new Date();
    const ymd = `${now.getFullYear()}-${String(now.getMonth()+1).padStart(2,'0')}-${String(now.getDate()).padStart(2,'0')}`;
    let html = `<div class="card">
        <div class="section-title" style="margin-top:0">📝 新日记</div>
        <div class="form-group"><label>日期</label><input type="date" id="entryDate" value="${ymd}"></div>
        <div class="form-row">
            <div class="form-group"><label>时</label><select id="entryHour">
                ${Array.from({length:24},(_,i)=>`<option value="${i}" ${i===now.getHours()?'selected':''}>${i}时</option>`).join('')}
            </select></div>
            <div class="form-group"><label>分</label><select id="entryMinute">
                ${[0,15,30,45].map(m=>`<option value="${m}" ${m===0?'selected':''}>${m}分</option>`).join('')}
            </select></div>
        </div>
        <div class="form-group"><label>心情/笔记</label><textarea id="entryNote" placeholder="今天的心情或想记录的事..."></textarea></div>
        <button class="btn btn-primary" onclick="createEntry()">生成十三术数标签</button>
        <button class="btn btn-secondary" onclick="renderHome()">取消</button>
    </div>`;
    app.innerHTML = html;
    renderNav('home');
}

function createEntry() {
    const date = document.getElementById('entryDate').value;
    const hour = parseInt(document.getElementById('entryHour').value);
    const minute = parseInt(document.getElementById('entryMinute').value);
    const note = document.getElementById('entryNote').value;
    if (!date) return alert('请选择日期');
    const [y, m, d] = date.split('-').map(Number);
    const tags = generateAllTags(y, m, d, hour, minute);
    const ganzhi = getGanzhi(y, m, d, hour, minute);
    const entry = {
        id: 'e' + Date.now(),
        timestamp: `${date} ${String(hour).padStart(2,'0')}:${String(minute).padStart(2,'0')}`,
        lunar: ganzhi ? ganzhi.lunar : '',
        ganzhi: ganzhi,
        note: note,
        tags: tags
    };
    const entries = getEntries();
    entries.push(entry);
    saveEntries(entries);
    showEntry(entry.id);
}

function showEntry(entryId) {
    const entry = getEntries().find(e => e.id === entryId);
    if (!entry) { renderHome(); return; }

    let html = `<div class="card">
        <div class="entry-title">${entry.timestamp}</div>
        <div class="entry-time">${entry.lunar || ''}</div>
        ${entry.note ? `<div class="detail-content">${entry.note}</div>` : ''}
    </div>`;

    for (const sys of SYSTEM_LIST) {
        const tag = entry.tags?.[sys.id];
        if (!tag || tag.error) {
            html += `<div class="card"><div class="collapsible" onclick="toggleCol(this)"><span>${sys.icon} ${sys.name}</span><span class="arrow">▼</span></div><div class="collapsible-content">${tag?.error ? '<span style="color:#e88">生成失败: '+tag.error+'</span>' : '<span style="color:#6a5b8a">未生成</span>'}</div></div>`;
            continue;
        }
        const dims = tag.dimensions || tag;
        const keys = Object.keys(dims).filter(k => k !== 'error' && k !== 'name' && k !== 'summary');
        let dimHtml = '';
        for (const k of keys) {
            const v = dims[k];
            if (v == null || v === '') continue;
            const vStr = typeof v === 'object' ? JSON.stringify(v) : String(v);
            dimHtml += `<div class="tag-dim"><span class="key">${k}</span><span class="val">${vStr}</span></div>`;
        }
        html += `<div class="card">
            <div class="collapsible" onclick="toggleCol(this)"><span>${sys.icon} ${sys.name} <span style="color:#7a6b9a;font-size:11px">(${keys.length}维)</span></span><span class="arrow">▼</span></div>
            <div class="collapsible-content">${dimHtml || '<span style="color:#6a5b8a">无标签数据</span>'}</div>
        </div>`;
    }

    html += `<button class="btn btn-secondary" style="background:#3a1a1a;color:#e88" onclick="deleteEntry('${entry.id}')">删除这篇日记</button>`;
    app.innerHTML = html;
    renderNav('home');
}

function toggleCol(el) {
    el.classList.toggle('open');
    el.nextElementSibling.classList.toggle('show');
}

function deleteEntry(entryId) {
    if (!confirm('确定删除？')) return;
    saveEntries(getEntries().filter(e => e.id !== entryId));
    renderHome();
}

function filterEntries(q) {
    const cards = app.querySelectorAll('.card');
    const entries = getEntries();
    cards.forEach((card, i) => {
        if (i === 0) return;
        const text = card.textContent.toLowerCase();
        card.style.display = text.includes(q.toLowerCase()) ? '' : 'none';
    });
}

function renderOverview() {
    const now = new Date();
    const tags = generateAllTags(now.getFullYear(), now.getMonth()+1, now.getDate(), now.getHours(), 0);
    const ganzhi = getGanzhi(now.getFullYear(), now.getMonth()+1, now.getDate(), now.getHours(), 0);

    let html = `<div class="card"><div class="section-title" style="margin-top:0">📅 今日总览</div>`;
    html += `<div class="tag-dim"><span class="key">公历</span><span class="val">${now.getFullYear()}-${String(now.getMonth()+1).padStart(2,'0')}-${String(now.getDate()).padStart(2,'0')} ${now.getHours()}时</span></div>`;
    if (ganzhi) {
        html += `<div class="tag-dim"><span class="key">农历</span><span class="val">${ganzhi.lunar}</span></div>`;
        html += `<div class="tag-dim"><span class="key">年柱</span><span class="val">${ganzhi.yearGz}</span></div>`;
        html += `<div class="tag-dim"><span class="key">月柱</span><span class="val">${ganzhi.monthGz}</span></div>`;
        html += `<div class="tag-dim"><span class="key">日柱</span><span class="val">${ganzhi.dayGz}</span></div>`;
        html += `<div class="tag-dim"><span class="key">时柱</span><span class="val">${ganzhi.hourGz}</span></div>`;
        html += `<div class="tag-dim"><span class="key">生肖</span><span class="val">${ganzhi.animal}</span></div>`;
    }
    html += '</div>';

    let okCount = 0, errCount = 0;
    for (const sys of SYSTEM_LIST) {
        const tag = tags[sys.id];
        if (tag && !tag.error) {
            okCount++;
            const dims = tag.dimensions || tag;
            const keys = Object.keys(dims).filter(k => k !== 'error' && k !== 'name' && k !== 'summary');
            let dimHtml = '';
            for (const k of keys.slice(0, 8)) {
                const v = dims[k];
                if (v == null || v === '') continue;
                dimHtml += `<div class="tag-dim"><span class="key">${k}</span><span class="val">${typeof v === 'object' ? JSON.stringify(v).substring(0,60) : String(v).substring(0,60)}</span></div>`;
            }
            if (keys.length > 8) dimHtml += `<div style="font-size:11px;color:#7a6b9a;padding:4px 0">...还有${keys.length-8}个维度</div>`;
            html += `<div class="card"><div class="collapsible" onclick="toggleCol(this)"><span>${sys.icon} ${sys.name} <span style="color:#7a6b9a;font-size:11px">(${keys.length}维)</span></span><span class="arrow">▼</span></div><div class="collapsible-content">${dimHtml}</div></div>`;
        } else {
            errCount++;
            html += `<div class="card"><div style="color:#6a5b8a">${sys.icon} ${sys.name} — ${tag?.error || '加载中...'}</div></div>`;
        }
    }
    html += `<div class="card" style="text-align:center"><span style="color:${okCount===13?'#6dd58c':'#c9a0e8'}">✅ ${okCount}/13 系统已生成</span>${errCount>0?` · <span style="color:#e88">${errCount} 个待加载</span>`:''}</div>`;
    app.innerHTML = html;
    renderNav('overview');
}

function renderSystems() {
    const profile = getProfile();
    let html = '';
    if (profile) {
        html += `<div class="profile-card"><div class="profile-name">${profile.name||'匿名'}</div><div class="profile-info">${profile.birth_date||''} ${profile.birth_time||''} · ${profile.birth_city||''}</div></div>`;
    }

    const loaded = SYSTEM_LIST.filter(s => typeof window.Systems[s.id] === 'function').length;
    const totalDims = SYSTEM_LIST.reduce((s,x)=>s+x.dims,0);
    const activeDims = SYSTEM_LIST.filter(s => typeof window.Systems[s.id] === 'function').reduce((s,x)=>s+x.dims,0);

    html += `<div class="card"><div class="section-title" style="margin-top:0">📊 集成进度</div>`;
    html += `<div class="tag-dim"><span class="key">已接入</span><span class="val">${loaded} / 13 系统</span></div>`;
    html += `<div class="tag-dim"><span class="key">标签维度</span><span class="val">${activeDims} / ${totalDims} 维</span></div>`;
    html += `<div class="progress-bar"><div class="progress-fill" style="width:${(activeDims/totalDims*100).toFixed(1)}%"></div></div></div>`;

    html += '<div class="section-title">十三术数系统</div><div class="sys-grid">';
    for (const sys of SYSTEM_LIST) {
        const isOn = typeof window.Systems[sys.id] === 'function';
        html += `<div class="sys-card" onclick="showSystemDetail('${sys.id}')">
            <div class="icon">${sys.icon}</div>
            <div class="name">${sys.name}</div>
            <div class="dims">${sys.dims} 维度</div>

function exportData() {
    const data = JSON.stringify({profile: getProfile(), entries: getEntries()});
    const blob = new Blob([data], {type: 'application/json'});
    const a = document.createElement('a');
    a.href = URL.createObjectURL(blob);
    a.download = `m13_diary_${new Date().toISOString().slice(0,10)}.json`;
    a.click();
}

function importData() {
    const input = document.createElement('input');
    input.type = 'file';
    input.accept = '.json';
    input.onchange = e => {
        const file = e.target.files[0];
        if (!file) return;
        const reader = new FileReader();
        reader.onload = ev => {
            try {
                const data = JSON.parse(ev.target.result);
                if (data.profile) saveProfile(data.profile);
                if (data.entries) saveEntries(data.entries);
                alert('导入成功');
                renderSettings();
            } catch(err) { alert('导入失败：格式错误'); }
        };
        reader.readAsText(file);
    };
    input.click();
}

/**
 * 经济周期 (Economic Cycle) 标签生成模块
 * 从 Python economic_cycle_label_dictionary.py 移植
 *
 * 周期定义:
 *   A恐慌：间隔[18,20,16]循环，54年大周期，起点1927
 *   B繁荣：间隔[9,10,8]循环，27年大周期，起点1926
 *   C艰难：间隔[7,11,9]循环，27年大周期，起点1924
 *
 * 段类型(4种):
 *   C→B：买入窗口 / B→A：卖出窗口 / A→C：持币窗口 / B→C：观望窗口
 */

window.Systems = window.Systems || {};

(function() {
    'use strict';

    // ===== Part 1: 周期计算引擎 =====

    var _CYCLES = {
        A: { start: 1927, intervals: [18, 20, 16] },
        B: { start: 1926, intervals: [9, 10, 8] },
        C: { start: 1924, intervals: [7, 11, 9] }
    };

    var _PHASE_PRIORITY = { C: 0, B: 1, A: 2 };
    var _PHASE_CN = { A: 'A恐慌', B: 'B繁荣', C: 'C艰难' };

    var _SEGMENT_TYPES = {
        'C,B': 'C→B',
        'B,A': 'B→A',
        'A,C': 'A→C',
        'B,C': 'B→C'
    };

    var _WINDOW_TYPES = {
        'C→B': '买入',
        'B→A': '卖出',
        'A→C': '持币',
        'B→C': '观望'
    };

    var _ACTION_MAP = {
        'C→B,早期': '建仓',
        'C→B,中期': '加仓',
        'C→B,晚期': '持有',
        'B→A,早期': '持有',
        'B→A,中期': '减仓',
        'B→A,晚期': '清仓',
        'A→C,早期': '空仓',
        'A→C,中期': '观望',
        'A→C,晚期': '准备',
        'B→C,早期': '持有',
        'B→C,中期': '观望',
        'B→C,晚期': '准备建仓'
    };

    function _generateCycleYears(phase, minYear, maxYear) {
        minYear = minYear || 1800;
        maxYear = maxYear || 2200;
        var cfg = _CYCLES[phase];
        var start = cfg.start;
        var intervals = cfg.intervals;
        var n = intervals.length;
        var years = [];

        // 向前生成
        var year = start;
        var idx = 0;
        while (year <= maxYear) {
            years.push(year);
            year += intervals[idx % n];
            idx++;
        }

        // 向后生成
        var revIntervals = intervals.slice().reverse();
        year = start;
        idx = 0;
        while (year > minYear) {
            year -= revIntervals[idx % n];
            if (year >= minYear) {
                years.push(year);
            }
            idx++;
        }

        // 去重并排序
        var unique = {};
        for (var i = 0; i < years.length; i++) {
            unique[years[i]] = true;
        }
        var result = Object.keys(unique).map(Number).sort(function(a, b) { return a - b; });
        return result;
    }

    function _generateAllTurningPoints(minYear, maxYear) {
        minYear = minYear || 1800;
        maxYear = maxYear || 2200;
        var points = [];
        var phases = ['A', 'B', 'C'];
        for (var pi = 0; pi < phases.length; pi++) {
            var phase = phases[pi];
            var yrs = _generateCycleYears(phase, minYear, maxYear);
            for (var i = 0; i < yrs.length; i++) {
                points.push([yrs[i], phase]);
            }
        }
        points.sort(function(a, b) {
            if (a[0] !== b[0]) return a[0] - b[0];
            return _PHASE_PRIORITY[a[1]] - _PHASE_PRIORITY[b[1]];
        });
        return points;
    }

    // ===== Part 2: 段判断引擎 =====

    function _findCurrentSegment(year, points) {
        if (!points) {
            points = _generateAllTurningPoints();
        }

        var pastIdx = null;
        for (var i = 0; i < points.length; i++) {
            if (points[i][0] <= year) {
                pastIdx = i;
            } else {
                break;
            }
        }

        if (pastIdx === null || pastIdx + 1 >= points.length) {
            return null;
        }

        var startYear = points[pastIdx][0];
        var startPhase = points[pastIdx][1];
        var endYear = points[pastIdx + 1][0];
        var endPhase = points[pastIdx + 1][1];

        var segType = _SEGMENT_TYPES[startPhase + ',' + endPhase];
        if (segType === undefined) {
            return null;
        }

        var nextSegType = null;
        if (pastIdx + 2 < points.length) {
            var nextEndPhase = points[pastIdx + 2][1];
            nextSegType = _SEGMENT_TYPES[endPhase + ',' + nextEndPhase] || null;
        }

        return {
            segmentType: segType,
            startYear: startYear,
            startPhase: startPhase,
            endYear: endYear,
            endPhase: endPhase,
            totalYears: endYear - startYear,
            nextSegmentType: nextSegType
        };
    }

    function _findNearestPhase(year, phase) {
        var years = _generateCycleYears(phase);
        var bestYear = years[0];
        var bestDist = Math.abs(years[0] - year);
        for (var i = 1; i < years.length; i++) {
            var dist = Math.abs(years[i] - year);
            if (dist < bestDist) {
                bestDist = dist;
                bestYear = years[i];
            }
        }
        return [bestYear, bestDist];
    }

    function _findPastSameSegments(segType, currentStart, points) {
        if (!points) {
            points = _generateAllTurningPoints();
        }

        var segments = [];
        for (var i = 0; i < points.length - 1; i++) {
            var sy = points[i][0];
            var sp = points[i][1];
            var ey = points[i + 1][0];
            var ep = points[i + 1][1];
            var st = _SEGMENT_TYPES[sp + ',' + ep];
            if (st === segType && ey < currentStart) {
                segments.push({
                    start: sy,
                    end: ey,
                    length: ey - sy
                });
            }
        }

        segments.sort(function(a, b) { return b.end - a.end; });
        return segments;
    }

    // ===== Part 3: 标签生成 =====

    function _countDims(d) {
        var count = 0;
        if (d === null || d === undefined) return 0;
        if (typeof d === 'object' && !Array.isArray(d)) {
            var keys = Object.keys(d);
            for (var i = 0; i < keys.length; i++) {
                count += _countDims(d[keys[i]]);
            }
        } else if (typeof d === 'string' || typeof d === 'number') {
            if (d !== '' && d !== null && d !== undefined) {
                count++;
            }
        } else if (Array.isArray(d)) {
            for (var j = 0; j < d.length; j++) {
                count += _countDims(d[j]);
            }
        }
        return count;
    }

    function _generateLabels(year, month, day, hour, minute) {
        var points = _generateAllTurningPoints();
        var seg = _findCurrentSegment(year, points);

        if (seg === null) {
            return {
                layers: { 'L1_周期定位': { '错误': '无法定位当前段' } },
                meta: { systemName: 'economic_cycle', error: true }
            };
        }

        var segType = seg.segmentType;
        var startYear = seg.startYear;
        var endYear = seg.endYear;
        var totalYears = seg.totalYears;
        var elapsed = year - startYear;
        var remaining = endYear - year;
        var progress = totalYears > 0 ? Math.round(elapsed / totalYears * 1000) / 10 : 100.0;

        // L1: 周期定位
        var nearestA = _findNearestPhase(year, 'A');
        var nearestB = _findNearestPhase(year, 'B');
        var nearestC = _findNearestPhase(year, 'C');

        var L1 = {
            '当前段类型': segType,
            '段起始年份': String(startYear),
            '段起始阶段': _PHASE_CN[seg.startPhase],
            '段结束年份': String(endYear),
            '段结束阶段': _PHASE_CN[seg.endPhase],
            '段总长度': String(totalYears),
            '段已走年数': String(elapsed),
            '段剩余年数': String(remaining),
            '段进度': progress + '%',
            '最近A恐慌': nearestA[0] + '年(距' + nearestA[1] + '年)',
            '最近B繁荣': nearestB[0] + '年(距' + nearestB[1] + '年)',
            '最近C艰难': nearestC[0] + '年(距' + nearestC[1] + '年)'
        };

        // L5: 投资窗口
        var stage;
        if (progress <= 33.3) {
            stage = '早期';
        } else if (progress <= 66.6) {
            stage = '中期';
        } else {
            stage = '晚期';
        }

        var windowType = _WINDOW_TYPES[segType];
        var action = _ACTION_MAP[segType + ',' + stage] || '观望';

        var risk;
        if (progress <= 33.3) {
            risk = '低';
        } else if (progress <= 66.6) {
            risk = '中';
        } else {
            risk = '高';
        }

        var nextWindowStr = '未知';
        if (seg.nextSegmentType) {
            var nw = _WINDOW_TYPES[seg.nextSegmentType] || '未知';
            nextWindowStr = nw + '(' + endYear + '年起)';
        }

        var L5 = {
            '窗口类型': windowType,
            '窗口阶段': stage,
            '操作建议': action,
            '风险等级': risk,
            '距窗口关闭': remaining + '年',
            '下一窗口': nextWindowStr
        };

        // L6: 历史对照 (无JSON历史文件，使用'待记录')
        var pastSegs = _findPastSameSegments(segType, startYear, points);

        var lastSegStr = '待记录';
        if (pastSegs.length >= 1) {
            var ps = pastSegs[0];
            lastSegStr = ps.start + '-' + ps.end + '年: 待记录';
        }

        var lastLastSegStr = '待记录';
        if (pastSegs.length >= 2) {
            var ps2 = pastSegs[1];
            lastLastSegStr = ps2.start + '-' + ps2.end + '年: 待记录';
        }

        var avgStr = '待记录';
        var vsAvg = '待记录';
        if (pastSegs.length > 0) {
            var sumLen = 0;
            for (var k = 0; k < pastSegs.length; k++) {
                sumLen += pastSegs[k].length;
            }
            var avgLength = sumLen / pastSegs.length;
            avgStr = (Math.round(avgLength * 10) / 10) + '年';
            var diff = totalYears - avgLength;
            if (Math.abs(diff) <= 1) {
                vsAvg = '正常';
            } else if (diff > 1) {
                vsAvg = '偏长(+' + (Math.round(diff * 10) / 10) + '年)';
            } else {
                vsAvg = '偏短(' + (Math.round(diff * 10) / 10) + '年)';
            }
        }

        var L6 = {
            '上一轮同段': lastSegStr,
            '上上轮同段': lastLastSegStr,
            '历史平均长度': avgStr,
            '当前vs均值': vsAvg
        };

        var totalDims = _countDims(L1) + _countDims(L5) + _countDims(L6);

        return {
            layers: {
                'L1_周期定位': L1,
                'L5_投资窗口': L5,
                'L6_历史对照': L6
            },
            meta: {
                systemName: 'economic_cycle',
                systemNameCn: '经济周期',
                totalDimensions: totalDims,
                trustLevels: {
                    'L1_周期定位': 'high',
                    'L5_投资窗口': 'medium',
                    'L6_历史对照': 'medium_low'
                },
                growthEnabled: true,
                growthNote: 'L6历史对照层支持自动成长，运行器可在新段完成时通过联网搜索追加事件记录'
            }
        };
    }

    // ===== 标准接口 =====

    window.Systems.economic_cycle = function(year, month, day, hour, minute, options) {
        hour = hour || 12;
        minute = minute || 0;
        options = options || {};

        var result = _generateLabels(year, month, day, hour, minute);
        var layers = result.layers;
        var dimensions = {};

        // 展平为 dimensions
        var layerKeys = Object.keys(layers);
        for (var i = 0; i < layerKeys.length; i++) {
            var layerName = layerKeys[i];
            var layerData = layers[layerName];
            var dk = Object.keys(layerData);
            for (var j = 0; j < dk.length; j++) {
                var key = dk[j];
                var val = layerData[key];
                if (val !== null && val !== '' && val !== false) {
                    dimensions[layerName + '.' + key] = val;
                }
            }
        }

        // 生成摘要
        var l1 = layers['L1_周期定位'] || {};
        var l5 = layers['L5_投资窗口'] || {};
        var summaryParts = [];
        if (l1['当前段类型']) summaryParts.push(l1['当前段类型']);
        if (l5['窗口类型']) summaryParts.push(l5['窗口类型'] + '窗口');
        if (l1['段剩余年数']) summaryParts.push('剩余' + l1['段剩余年数'] + '年');

        return {
            dimensions: dimensions,
            name: '经济周期',
            meta: result.meta
        };
    };

})();

// ===== 伪随机数生成器 =====
function makeRng(seed) {
    let state = BigInt(seed & 0x7FFFFFFF);
    const MULT = 1103515245n;
    const INC = 12345n;
    const MASK = 0x7FFFFFFFn;
    return function() {
        state = (state * MULT + INC) & MASK;
        return Number(state) / 0x7FFFFFFF;
    };
}

// ===== Fisher-Yates洗牌 =====
function fisherYatesShuffle(deck, rng) {
    const shuffled = [...deck];
    const n = shuffled.length;
    for (let i = n - 1; i > 0; i--) {
        const j = Math.floor(rng() * (i + 1));
        [shuffled[i], shuffled[j]] = [shuffled[j], shuffled[i]];
    }
    return shuffled;
}

// ===== 三牌阵位置定义 =====
const SPREAD_POSITIONS = [
    {name:"过去",name_en:"Past",role:"因",desc:"溯源/根源/已发生"},
    {name:"现在",name_en:"Present",role:"果",desc:"当前状态/核心"},
    {name:"未来",name_en:"Future",role:"势",desc:"趋势/可能走向"}
];

// ===== 五行映射 =====
const WUXING_SHENG = {"木":"火","火":"土","土":"金","金":"水","水":"木"};
const WUXING_KE = {"木":"土","土":"水","水":"火","火":"金","金":"木"};

function elemToWuxing(element) {
    return {"火":"木","水":"水","风":"金","土":"土"}[element] || "土";
}

function getKeywords(card, isReversed) {
    return isReversed ? (card.reversed_keywords||[]) : (card.upright_keywords||[]);
}

// ===== 抽牌 =====
function drawCards(year, month, day, hour, minute) {
    const allCards = TAROT_DATA.major_arcana.concat(TAROT_DATA.minor_arcana);
    const seed = year * 10000 + month * 100 + day + hour * 60 + minute;
    const rng = makeRng(seed);
    const shuffled = fisherYatesShuffle(allCards, rng);
    const drawn = shuffled.slice(0, 3);
    
    const result = drawn.map(card => {
        const isReversed = rng() < TAROT_DATA.reversal_probability;
        return {card, isReversed};
    });
    
    return result;
}

// ===== 7层标签生成 =====
function generateLabels(year, month, day, hour, minute) {
    const drawn = drawCards(year, month, day, hour, minute);
    const seed = year * 10000 + month * 100 + day + hour * 60 + minute;
    
    // L1 抽牌结果
    const L1 = {};
    drawn.forEach((item, i) => {
        const pos = SPREAD_POSITIONS[i];
        const orientation = item.isReversed ? "逆位" : "正位";
        const suit = item.card.suit || "大阿尔卡那";
        L1["位置"+(i+1)+"_"+pos.name] = {
            "牌名": item.card.name,
            "英文": item.card.name_en,
            "正逆位": orientation,
            "花色": suit,
            "编号": String(item.card.num),
            "元素": item.card.element || "未知"
        };
    });
    
    // L2 牌意关键词
    const L2 = {};
    drawn.forEach((item, i) => {
        const pos = SPREAD_POSITIONS[i];
        const kws = getKeywords(item.card, item.isReversed);
        L2["位置"+(i+1)+"_"+pos.name] = {
            "关键词": item.card.keywords || "",
            "当前关键词": kws.slice(0,3).join("、"),
            "原型象征": item.card.archetypes || item.card.keywords || "无"
        };
    });
    
    // L3 位置含义
    const L3 = {};
    drawn.forEach((item, i) => {
        const pos = SPREAD_POSITIONS[i];
        const kws = getKeywords(item.card, item.isReversed);
        const orientation = item.isReversed ? "逆位" : "正位";
        const kwStr = kws.slice(0,3).join("、") || "无";
        L3["位置"+(i+1)+"_"+pos.name] = {
            "位置角色": pos.role,
            "位置解读": "在"+pos.name+"位置，"+item.card.name+orientation+"，象征"+kwStr
        };
    });
    
    // L4 元素平衡
    const counts = {"火":0,"水":0,"风":0,"土":0};
    const elements = drawn.map(item => item.card.element || "未知");
    elements.forEach(elem => { if(elem in counts) counts[elem]++; });
    
    const elemSet = new Set(elements);
    let relations = [];
    if(elemSet.size === 1) {
        relations.push("三牌同属"+elements[0]+"元素，能量高度集中");
    } else if(elemSet.size === 2) {
        const [e1,e2] = [...elemSet];
        const w1 = elemToWuxing(e1), w2 = elemToWuxing(e2);
        if(WUXING_SHENG[w1] === w2) relations.push(e1+"生"+w2+"，元素相生，能量流畅");
        else if(WUXING_KE[w1] === w2) relations.push(e1+"克"+w2+"，元素相克，存在张力");
        else relations.push(e1+"与"+e2+"并存，元素互补");
    } else {
        relations.push("三牌元素分别为"+elements.join("/")+"，多元能量交织");
    }
    
    const dominant = Object.keys(counts).reduce((a,b) => counts[a]>counts[b]?a:b);
    const missing = Object.keys(counts).filter(k => counts[k]===0);
    const distStr = Object.entries(counts).map(([k,v])=>k+":"+v).join(" ");
    const balanceLevel = elemSet.size===1?"集中":(elemSet.size===2?"偏向":"均衡");
    
    const L4 = {
        "元素分布": distStr,
        "主导元素": dominant,
        "元素关系": relations.join("；"),
        "三牌元素": elements.join("、"),
        "缺失元素": missing.length?missing.join("、"):"无",
        "平衡度": balanceLevel,
        "元素能量": elemSet.size===1?"高度集中":(elemSet.size===2?"有偏向":"多元流动")
    };
    
    // L5 五行映射
    const wuxingList = drawn.map(item => item.card.wuxing_mapping || "土");
    const wxCounts = {};
    wuxingList.forEach(wx => { wxCounts[wx] = (wxCounts[wx]||0)+1; });
    
    let wxBalance;
    const wxSet = new Set(wuxingList);
    if(wxSet.size === 1) {
        wxBalance = "五行偏"+wuxingList[0]+"，能量单一集中";
    } else if(wxSet.size === 2) {
        const [w1,w2] = [...wxSet];
        if(WUXING_SHENG[w1]===w2) wxBalance = w1+"生"+w2+"，五行相生流转";
        else if(WUXING_SHENG[w2]===w1) wxBalance = w2+"生"+w1+"，五行相生流转";
        else if(WUXING_KE[w1]===w2) wxBalance = w1+"克"+w2+"，五行相克有制";
        else if(WUXING_KE[w2]===w1) wxBalance = w2+"克"+w1+"，五行相克有制";
        else wxBalance = w1+"与"+w2+"并存，五行互补";
    } else {
        wxBalance = "五行"+wuxingList.join("/")+"并存，多元平衡";
    }
    
    const dominantWx = Object.keys(wxCounts).reduce((a,b)=>wxCounts[a]>wxCounts[b]?a:b);
    const wxDistStr = Object.entries(wxCounts).map(([k,v])=>k+":"+v).join(" ");
    
    const L5 = {
        "三牌五行": wuxingList.join("、"),
        "五行分布": wxDistStr,
        "五行平衡": wxBalance,
        "主导五行": dominantWx,
        "五行能量": wxBalance.includes("生")?"相生流转":(wxBalance.includes("克")?"相克有制":"并存互补")
    };
    
    // L6 卦象对应
    const guas = drawn.map(item => item.card.gua_mapping || "未知");
    const hasChange = guas.some(g => g.includes("革")||g.includes("震")||g.includes("复")||g.includes("剥"));
    
    const L6 = {
        "位置1卦象": guas[0]||"未知",
        "位置2卦象": guas[1]||"未知",
        "位置3卦象": guas[2]||"未知",
        "组合卦象": guas.join(" → "),
        "卦象趋势": hasChange?"变动流转":"稳定守成"
    };
    
    // L7 综合解读
    const parts = drawn.map((item, i) => {
        const pos = SPREAD_POSITIONS[i];
        const orientation = item.isReversed ? "逆位" : "正位";
        const kws = getKeywords(item.card, item.isReversed);
        const kw = kws.slice(0,2).join("、") || "未知";
        return pos.name+"："+item.card.name+orientation+"（"+kw+"）";
    });
    const story = parts.join(" → ");
    
    const allKws = [];
    drawn.forEach(item => {
        allKws.push(...getKeywords(item.card, item.isReversed).slice(0,2));
    });
    const allKwStr = allKws.join(" ");
    
    let theme;
    if(["爱","和谐","连接","关系"].some(kw => allKwStr.includes(kw))) theme = "关系与联结";
    else if(["成功","胜利","成就","繁荣"].some(kw => allKwStr.includes(kw))) theme = "成就与拓展";
    else if(["转变","结束","重生","变化"].some(kw => allKwStr.includes(kw))) theme = "转变与重生";
    else if(["内省","智慧","独处","直觉"].some(kw => allKwStr.includes(kw))) theme = "内省与智慧";
    else if(["冲突","挑战","竞争","斗争"].some(kw => allKwStr.includes(kw))) theme = "挑战与突破";
    else theme = "成长与发展";
    
    const uprightCount = drawn.filter(item => !item.isReversed).length;
    let direction, directionDesc;
    if(uprightCount === 3) { direction = "上升"; directionDesc = "三牌皆正位，能量强劲向上"; }
    else if(uprightCount >= 2) { direction = "平稳上升"; directionDesc = uprightCount+"正"+(3-uprightCount)+"逆，整体向好"; }
    else if(uprightCount === 1) { direction = "转折"; directionDesc = "正逆参半，处于转折点"; }
    else { direction = "下降"; directionDesc = "三牌皆逆位，能量受阻需内省"; }
    
    let advice;
    if(direction.includes("下降")) advice = "当前能量受阻，建议内省反思，主题「"+theme+"」需要耐心等待转机";
    else if(direction.includes("转折")) advice = "处于转折点，主题「"+theme+"」需要做出关键选择，抓住机遇";
    else if(direction.includes("上升")) advice = "能量上升，主题「"+theme+"」顺势而为，乘胜追击";
    else advice = "能量平稳，主题「"+theme+"」稳步推进，保持平衡";
    
    const L7 = {
        "三牌叙事线": story,
        "整体能量方向": direction,
        "能量描述": directionDesc,
        "核心主题": theme,
        "建议": advice
    };
    
    // 计算维度数
    let totalDims = 0;
    [L1,L2,L3,L4,L5,L6,L7].forEach(layer => {
        Object.values(layer).forEach(v => {
            if(typeof v === "object" && v !== null) {
                totalDims += Object.values(v).filter(x => x !== null && x !== "" && x !== false).length;
            } else if(v !== null && v !== "" && v !== false) {
                totalDims++;
            }
        });
    });
    
    return {
        layers: {
            "L1_抽牌结果": L1,
            "L2_牌意关键词": L2,
            "L3_位置含义": L3,
            "L4_元素平衡": L4,
            "L5_五行映射": L5,
            "L6_卦象对应": L6,
            "L7_综合解读": L7
        },
        meta: {
            system_name: "tarot",
            system_name_cn: "塔罗牌阵",
            total_dimensions: totalDims,
            seed: seed,
            timestamp: year+"-"+String(month).padStart(2,"0")+"-"+String(day).padStart(2,"0")+" "+String(hour).padStart(2,"0")+":"+String(minute).padStart(2,"0"),
            total_cards: 78,
            drawn_count: 3,

function _dayNumber(year, month, day, hour, minute) {
    const dt = new Date(Date.UTC(year, month-1, day, hour, minute, 0));
    const epoch = Date.UTC(1999, 11, 31, 0, 0, 0);
    return (dt - epoch) / 86400000.0;
}

function _rev(angle) { return ((angle % 360) + 360) % 360; }

function _solveKepler(M, e) {
    let M_rad = M * Math.PI / 180;
    let E = M_rad;
    for (let i = 0; i < 15; i++) {
        let delta = (E - e * Math.sin(E) - M_rad) / (1 - e * Math.cos(E));
        E -= delta;
        if (Math.abs(delta) < 1e-10) break;
    }
    return E * 180 / Math.PI;
}

const _SUN = {w:282.9404,w_rate:4.70935e-5,e:0.016709,e_rate:-1.151e-9,M:356.0470,M_rate:0.9856002585};
const _MOON = {N:125.1228,N_rate:-0.0529538083,i:5.1454,w:318.0634,w_rate:0.1643573223,a:60.2666,e:0.054900,M:115.3654,M_rate:13.0649929509};
const _PLANETS = {
    Mercury:{N:48.3313,N_rate:3.24587e-5,i:7.0047,i_rate:5.00e-8,w:29.1241,w_rate:1.01444e-5,a:0.387098,e:0.205635,e_rate:5.59e-10,M:168.6562,M_rate:4.0923344368},
    Venus:{N:76.6799,N_rate:2.46590e-5,i:3.3946,i_rate:2.75e-8,w:54.8910,w_rate:1.38374e-5,a:0.723330,e:0.006773,e_rate:-1.302e-9,M:48.0052,M_rate:1.6021302244},
    Mars:{N:49.5574,N_rate:2.11081e-5,i:1.8497,i_rate:-1.78e-8,w:286.5016,w_rate:2.92961e-5,a:1.523688,e:0.093405,e_rate:2.516e-9,M:18.6021,M_rate:0.5240207766},
    Jupiter:{N:100.4542,N_rate:2.76854e-5,i:1.3030,i_rate:-1.557e-7,w:273.8777,w_rate:1.64505e-5,a:5.20256,e:0.048498,e_rate:4.469e-9,M:19.8950,M_rate:0.0830853001},
    Saturn:{N:113.6634,N_rate:2.38980e-5,i:2.4886,i_rate:-1.081e-7,w:339.3939,w_rate:2.97661e-5,a:9.55475,e:0.055546,e_rate:-9.499e-9,M:316.9670,M_rate:0.0334442282}
};

function _sunPos(d) {
    let w = _SUN.w + _SUN.w_rate * d;
    let e = _SUN.e + _SUN.e_rate * d;
    let M = _rev(_SUN.M + _SUN.M_rate * d);
    let E = _solveKepler(M, e);
    let x = Math.cos(E * Math.PI/180) - e;
    let y = Math.sin(E * Math.PI/180) * Math.sqrt(1 - e*e);
    let r = Math.sqrt(x*x + y*y);
    let v = Math.atan2(y, x) * 180/Math.PI;
    return [_rev(v + w), 0.0, r];
}

function _moonPos(d) {
    let N = _rev(_MOON.N + _MOON.N_rate * d);
    let i = _MOON.i;
    let w = _rev(_MOON.w + _MOON.w_rate * d);
    let a = _MOON.a;
    let e = _MOON.e;
    let M = _rev(_MOON.M + _MOON.M_rate * d);
    let E = _solveKepler(M, e);
    let xv = a * (Math.cos(E * Math.PI/180) - e);
    let yv = a * Math.sin(E * Math.PI/180) * Math.sqrt(1 - e*e);
    let v = Math.atan2(yv, xv) * 180/Math.PI;
    let r = Math.sqrt(xv*xv + yv*yv);
    let Nrad = N * Math.PI/180, irad = i * Math.PI/180, vw = (v+w) * Math.PI/180;
    let xh = r * (Math.cos(Nrad)*Math.cos(vw) - Math.sin(Nrad)*Math.sin(vw)*Math.cos(irad));
    let yh = r * (Math.sin(Nrad)*Math.cos(vw) + Math.cos(Nrad)*Math.sin(vw)*Math.cos(irad));
    let zh = r * Math.sin(vw) * Math.sin(irad);
    let lon = _rev(Math.atan2(yh, xh) * 180/Math.PI);
    let lat = Math.atan2(zh, Math.sqrt(xh*xh + yh*yh)) * 180/Math.PI;
    // Perturbations
    let Ms = _rev(_SUN.M + _SUN.M_rate * d);
    let Ls = _rev(Ms + _SUN.w + _SUN.w_rate * d);
    let Lm = _rev(M + w + N);
    let Dm = _rev(Lm - Ls);
    let F = _rev(Lm - N);
    let s = (a) => Math.sin(a * Math.PI/180);
    lon += (-1.274 * s(M - 2*Dm) + 0.658 * s(2*Dm) - 0.186 * s(Ms)
            - 0.059 * s(2*M - 2*Dm) - 0.057 * s(M - 2*Dm + Ms)
            + 0.053 * s(M + 2*Dm) + 0.046 * s(2*Dm - Ms)
            + 0.041 * s(M - Ms) - 0.035 * s(Dm) - 0.031 * s(M + Ms)
            - 0.015 * s(2*F - 2*Dm) + 0.011 * s(M - 4*Dm));
    lat += (-0.173 * s(F - 2*Dm) - 0.055 * s(M - F - 2*Dm)
            - 0.046 * s(M + F - 2*Dm) + 0.033 * s(F + 2*Dm) + 0.017 * s(2*M + F));
    return [_rev(lon), lat, r];
}

function _planetPos(name, d) {
    let e = _PLANETS[name];
    let N = _rev(e.N + e.N_rate * d);
    let i = e.i + e.i_rate * d;
    let w = _rev(e.w + e.w_rate * d);
    let a = e.a;
    let ecc = e.e + e.e_rate * d;
    let M = _rev(e.M + e.M_rate * d);
    let E = _solveKepler(M, ecc);
    let xv = a * (Math.cos(E * Math.PI/180) - ecc);
    let yv = a * Math.sin(E * Math.PI/180) * Math.sqrt(1 - ecc*ecc);
    let v = Math.atan2(yv, xv) * 180/Math.PI;
    let r = Math.sqrt(xv*xv + yv*yv);
    let Nrad = N * Math.PI/180, irad = i * Math.PI/180, vw = (v+w) * Math.PI/180;
    let xh = r * (Math.cos(Nrad)*Math.cos(vw) - Math.sin(Nrad)*Math.sin(vw)*Math.cos(irad));
    let yh = r * (Math.sin(Nrad)*Math.cos(vw) + Math.cos(Nrad)*Math.sin(vw)*Math.cos(irad));
    let zh = r * Math.sin(vw) * Math.sin(irad);
    let sunLon = _sunPos(d)[0];
    let sunR = _sunPos(d)[2];
    let xs = -sunR * Math.cos(sunLon * Math.PI/180);
    let ys = -sunR * Math.sin(sunLon * Math.PI/180);
    let xg = xh - xs, yg = yh - ys, zg = zh;
    let lon = _rev(Math.atan2(yg, xg) * 180/Math.PI);
    let lat = Math.atan2(zg, Math.sqrt(xg*xg + yg*yg)) * 180/Math.PI;
    let dist = Math.sqrt(xg*xg + yg*yg + zg*zg);
    // Jupiter/Saturn perturbations
    let s = (a) => Math.sin(a * Math.PI/180);
    let c = (a) => Math.cos(a * Math.PI/180);
    if (name === 'Jupiter') {
        let Mj = M;
        let Msat = _rev(_PLANETS.Saturn.M + _PLANETS.Saturn.M_rate * d);
        lon += (-0.332 * s(2*Mj - 5*Msat - 67.6) - 0.056 * s(2*Mj - 2*Msat + 21) + 0.042 * s(Mj - 2*Msat + 12));
        lat += 0.032 * s(Mj - 2*Msat + 12);
        lon = _rev(lon);
    } else if (name === 'Saturn') {
        let Msat = M;
        let Mj = _rev(_PLANETS.Jupiter.M + _PLANETS.Jupiter.M_rate * d);
        lon += (0.812 * s(2*Mj - 5*Msat - 67.6) - 0.229 * c(2*Mj - 4*Msat - 2) + 0.119 * s(Mj - 2*Msat - 3) + 0.046 * s(2*Mj - 6*Msat - 69) + 0.014 * s(Mj - 3*Msat + 32));
        lat += (-0.020 * c(2*Mj - 4*Msat - 2) + 0.018 * s(2*Mj - 6*Msat - 49));
        lon = _rev(lon);
    }
    return [lon, lat, dist];
}

function _lunarNodes(d) {
    let N = _rev(_MOON.N + _MOON.N_rate * d);
    return [N, _rev(N + 180.0)];
}

function _lahiriAyanamsa(d) {
    let years = d / 365.25;
    return 23.853 + (50.29 / 3600.0) * years;
}

function _obliquity(d) { return 23.4393 - 3.563e-7 * d; }

// ===== 占星转换层 =====
const RASI_CN = ['白羊','金牛','双子','巨蟹','狮子','处女','天秤','天蝎','射手','摩羯','水瓶','双鱼'];
const RASI_EN = ['Mesha','Vrishabha','Mithuna','Karka','Simha','Kanya','Tula','Vrishchika','Dhanu','Makara','Kumbha','Meena'];
const DASHA_SEQ = ['Ketu','Venus','Sun','Moon','Mars','Rahu','Jupiter','Saturn','Mercury'];
const DASHA_PERIODS = {Ketu:7,Venus:20,Sun:6,Moon:10,Mars:7,Rahu:18,Jupiter:16,Saturn:19,Mercury:17};
const DASHA_CN = {Ketu:'计都',Venus:'金星',Sun:'太阳',Moon:'月亮',Mars:'火星',Rahu:'罗睺',Jupiter:'木星',Saturn:'土星',Mercury:'水星'};
const GRAHA_CN = {Sun:'太阳',Moon:'月亮',Mars:'火星',Mercury:'水星',Jupiter:'木星',Venus:'金星',Saturn:'土星',Rahu:'罗睺',Ketu:'计都'};

function _siderealLon(tropLon, ayanamsa) { return _rev(tropLon - ayanamsa); }
function _lonToRasi(lon) { return Math.floor(lon / 30.0) + 1; }
function _lonToNakshatra(lon) { return Math.floor(lon / (360.0/27.0)) + 1; }
function _lonToPada(lon) {
    let nakSpan = 360.0/27.0;
    return Math.floor((lon % nakSpan) / (nakSpan/4.0)) + 1;
}

function _planetStatus(planet, rasi) {
    let own = REF_DATA.own_signs[planet] || [];
    let exalt = REF_DATA.exaltation[planet] || {};
    let debil = REF_DATA.debilitation[planet] || {};
    if (exalt.sign === rasi) return '庙旺(exalted)';
    if (debil.sign === rasi) return '落陷(debilitated)';
    if (own.includes(rasi)) return '本宫(own sign)';
    let friends = {Sun:[1,4,5,9,11],Moon:[1,3,6,7,10,11],Mars:[1,2,4,5,7,8,9,11],Mercury:[2,6,8,9,10,11],Jupiter:[1,2,3,4,8,9,11,12],Venus:[1,2,3,4,7,8,9,10,11,12],Saturn:[1,3,4,7,8,9,10,11,12],Rahu:[1,2,3,6,7,9,10,11],Ketu:[1,2,3,6,7,9,10,11]};
    if ((friends[planet]||[]).includes(rasi)) return '友好(friendly)';
    return '中性(neutral)';
}

function _isKendra(h) { return [1,4,7,10].includes(h); }
function _isTrikona(h) { return [1,5,9].includes(h); }

function _detectYogas(planetsRasi, lagnaRasi, moonRasi) {
    let yogas = [];
    let houseFrom = (ref, target) => ((target - ref) % 12) + 1;
    let pmp = {Ruchaka:['Mars',[1,8]],Bhadra:['Mercury',[3,6]],Hamsa:['Jupiter',[9,12]],Malavya:['Venus',[2,7]],Sasa:['Saturn',[10,11]]};
    for (let [yn, [p, signs]] of Object.entries(pmp)) {
        if (planetsRasi[p] !== undefined && signs.includes(planetsRasi[p])) {
            if (_isKendra(houseFrom(lagnaRasi, planetsRasi[p]))) {
                yogas.push(yn + '(' + REF_DATA.yoga_definitions[yn].effect + ')');
            }
        }
    }
    if (planetsRasi.Jupiter !== undefined && moonRasi) {
        if (_isKendra(houseFrom(moonRasi, planetsRasi.Jupiter))) yogas.push('Gajakesari(智慧/名声/品德)');
    }
    if (planetsRasi.Sun !== undefined && planetsRasi.Mercury !== undefined) {
        if (planetsRasi.Sun === planetsRasi.Mercury) yogas.push('Budhaditya(智力/学问)');
    }
    if (planetsRasi.Moon !== undefined && planetsRasi.Mars !== undefined) {
        let h = houseFrom(planetsRasi.Moon, planetsRasi.Mars);
        if ([1,7].includes(h)) yogas.push('ChandraMangala(财富/进取)');
    }
    if (moonRasi) {
        let prev = ((moonRasi - 2) % 12) + 1;
        let next = (moonRasi % 12) + 1;
        let hasComp = false;
        for (let [p, r] of Object.entries(planetsRasi)) {
            if (p !== 'Moon' && (r === prev || r === next || r === moonRasi)) { hasComp = true; break; }
        }
        if (!hasComp) yogas.push('Kemadruma(孤独/自力更生)');
    }
    return yogas;
}

function _calcDasha(moonSidLon, birthDT, currentDT) {
    let nak = _lonToNakshatra(moonSidLon);
    let nakIdx = nak - 1;
    let dashaLordIdx = nakIdx % 9;
    let dashaLord = DASHA_SEQ[dashaLordIdx];
    let nakSpan = 360.0/27.0;
    let fracElapsed = (moonSidLon % nakSpan) / nakSpan;
    let totalYears = DASHA_PERIODS[dashaLord];
    let elapsedYears = fracElapsed * totalYears;
    let mahaStart = new Date(birthDT.getTime() - elapsedYears * 365.25 * 86400000);
    let currentLord = dashaLord;
    let currentMahaStart = mahaStart;
    let lordIdx = dashaLordIdx;
    let period = totalYears;
    let mahaEnd;
    while (true) {
        period = DASHA_PERIODS[currentLord];
        mahaEnd = new Date(currentMahaStart.getTime() + period * 365.25 * 86400000);
        if (currentDT < mahaEnd) break;
        lordIdx = (lordIdx + 1) % 9;
        currentLord = DASHA_SEQ[lordIdx];
        currentMahaStart = mahaEnd;
        if (lordIdx === dashaLordIdx) break;
    }
    let mahaRemaining = (mahaEnd - currentDT) / (365.25 * 86400000);
    // Antardasha
    let antarLordIdx = DASHA_SEQ.indexOf(currentLord);
    let antarStart = currentMahaStart;
    let antarIdx = antarLordIdx;
    let antarEnd;
    while (true) {
        let antarYears = period * DASHA_PERIODS[DASHA_SEQ[antarIdx]] / 120.0;
        antarEnd = new Date(antarStart.getTime() + antarYears * 365.25 * 86400000);
        if (currentDT < antarEnd) break;
        antarStart = antarEnd;
        antarIdx = (antarIdx + 1) % 9;
        if (antarIdx === antarLordIdx) break;
    }
    let currentAntarLord = DASHA_SEQ[antarIdx];
    let antarRemaining = (antarEnd - currentDT) / (365.25 * 86400000);
    return [currentLord, DASHA_CN[currentLord], Math.round(mahaRemaining*100)/100, currentAntarLord, DASHA_CN[currentAntarLord], Math.round(antarRemaining*100)/100];
}

function _calcLagna(d, lat, lon) {
    let GMST = _rev(280.46061837 + 360.98564736629 * d);
    let LST = _rev(GMST + lon);
    let obl = _obliquity(d);
    let oblRad = obl * Math.PI/180;
    let lstRad = LST * Math.PI/180;
    let latRad = lat * Math.PI/180;
    let ascRad = Math.atan2(Math.cos(lstRad), Math.sin(lstRad)*Math.cos(oblRad) + Math.tan(latRad)*Math.sin(oblRad));
    let ascLon = _rev(ascRad * 180/Math.PI);
    let ayanamsa = _lahiriAyanamsa(d);
    return _siderealLon(ascLon, ayanamsa);
}

// ===== 7层标签生成 =====
function generateLabels(year, month, day, hour, minute, lat, lon) {
    let d = _dayNumber(year, month, day, hour, minute);
    let ayanamsa = _lahiriAyanamsa(d);
    let birthDT = new Date(Date.UTC(year, month-1, day, hour, minute, 0));
    let now = new Date();

    let sunTrop = _sunPos(d)[0];
    let sunSid = _siderealLon(sunTrop, ayanamsa);
    let moonTrop = _moonPos(d)[0];
    let moonSid = _siderealLon(moonTrop, ayanamsa);

    let planetSids = {};
    for (let p of ['Mercury','Venus','Mars','Jupiter','Saturn']) {
        planetSids[p] = _siderealLon(_planetPos(p, d)[0], ayanamsa);
    }
    let nodes = _lunarNodes(d);
    let rahuSid = _siderealLon(nodes[0], ayanamsa);
    let ketuSid = _siderealLon(nodes[1], ayanamsa);

    let allPlanets = {Sun:sunSid, Moon:moonSid, Mars:planetSids.Mars, Mercury:planetSids.Mercury, Jupiter:planetSids.Jupiter, Venus:planetSids.Venus, Saturn:planetSids.Saturn, Rahu:rahuSid, Ketu:ketuSid};
    let planetsRasi = {};
    for (let [p, lon2] of Object.entries(allPlanets)) planetsRasi[p] = _lonToRasi(lon2);

    let moonNak = _lonToNakshatra(moonSid);
    let moonPada = _lonToPada(moonSid);
    let lagnaSid = _calcLagna(d, lat, lon);
    let lagnaRasi = _lonToRasi(lagnaSid);
    let dasha = _calcDasha(moonSid, birthDT, now);
    let yogas = _detectYogas(planetsRasi, lagnaRasi, _lonToRasi(moonSid));

    // L1
    let L1 = {};
    for (let [pname, lon2] of Object.entries(allPlanets)) {
        let rasi = _lonToRasi(lon2);
        let nak = _lonToNakshatra(lon2);
        let pada = _lonToPada(lon2);
        let rasiInfo = REF_DATA.rasi_table[String(rasi)];
        let nakInfo = REF_DATA.nakshatra_table[String(nak)];
        let status = (pname === 'Rahu' || pname === 'Ketu') ? '影子行星' : _planetStatus(pname, rasi);
        let house = ((rasi - lagnaRasi) % 12) + 1;
        L1[pname + '_' + GRAHA_CN[pname]] = {
            '恒星黄经': Math.round(lon2*1000)/1000,
            '星座': rasiInfo.name_cn + '(' + rasiInfo.name + ')',
            '星宿': nakInfo.name_cn + '(' + nakInfo.name + ')',
            'pada': pada, '状态': status,
            '宫位(从上升)': house,
            '主管': REF_DATA.graha_attributes[pname].signifies,
            '五行': REF_DATA.graha_attributes[pname].wuxing
        };
    }

    // L2
    let moonRasi = _lonToRasi(moonSid);
    let moonRasiInfo = REF_DATA.rasi_table[String(moonRasi)];
    let moonNakInfo = REF_DATA.nakshatra_table[String(moonNak)];
    let L2 = {
        '月亮星座': moonRasiInfo.name_cn + '(' + moonRasiInfo.name + ')',
        '月亮星宿': moonNakInfo.name_cn + '(' + moonNakInfo.name + ')',
        '月亮pada': moonPada,
        '星宿主星': moonNakInfo.ruler_cn + '(' + moonNakInfo.ruler + ')',
        '星宿神明': moonNakInfo.deity_cn,
        '星宿元素': moonNakInfo.element,
        '星宿象征': moonNakInfo.symbol,
        '月亮宫位(从上升)': ((moonRasi - lagnaRasi) % 12) + 1
    };

    // L3
    let lagnaInfo = REF_DATA.rasi_table[String(lagnaRasi)];
    let L3 = {
        '上升星座': lagnaInfo.name_cn + '(' + lagnaInfo.name + ')',
        '上升主星': lagnaInfo.lord_cn + '(' + lagnaInfo.lord + ')',
        '上升元素': lagnaInfo.element,
        '上升性质': lagnaInfo.quality
    };
    for (let house = 1; house <= 12; house++) {
        let sign = ((lagnaRasi - 1 + house - 1) % 12) + 1;
        let si = REF_DATA.rasi_table[String(sign)];
        let pin = Object.entries(planetsRasi).filter(([p,r]) => r === sign).map(([p,r]) => GRAHA_CN[p]);
        let ht = _isKendra(house) ? '角宫(kendra)' : _isTrikona(house) ? '三合宫(trikona)' : [6,8,12].includes(house) ? '凶宫(dusthana)' : '普通(upachaya)';
        L3['第' + house + '宫'] = {'星座': si.name_cn, '宫主': si.lord_cn, '宫位类型': ht, '宫内行星': pin.length ? pin : '空宫'};
    }

    // L4
    let L4 = {
        '当前大运(Mahadasha)': dasha[1] + '(' + dasha[0] + ')',
        '大运剩余年数': dasha[2],
        '当前小运(Antardasha)': dasha[4] + '(' + dasha[3] + ')',
        '小运剩余年数': dasha[5],
        '大运周期': '120年(Vimshottari)',
        '大运序列': '计都→金星→太阳→月亮→火星→罗睺→木星→土星→水星'
    };

    // L5
    let L5 = {'已激活Yoga': yogas.length ? yogas : '无显著Yoga', 'Yoga总数': yogas.length};
    for (let p of ['Sun','Moon','Mars','Mercury','Jupiter','Venus','Saturn']) {
        let st = _planetStatus(p, planetsRasi[p]);
        if (st.includes('庙旺') || st.includes('落陷')) L5[GRAHA_CN[p] + '特殊状态'] = st;
    }

    // L6
    let ec = {'火':0,'土':0,'风':0,'水':0};
    let qc = {'开创':0,'固定':0,'变动':0};
    for (let [p, r] of Object.entries(planetsRasi)) {
        if (p === 'Rahu' || p === 'Ketu') continue;
        let ri = REF_DATA.rasi_table[String(r)];
        ec[ri.element] = (ec[ri.element]||0) + 1;
        qc[ri.quality] = (qc[ri.quality]||0) + 1;
    }
    ec[lagnaInfo.element] = (ec[lagnaInfo.element]||0) + 1;
    let L6 = {
        '元素分布': Object.entries(ec).map(([k,v])=>k+':'+v).join(' '),
        '性质分布': Object.entries(qc).map(([k,v])=>k+':'+v).join(' '),
        '主导元素': Object.keys(ec).reduce((a,b)=>ec[a]>ec[b]?a:b),
        '主导性质': Object.keys(qc).reduce((a,b)=>qc[a]>qc[b]?a:b),
        'Lahiri岁差': Math.round(ayanamsa*10000)/10000
    };

    // L7
    let dominant = [];
    for (let p of ['Sun','Moon','Mars','Mercury','Jupiter','Venus','Saturn']) {

function dayOfYear(y, m, d) {
  const daysInMonth = [31,28,31,30,31,30,31,31,30,31,30,31];
  let isLeap = (y%4===0 && y%100!==0) || y%400===0;
  let doy = d;
  for (let i = 0; i < m - 1; i++) doy += daysInMonth[i];
  if (m > 2 && isLeap) doy++;
  return doy;
}

    function daysFromEpoch(yr, mo, dy) {
        var total = 0;
        for (var i = 1900; i < yr; i++) {

        }
        total += dayOfYear(yr, mo, dy) - 1;
        return total;
    }

        var INC = 12345n;
        var MASK = 0x7FFFFFFFn;
        st = (st * MULT + INC) & MASK;
        return Number(st);

  var jn=getJiNian(year);
  var yjMaj=jn%4560,yjMin=jn%456;
  var blMaj=jn%4320,blMin=jn%288;
  return{
    yj:{maj:4560,min:456,majPos:yjMaj,minPos:yjMin,isMaj:yjMaj<10,isMin:yjMin<10,desc:(yjMaj<10||yjMin<10)?"灾厄年":"非灾厄年"},
    bl:{maj:4320,min:288,majPos:blMaj,minPos:blMin,isMaj:blMaj<10,isMin:blMin<10,desc:(blMaj<10)?"大厄之终":(blMin<10?"小厄之年":"非厄年")}
  };
}
function getTaishuiHeshen(year){
  var nz=getNianZhi(year);
  var zi=DIZHI.indexOf(nz);
  var hs=DIZHI[(zi+2)%12];
  var hshen=getShenByDizhi(hs);
  return{taishui:nz,heshen:hs,heshenName:hshen?hshen.name:"未知"};
}
function getWangshuai(gong,nz){
  var gwx=TAIYI_GONG[gong].wuxing;
  var swx={寅:"木",卯:"木",辰:"木",巳:"火",午:"火",未:"火",申:"金",酉:"金",戌:"金",亥:"水",子:"水",丑:"水"};
  var wx=swx[nz];
  if(!wx)return"平";
  if(wx==gwx)return"旺";
  if(WX_SHENG[wx]==gwx)return"相";
  if(WX_KE[gwx]==wx)return"死";
  if(WX_KE[wx]==gwx)return"囚";
  return"休";
}
function ganzhi(year,month,day){
  var base=new Date(2024,0,1);
  var target=new Date(year,month-1,day);
  var days=Math.floor((target-base)/(1000*60*60*24));
  var gz=["甲","乙","丙","丁","戊","己","庚","辛","壬","癸"];
  var zz=["子","丑","寅","卯","辰","巳","午","未","申","酉","戌","亥"];
  var di=days%60;var di2=((days%60)+60)%60;
  var dayGz=gz[di2%10]+zz[di2%12];
  var yz=zz[((4+(year-2024))%12+12)%12];
  var yg=gz[((0+(year-2024))%10+10)%10];
  return{yearGz:yg+yz,dayGz:dayGz};
}

window.Systems.taiyi = function(year, month, day, hour, minute, options) {
    hour = hour || 12;
    minute = minute || 0;
    options = options || {};

    var result = generateLabels(year, month, day, hour, minute, options);
    var layers = result.layers;
    var dimensions = {};

    // 展平为 dimensions
    var layerNames = Object.keys(layers);
    for (var i = 0; i < layerNames.length; i++) {
        var layerName = layerNames[i];
        var layerData = layers[layerName];
        var keys = Object.keys(layerData);
        for (var j = 0; j < keys.length; j++) {
            var key = keys[j];
            var val = layerData[key];
            if (typeof val === 'object' && val !== null && !Array.isArray(val)) {
                var subKeys = Object.keys(val);
                for (var k = 0; k < subKeys.length; k++) {
                    var subKey = subKeys[k];
                    var subVal = val[subKey];
                    if (subVal !== null && subVal !== '' && subVal !== false) {
                        dimensions[layerName + '.' + key + '.' + subKey] = subVal;
                    }
                }
            } else if (val !== null && val !== '' && val !== false) {
                if (Array.isArray(val)) {
                    dimensions[layerName + '.' + key] = val.join(', ');
                } else {
                    dimensions[layerName + '.' + key] = val;
                }
            }
        }
    }

    // 生成摘要
    var l1 = layers['L1_基础排盘'] || {};
    var l17 = layers['L17_盘面总评'] || {};
    var summary = '';
    if (l1['阴阳遁']) summary += l1['阴阳遁'];
    if (l1['太乙宫']) summary += ' | ' + l1['太乙宫'];
    if (l1['主算']) summary += ' | 主算:' + l1['主算'];
    if (l1['客算']) summary += ' | 客算:' + l1['客算'];
    if (l17['主客胜负']) summary += ' | ' + l17['主客胜负'];

    return {
        dimensions: dimensions,
        name: '太乙神数',
        meta: result.meta
    };
};

function getShishen(dg,og){

function getXun(jiazi){var idx=LIUJIAZI.indexOf(jiazi);return LIUJIAZI[Math.floor(idx/10)*10]}

function solarToBazi(year,month,day,hour){
var d=new Date(year,month-1,day);
var feb4=new Date(year,1,4);
var yg,yz;
if(d<feb4){yg=TIANGAN[((year-1-2024)%10+10)%10];yz=DIZHI[((year-1-2024)%12+12)%12]}else{yg=TIANGAN[((year-2024)%10+10)%10];yz=DIZHI[((year-2024)%12+12)%12]}
var mz=null;
for(var i=0;i<12;i++){if(month==JIEQI[i][0]){mz=day>=JIEQI[i][1]?JIEQI_ZHI[i]:JIEQI_ZHI[(i-1+12)%12];break}}
if(!mz)mz=month==1?'丑':'子';
var mgStart=WUHU_DUN[yg];var zhiOff=(DIZHI.indexOf(mz)-2+12)%12;
var mg=TIANGAN[(mgStart+zhiOff)%10];
var baseDate=new Date(2000,0,7);
var daysDiff=Math.round((d-baseDate)/(86400000));
var dayIdx=((daysDiff%60)+60)%60;
var dg=TIANGAN[dayIdx%10];var dz=DIZHI[dayIdx%12];
var hourZhi=['子','子','丑','丑','寅','寅','卯','卯','辰','辰','巳','巳','午','午','未','未','申','申','酉','酉','戌','戌','亥','亥'][hour];
var hgStart=WUSHU_DUN[dg];var hg=TIANGAN[(hgStart+DIZHI.indexOf(hourZhi))%10];
return{year:[yg,yz],month:[mg,mz],day:[dg,dz],hour:[hg,hourZhi]};
}

// 干支柱解析: 优先 options.ganzhi, 其次 lunar-javascript, 最后 solarToBazi
function resolvePillars(year, month, day, hour, minute, options) {
    options = options || {};
    // 1. 尝试 options.ganzhi
    if (options.ganzhi && options.ganzhi.yearGz && options.ganzhi.monthGz && options.ganzhi.dayGz && options.ganzhi.hourGz) {
        var gz = options.ganzhi;
        return {
            year: [gz.yearGz[0], gz.yearGz[1]],
            month: [gz.monthGz[0], gz.monthGz[1]],
            day: [gz.dayGz[0], gz.dayGz[1]],
            hour: [gz.hourGz[0], gz.hourGz[1]]
        };
    }
    // 2. 尝试 lunar-javascript
    if (typeof Solar !== 'undefined') {
        try {
            var solar = Solar.fromYmdHms(year, month, day, hour, minute || 0, 0);
            var lunar = solar.getLunar();
            var yg2 = lunar.getYearInGanZhi();
            var mg2 = lunar.getMonthInGanZhi();
            var dg2 = lunar.getDayInGanZhi();
            var hg2 = lunar.getTimeInGanZhi();
            return {
                year: [yg2[0], yg2[1]],
                month: [mg2[0], mg2[1]],
                day: [dg2[0], dg2[1]],
                hour: [hg2[0], hg2[1]]
            };
        } catch(e) { /* fallback */ }
    }
    // 3. 内置 solarToBazi
    return solarToBazi(year, month, day, hour);
}

function calcDayun(pillars,gender,year,month,day){
var yg=pillars.year[0];var isYang=GAN_YY[yg]=='阳';var isMale=gender=='male';
var forward=(isYang&&isMale)||(!isYang&&!isMale);
var birthDate=new Date(year,month-1,day);
var jieqiDates=[];
for(var i=0;i<12;i++){var jy=year;if(JIEQI[i][0]==1&&month>6)jy=year+1;else if(JIEQI[i][0]==12&&month<6)jy=year-1;jieqiDates.push({date:new Date(jy,JIEQI[i][0]-1,JIEQI[i][1]),zhi:JIEQI_ZHI[i]})}
jieqiDates.sort(function(a,b){return a.date-b.date});
var target=null;
if(forward){for(var j=0;j<jieqiDates.length;j++){if(jieqiDates[j].date>birthDate){target=jieqiDates[j].date;break}}}
else{for(var j=jieqiDates.length-1;j>=0;j--){if(jieqiDates[j].date<birthDate){target=jieqiDates[j].date;break}}}
if(!target)target=birthDate;
var daysDiff=Math.abs(Math.round((target-birthDate)/86400000));
var startAge=daysDiff/3.0;
var mg=pillars.month[0],mz=pillars.month[1];var monthJiazi=mg+mz;var monthIdx=LIUJIAZI.indexOf(monthJiazi);
var dyList=[];
for(var i=1;i<=8;i++){var idx=forward?(monthIdx+i)%60:((monthIdx-i)%60+60)%60;var dzJiazi=LIUJIAZI[idx];var sa=startAge+(i-1)*10;var ea=startAge+i*10;
dyList.push({step:i,jiazi:dzJiazi,gan:dzJiazi[0],zhi:dzJiazi[1],startAge:Math.round(sa*10)/10,endAge:Math.round(ea*10)/10,ss:getShishen(pillars.day[0],dzJiazi[0])})}
return{forward:forward?'顺排':'逆排',startAge:Math.round(startAge*10)/10,list:dyList};
}

function calcShenStrongWeak(pillars){

var ws=WANG_SHUAI[season]?WANG_SHUAI[season][dayWx]:'';

score+=wsScore*5;details.push('月令'+ws+'(权重5): '+(wsScore*5>=0?'+':'')+wsScore*5);

var tgScore=(bjCount+yinCount)*2;score+=tgScore*2;details.push('透干比劫印(权重2): '+(tgScore*2>=0?'+':'')+tgScore*2);
var shenfu=0;
for(var i=0;i<4;i++){if(allGan[i]==dg)continue;var gw=GAN_WX[allGan[i]];if(WX_SHENG[gw]==dayWx)shenfu+=1;else if(WX_SHENG[dayWx]==gw)shenfu-=1;else if(WX_KE[dayWx]==gw)shenfu-=1;else if(WX_KE[gw]==dayWx)shenfu-=1}

var result=score>=10?'身强':score<=-10?'身弱':'中和';

function determineYongshen(pillars,shenResult,gejuType){

if(mz=='亥'||mz=='子'||mz=='丑')methods.push(['调候法','命局偏寒，需暖(丙丁火)调候']);
else if(mz=='巳'||mz=='午'||mz=='未')methods.push(['调候法','命局偏热，需凉(壬癸水)调候']);

var wxCount={'木':0,'火':0,'土':0,'金':0,'水':0};
for(var i=0;i<4;i++){wxCount[GAN_WX[allGan[i]]]++;wxCount[ZHI_WX[allZhi[i]]]++}
var bingWx='',bingCnt=0;
for(var w in wxCount){if(wxCount[w]>bingCnt){bingCnt=wxCount[w];bingWx=w}}
if(bingWx!=dayWx&&bingCnt>=4){var yaoWx=WX_KE[bingWx];methods.push(['病药法','病在'+bingWx+'过旺，药取'+yaoWx+'克制'])}

return{methods:methods,main:methods.length>0?methods[0][1]:'',count:methods.length};
}

}

var zhiWxAll=allZhi.map(function(z){return ZHI_WX[z]});

return{count:wxCount,max:maxWx,min:minWx,missing:missing,ws:ws,deling:ws=='旺'||ws=='相'?'是':'否',tonggen:tonggen,coldWarm:coldWarm};
}

function getGeju(pillars){
var dg=pillars.day[0];var mz=pillars.month[1];
var allGan=[pillars.year[0],pillars.month[0],dg,pillars.hour[0]];

var wxCnt={};for(var i=0;i<wxAll.length;i++){wxCnt[wxAll[i]]=(wxCnt[wxAll[i]]||0)+1}
var mostWx='',mostCnt=0;for(var w in wxCnt){if(wxCnt[w]>mostCnt){mostCnt=wxCnt[w];mostWx=w}}
var zwMap={'木':'曲直格','火':'炎上格','土':'稼穑格','金':'从革格','水':'润下格'};
var ssGejuMap={'正官':'正官格','七杀':'七杀格','正财':'正财格','偏财':'偏财格','正印':'正印格','偏印':'偏印格','食神':'食神格','伤官':'伤官格','比肩':'建禄格','劫财':'月刃格'};

else if(dayCnt<=1){var otherWx='',otherCnt=0;for(var w in wxCnt){if(w!=dayWx&&wxCnt[w]>otherCnt){otherCnt=wxCnt[w];otherWx=w}}var congMap={};congMap[WX_KE[dayWx]]='从财格';congMap[dayWx]='从杀格';congMap[WX_SHENG[dayWx]]='从儿格';gejuType='从格';gejuDetail=congMap[otherWx]||'从势格'}
else{gejuType='正格';gejuDetail=ssGejuMap[benqiSs]||'待定'}
var season=MONTH_TO_SEASON[mz]||'';var ws=WANG_SHUAI[season]?WANG_SHUAI[season][dayWx]:'';
var shengCnt=wxCnt[WX_SHENG[dayWx]]||0;
var shen=(ws=='旺'||ws=='相')&&(dayCnt+shengCnt)>=3?'身强':(ws=='死'||ws=='囚')&&(dayCnt+shengCnt)<=2?'身弱':'中和';
var yongshen=shen=='身强'?'克泄耗(官杀/食伤/财星)':shen=='身弱'?'生扶(印星/比劫)':'调候通关';
var tiaohou=(mz=='亥'||mz=='子'||mz=='丑')?'需暖(丙丁火)':(mz=='巳'||mz=='午'||mz=='未')?'需凉(壬癸水)':'适中';
return{benqiSs:benqiSs,type:gejuType,detail:gejuDetail,shen:shen,yongshen:yongshen,tiaohou:tiaohou};
}

// ===== 标签生成函数 =====
function generateLabels(year, month, day, hour, minute, options) {
    options = options || {};
    var gender = options.gender || 'male';

    var pillars = resolvePillars(year, month, day, hour, minute, options);
    var dg = pillars.day[0];
    var allGan = [pillars.year[0], pillars.month[0], dg, pillars.hour[0]];
    var allZhi = [pillars.year[1], pillars.month[1], pillars.day[1], pillars.hour[1]];
    var pn = ['年', '月', '日', '时'];

    var geju = getGeju(pillars);
    var shen = calcShenStrongWeak(pillars);
    var yongshen = determineYongshen(pillars, shen.result, geju.type);
    var dayun = calcDayun(pillars, gender, year, month, day);
    var jieqiWarn = checkJieqiBoundary(month, day);
    var ss = findShensha(pillars);
    var wb = getWuxingBalance(pillars);
    var xch = findXingChongHeHai(pillars);
    var dayJiazi = dg + pillars.day[1];
    var nayin = NAYIN[dayJiazi] || '';

    // 十神分布
    var ssCount = {'比肩':0,'劫财':0,'食神':0,'伤官':0,'偏财':0,'正财':0,'七杀':0,'正官':0,'偏印':0,'正印':0};
    for (var i = 0; i < 4; i++) {
        if (i != 2) { var s = getShishen(dg, allGan[i]); ssCount[s]++; }
        var cang = ZHI_CANG[allZhi[i]];
        for (var j = 0; j < cang.length; j++) { var s2 = getShishen(dg, cang[j][0]); ssCount[s2]++; }
    }

    // L1 四柱基础
    var L1 = {};
    for (var i = 0; i < 4; i++) {
        L1[pn[i] + '柱天干'] = allGan[i];
        L1[pn[i] + '柱地支'] = allZhi[i];
    }

    // L2 天干属性
    var L2 = {};
    for (var i = 0; i < 4; i++) {
        L2[pn[i] + '干五行'] = GAN_WX[allGan[i]];
        L2[pn[i] + '干阴阳'] = GAN_YY[allGan[i]];
    }

    // L3 地支属性
    var L3 = {};
    for (var i = 0; i < 4; i++) {
        L3[pn[i] + '支五行'] = ZHI_WX[allZhi[i]];
        L3[pn[i] + '支生肖'] = ZHI_SX[allZhi[i]];
    }

    // L4 藏干
    var L4 = {};
    for (var i = 0; i < 4; i++) {
        var cang = ZHI_CANG[allZhi[i]];
        for (var j = 0; j < cang.length; j++) {
            L4[pn[i] + '支' + cang[j][1]] = cang[j][0] + '(' + getShishen(dg, cang[j][0]) + ')';
        }
    }

    // L5 十神系统
    var L5 = {};
    for (var i = 0; i < 4; i++) {
        if (i != 2) L5[pn[i] + '干十神'] = getShishen(dg, allGan[i]);
    }
    for (var s in ssCount) { L5['十神_' + s] = String(ssCount[s]); }

    // L6 纳音
    var L6 = {};
    for (var i = 0; i < 4; i++) {
        var jiazi = allGan[i] + allZhi[i];
        L6[pn[i] + '柱纳音'] = NAYIN[jiazi] || '';
    }

    // L7 十二长生
    var L7 = {};
    for (var i = 0; i < 4; i++) {
        var cs = CHANGSHENG[dg] || {};
        L7[pn[i] + '支长生'] = cs[allZhi[i]] || '';
    }

    // L8 神煞(详细)
    var L8 = {};
    var ssOrder = ['天乙贵人','文昌贵人','禄神','羊刃','驿马','桃花','华盖','将星','劫煞','亡神','灾煞','红鸾','天喜','魁罡','孤鸾煞','阴阳差错','十恶大败','十灵日','进神','天赦','飞刃','空亡'];
    for (var i = 0; i < ssOrder.length; i++) {
        var name = ssOrder[i];
        var val = ss[name];
        L8[name] = Array.isArray(val) ? (val.length > 0 ? val.join(',') : '-') : (val || '-');
    }

    // L9 格局
    var L9 = {
        '月令本气十神': geju.benqiSs,
        '格局类型': geju.type,
        '格局细分': geju.detail,
        '身强弱': geju.shen,
        '用神方向': geju.yongshen,
        '调候': geju.tiaohou
    };

    // L10 宫位
    var L10 = {};
    var gwm = {'年':'祖业宫','月':'父母宫','日':'夫妻宫','时':'子女宫'};
    for (var i = 0; i < 4; i++) { L10[pn[i] + '柱宫位'] = gwm[pn[i]]; }

    // L11 五行平衡(详细)
    var L11 = {};
    for (var w in wb.count) { L11['五行_' + w] = String(wb.count[w]); }
    L11['最旺'] = wb.max;
    L11['最弱'] = wb.min;
    L11['月令旺衰'] = wb.ws;
    L11['得令'] = wb.deling;

    // L12 刑冲合害(详细)
    var L12 = {};
    for (var k in xch) { L12[k] = xch[k].length > 0 ? xch[k].join(',') : '无'; }

    // L13 大运流年
    var L13 = {};
    L13['大运排法'] = dayun.forward;
    L13['起运岁数'] = String(dayun.startAge);
    for (var i = 0; i < dayun.list.length; i++) {
        var dy = dayun.list[i];
        L13['大运' + dy.step] = dy.jiazi + '(' + dy.startAge + '-' + dy.endAge + '岁) ' + dy.ss;
    }

    // L14 旬空
    var L14 = {};
    var xun = getXun(dayJiazi);
    var kw = KONG_WANG[xun] || [];
    L14['旬'] = xun;
    L14['空亡地支'] = kw.join(',');
    var kwP = [];
    for (var i = 0; i < 4; i++) { if (kw.indexOf(allZhi[i]) >= 0) kwP.push(pn[i]); }
    L14['空亡宫位'] = kwP.length > 0 ? kwP.join(',') : '无';

    // L15 特殊组合
    var L15 = {};
    var allSameGan = allGan[0]==allGan[1]&&allGan[1]==allGan[2]&&allGan[2]==allGan[3];
    var allSameZhi = allZhi[0]==allZhi[1]&&allZhi[1]==allZhi[2]&&allZhi[2]==allZhi[3];
    L15['天元一气'] = allSameGan ? '是' : '否';
    L15['地元一气'] = allSameZhi ? '是' : '否';
    L15['魁罡日'] = SHENSHA_DAY['魁罡'].indexOf(dayJiazi) >= 0 ? '是' : '否';
    L15['十恶大败'] = SHENSHA_DAY['十恶大败'].indexOf(dayJiazi) >= 0 ? '是' : '否';
    L15['进神'] = JINSHEN.indexOf(dayJiazi) >= 0 ? '是' : '否';

    // L16 命局层次
    var L16 = {};
    L16['寒暖'] = wb.coldWarm;
    var hasChong = false;
    for (var k in xch) { if (xch[k].length > 0 && k.indexOf('冲') >= 0) hasChong = true; }
    L16['动静'] = hasChong ? '动' : '静';
    var yangCnt = 0;
    for (var i = 0; i < 4; i++) if (GAN_YY[allGan[i]] == '阳') yangCnt++;
    L16['刚柔'] = yangCnt >= 3 ? '刚' : (yangCnt <= 1 ? '柔' : '刚柔并济');

    // L17 六亲
    var L17 = {};
    L17['父母星'] = ssCount['正印'] > 0 ? '正印' : (ssCount['偏印'] > 0 ? '偏印' : '缺');
    L17['兄弟星'] = ssCount['比肩'] > 0 ? '比肩' : (ssCount['劫财'] > 0 ? '劫财' : '缺');
    L17['子女星'] = ssCount['食神'] > 0 ? '食神' : (ssCount['伤官'] > 0 ? '伤官' : '缺');
    L17['配偶星'] = ssCount['正财'] > 0 ? '正财' : (ssCount['偏财'] > 0 ? '偏财' : '缺');
    L17['事业星'] = ssCount['正官'] > 0 ? '正官' : (ssCount['七杀'] > 0 ? '七杀' : '缺');
    L17['贵人星'] = (ss['天乙贵人'] && ss['天乙贵人'].length > 0) ? '有' : '无';
    L17['桃花星'] = ss['桃花'] ? '有' : '无';

    // 命局核心
    var L0 = {
        '日主': dg + ' ' + GAN_WX[dg],
        '日主阴阳': GAN_YY[dg],
        '格局类型': geju.type + '·' + geju.detail,
        '身强弱_优化3': shen.result + ' (' + shen.score + '分)',
        '月令旺衰': shen.ws,
        '用神_优化4': yongshen.main,
        '调候': geju.tiaohou,
        '纳音日柱': nayin,
        '大运排法_优化2': dayun.forward + ' ' + dayun.startAge + '岁起',
        '身强强弱明细': shen.details,
        '用神方法数': String(yongshen.count)
    };

    // 节气预警
    var L_warn = {};
    if (jieqiWarn.length > 0) {
        L_warn['节气边界预警_优化1'] = jieqiWarn.join('; ');
    }

    // 破格检查
    var L_break = {};
    if (geju.type == '从格') {
        var cg = checkConggeBreak(pillars);
        L_break['破格检查_优化5'] = cg.broken ? '从格被破格' : '从格成立';
        L_break['破格因素'] = cg.factors.join('; ');
    }

    // 五行平衡
    var L_wb = {};
    for (var w in wb.count) { L_wb['五行_' + w] = String(wb.count[w]); }
    L_wb['最旺'] = wb.max;
    L_wb['最弱'] = wb.min;
    L_wb['缺失'] = wb.missing.length > 0 ? wb.missing.join(',') : '无';
    L_wb['得令'] = wb.deling;
    L_wb['寒暖'] = wb.coldWarm;
    L_wb['通根'] = wb.tonggen.length > 0 ? wb.tonggen.join(',') : '无';

    // 十神分布
    var L_ss = {};
    for (var s in ssCount) { L_ss[s] = String(ssCount[s]); }

    var layers = {
        'L0_命局核心': L0,
        'L1_四柱基础': L1,
        'L2_天干属性': L2,
        'L3_地支属性': L3,
        'L4_藏干': L4,
        'L5_十神系统': L5,
        'L6_纳音': L6,
        'L7_十二长生': L7,
        'L8_神煞详细': L8,
        'L9_格局': L9,
        'L10_宫位': L10,
        'L11_五行平衡': L11,
        'L12_刑冲合害': L12,
        'L13_大运流年': L13,
        'L14_旬空': L14,
        'L15_特殊组合': L15,
        'L16_命局层次': L16,
        'L17_六亲': L17
    };

    // 添加可选层
    if (Object.keys(L_warn).length > 0) layers['L_warn_节气预警'] = L_warn;
    if (Object.keys(L_break).length > 0) layers['L_break_破格检查'] = L_break;
    layers['L_wb_五行平衡详细'] = L_wb;
    layers['L_ss_十神分布'] = L_ss;

    // 计算维度数
    var totalDims = 0;
    var layerNames = Object.keys(layers);
    for (var i = 0; i < layerNames.length; i++) {
        var ld = layers[layerNames[i]];
        var keys = Object.keys(ld);
        for (var j = 0; j < keys.length; j++) {
            var val = ld[keys[j]];
            if (typeof val === 'object' && val !== null && !Array.isArray(val)) {
                totalDims += Object.keys(val).length;
            } else {
                totalDims++;
            }
        }
    }

    return {
        layers: layers,
        meta: {
            system_name: 'bazi',
            system_name_cn: '八字四柱',
            total_dimensions: totalDims,
            timestamp: year + '-' + String(month).padStart(2, '0') + '-' + String(day).padStart(2, '0') + ' ' + String(hour).padStart(2, '0') + ':' + String(minute || 0).padStart(2, '0'),
            dayMaster: dg,

// ===== 计算函数 =====
function solarToGanzhi(year,month,day){
var base=new Date(2024,0,1);
var target=new Date(year,month-1,day);
var daysDiff=Math.round((target-base)/86400000);
var dayIdx=((daysDiff%60)+60)%60;
var dayGan=TIANGAN[dayIdx%10];
var dayZhi=DIZHI[dayIdx%12];
var dayGz=dayGan+dayZhi;
var feb4=new Date(year,1,4);
var yearGan,yearZhi;
if(target<feb4){
yearGan=TIANGAN[((year-1-2024)%10+10)%10];
yearZhi=DIZHI[((year-1-2024)%12+12)%12];
}else{
yearGan=TIANGAN[((year-2024)%10+10)%10];
yearZhi=DIZHI[((year-2024)%12+12)%12];
}
return{yearGz:yearGan+yearZhi,monthGz:"估算",dayGz:dayGz,dayGan:dayGan,dayZhi:dayZhi,dayIdx:dayIdx};
}
