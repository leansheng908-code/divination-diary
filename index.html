    if (options.ganzhi && options.ganzhi.yearGz && options.ganzhi.dayGz) {
        var gz = options.ganzhi;
        var dayGz = gz.dayGz;
        return {
            yearGz: gz.yearGz,
            monthGz: gz.monthGz || '估算',
            dayGz: dayGz,
            dayGan: dayGz[0],
            dayZhi: dayGz[1],
            dayIdx: -1
        };
    }
    return solarToGanzhi(year, month, day);
}

function calcMonthZhi(year,month,day){
var targetMd=[month,day];
for(var i=0;i<12;i++){
var nextI=(i+1)%12;
var cur=JIEQI_DATES[i];
var nxt=JIEQI_DATES[nextI];
if(cur[0]>nxt[0]||(cur[0]==nxt[0]&&cur[1]>nxt[1])){
if(compareMd(targetMd,cur)>=0||compareMd(targetMd,nxt)<0){
return MONTH_ZHI_BY_JIEQI[i];
}
}else{
if(compareMd(targetMd,cur)>=0&&compareMd(targetMd,nxt)<0){
return MONTH_ZHI_BY_JIEQI[i];
}
}
}
if(compareMd(targetMd,[1,6])>=0&&compareMd(targetMd,[2,4])<0){return"丑";}
return"寅";
}

function compareMd(a,b){
if(a[0]!=b[0])return a[0]-b[0];
return a[1]-b[1];
}

function solarToLunarMd(year,month,day){
var lunarBase=new Date(1900,0,31);
var target=new Date(year,month-1,day);
var daysDiff=Math.round((target-lunarBase)/86400000);
if(daysDiff<0)return[1,1];
var lunarMonthAvg=29.53059;
var totalMonths=Math.floor(daysDiff/lunarMonthAvg);
var remainingDays=daysDiff-Math.floor(totalMonths*lunarMonthAvg);
var lunarMonth=(totalMonths%12)+1;
var lunarDay=remainingDays+1;
if(lunarDay>30){lunarMonth=(lunarMonth%12)+1;lunarDay-=30;}
if(lunarDay<1)lunarDay=1;
return[lunarMonth,lunarDay];
}

function calcLiuyaoLunar(year,month,day){
var md=solarToLunarMd(year,month,day);
var lunarMonth=md[0],lunarDay=md[1];
var remainder=(lunarMonth+lunarDay)%6;
var result=LIUYAO[remainder];
return{liuyao:result,jixiong:LIUYAO_ATTR[result].jixiong,desc:LIUYAO_ATTR[result].desc,lunarMonth:lunarMonth,lunarDay:lunarDay};
}

function calcXiuPrecise(year,month,day){
var xiuBase=new Date(2024,0,1);
var target=new Date(year,month-1,day);
var daysDiff=Math.round((target-xiuBase)/86400000);
var xiuIndex=((daysDiff%28)+28)%28;
var xiu=ERSHIBA_XIU[xiuIndex];
return{name:xiu.name,xiang:xiu.xiang,fangwei:xiu.fangwei,wuxing:xiu.wuxing,jixiong:xiu.jixiong,desc:xiu.desc,yi:xiu.yi,ji:xiu.ji,xuIndex:xiuIndex+1};
}

function calcJishen(monthZhi,dayGan,dayZhi){
var dayGz=dayGan+dayZhi;
var tiande=TIANDE_TABLE[monthZhi]||"无";
var yuede=YUEDE_TABLE[monthZhi]||"无";
var isTiansha=false;
for(var i=0;i<TIANSHA_DAYS.length;i++){if(TIANSHA_DAYS[i]==dayGz){isTiansha=true;break;}}
var tianyi=TIANYI_GUIREN[dayGan]||"无";
var jiCount=0;
if(tiande==dayGan)jiCount++;
if(yuede==dayGan)jiCount++;
if(isTiansha)jiCount++;
if(tianyi!="无")jiCount++;
return{tiande:tiande,tiandeLin:tiande==dayGan?"是":"否",yuede:yuede,yuedeLin:yuede==dayGan?"是":"否",tiansha:isTiansha?"是":"否",tianyi:tianyi,jiCount:jiCount};
}

function checkSiliSijue(year,month,day){
var target=new Date(year,month-1,day);
var results=[];
for(var name in JIEQI_APPROX){
var jq=JIEQI_APPROX[name];
var jieqiDate=new Date(year,jq[0]-1,jq[1]);
var prevDay=new Date(jieqiDate.getTime()-86400000);
if(target.getTime()==prevDay.getTime()){
if(name=="春分"||name=="夏至"||name=="秋分"||name=="冬至"){
results.push("四离日（"+name+"前一日）");
}else if(name=="立春"||name=="立夏"||name=="立秋"||name=="立冬"){
results.push("四绝日（"+name+"前一日）");
}
}
}
return{isHit:results.length>0?"是":"否",detail:results.length>0?results.join("; "):"无"};
}

function calcComprehensiveYiji(jianchu,huangHei,xiuJixiong,liuyaoJixiong,isSuiPo,isYuePo,siliSijue,jishenCount){
var level1Xiong=[];
var level2Xiong=[];
var level3Ji=[];
if(isSuiPo)level1Xiong.push("岁破日");
if(isYuePo)level1Xiong.push("月破日");
if(siliSijue)level1Xiong.push("四离四绝日");
if(jianchu=="破"||jianchu=="闭")level1Xiong.push(jianchu+"日(大凶)");
var heidaoNames=["白虎","天刑","朱雀","天牢","玄武","勾陈"];
for(var i=0;i<heidaoNames.length;i++){if(huangHei==heidaoNames[i]){level2Xiong.push(huangHei+"(黑道)");break;}}
if(xiuJixiong=="凶")level2Xiong.push("凶宿值日");
if(liuyaoJixiong=="大凶"||liuyaoJixiong=="凶")level2Xiong.push(liuyaoJixiong+"六曜");
var huangdaoNames=["青龙","明堂","金匮","天德","玉堂","司命"];
for(var i=0;i<huangdaoNames.length;i++){if(huangHei==huangdaoNames[i]){level3Ji.push(huangHei+"(黄道)");break;}}
if(xiuJixiong=="吉")level3Ji.push("吉宿值日");
if(liuyaoJixiong=="大吉"||liuyaoJixiong=="吉")level3Ji.push(liuyaoJixiong+"六曜");
if(jianchu=="成"||jianchu=="开")level3Ji.push(jianchu+"日(大吉)");
if(jianchu=="除"||jianchu=="危"||jianchu=="定"||jianchu=="执")level3Ji.push(jianchu+"日(黄道)");
if(jishenCount>0)level3Ji.push("吉神"+jishenCount+"位临日");
var verdict,verdictDesc;
if(level1Xiong.length>0){verdict="大凶";verdictDesc="诸事不宜";}
else if(level2Xiong.length>=2){verdict="凶";verdictDesc="凶煞叠加，重大事项不宜";}
else if(level2Xiong.length>0){
if(level3Ji.length>=2){verdict="平";verdictDesc="凶吉参半，吉神可解，常规可行";}
else{verdict="小凶";verdictDesc="有凶煞无吉解，谨慎行事";}
}
else if(level3Ji.length>=3){verdict="大吉";verdictDesc="吉神汇聚，宜办大事";}
else if(level3Ji.length>0){verdict="吉";verdictDesc="吉神临日，诸事可行";}
else{verdict="平";verdictDesc="平淡无奇，常规可行";}
return{verdict:verdict,verdictDesc:verdictDesc,level1Xiong:level1Xiong,level2Xiong:level2Xiong,level3Ji:level3Ji};
}

function getJianchu(dayZhi,monthZhi){
var jianPos=DIZHI.indexOf(monthZhi);
var dayPos=DIZHI.indexOf(dayZhi);
if(jianPos<0)jianPos=0;
if(dayPos<0)dayPos=0;
var offset=((dayPos-jianPos)%12+12)%12;
return JIANCHU[offset];
}

function getHuangHeiDao(dayZhi){
var zhiIdx=DIZHI.indexOf(dayZhi);
if(zhiIdx<0)zhiIdx=0;
return HUANG_HEI_ORDER[zhiIdx%12];
}

function getNayin(dayGan,dayZhi){
var key=dayGan+dayZhi;
for(var k in NAYIN){if(k.indexOf(key)>=0)return NAYIN[k];}
return"未知";
}

function getRichong(dayZhi){return LIUCHONG[dayZhi]||"未知";}
function getRiha(dayZhi){return LIUHAI[dayZhi]||"未知";}
function getSuiPo(yearZhi,dayZhi){var yearChong=LIUCHONG[yearZhi]||"";return dayZhi==yearChong;}
function getYuePo(monthZhi,dayZhi){var monthChong=LIUCHONG[monthZhi]||"";return dayZhi==monthChong;}
function getSanShaFangwei(yearZhi){for(var k in SANSHA){if(k.indexOf(yearZhi)>=0)return SANSHA[k];}return"未知";}

window.Systems.tongsheng = function(year, month, day, hour, minute, options) {
    hour = hour || 12;
    minute = minute || 0;
    options = options || {};

    var result = generateLabels(year, month, day, hour, minute, options);
    var layers = result.layers;
    var dimensions = {};

    // 展平为 dimensions
    var layerNames = Object.keys(layers);
    for (var i = 0; i < layerNames.length; i++) {
        var layerName = layerNames[i];
        var layerData = layers[layerName];
        var keys = Object.keys(layerData);
        for (var j = 0; j < keys.length; j++) {
            var key = keys[j];
            var val = layerData[key];
            if (typeof val === 'object' && val !== null && !Array.isArray(val)) {
                var subKeys = Object.keys(val);
                for (var k = 0; k < subKeys.length; k++) {
                    var subKey = subKeys[k];
                    var subVal = val[subKey];
                    if (subVal !== null && subVal !== '' && subVal !== false) {
                        dimensions[layerName + '.' + key + '.' + subKey] = subVal;
                    }
                }
            } else if (val !== null && val !== '' && val !== false) {
                if (Array.isArray(val)) {
                    dimensions[layerName + '.' + key] = val.join(', ');
                } else {
                    dimensions[layerName + '.' + key] = val;
                }
            }
        }
    }

    // 生成摘要
    var l0 = layers['L0_核心展示'] || {};
    var l_verdict = layers['L_verdict_综合宜忌'] || {};
    var summary = '';

    if (l0['二十八宿']) summary += ' | ' + l0['二十八宿'];
    if (l_verdict['综合判定']) summary += ' | ' + l_verdict['综合判定'];

    return {
        dimensions: dimensions,
        name: '通胜择日',
        meta: result.meta
    };
};

    "少阳相火":"火","阳明燥金":"金","太阳寒水":"水"
    };

    // ============================================================
    // Part 3: 干支推算函数
    // ============================================================

    function solarToGanzhi(year,month,day){
        var base=new Date(2024,0,1);
        var target=new Date(year,month-1,day);
        var daysDiff=Math.round((target-base)/86400000);
        var dayIdx=((daysDiff%60)+60)%60;
        var dayGan=TIANGAN[dayIdx%10];
        var dayZhi=DIZHI[dayIdx%12];
        var dayGz=dayGan+dayZhi;
        var feb4=new Date(year,1,4);
        var yearGan,yearZhi;
        if(target<feb4){
            yearGan=TIANGAN[((year-1-2024)%10+10)%10];
            yearZhi=DIZHI[((year-1-2024+4)%12+12)%12];
        }else{
            yearGan=TIANGAN[((year-2024)%10+10)%10];
            yearZhi=DIZHI[((year-2024+4)%12+12)%12];
        }
        return{yearGz:yearGan+yearZhi,dayGz:dayGz,dayGan:dayGan,dayZhi:dayZhi,yearGan:yearGan,yearZhi:yearZhi};
    }

    function calcMonthZhi(year,month,day){
        var md=month*100+day;
        var i;
        for(i=11;i>=0;i--){
            var jie=MONTH_JIE[i];
            var jieMd=jie.m*100+jie.d;
            if(md>=jieMd){return jie.zhi;}
        }
        return"丑";
    }

    function calcMonthGanZhi(year,month,day,yearGan){
        var monthZhi=calcMonthZhi(year,month,day);
        var zhiIdx=DIZHI.indexOf(monthZhi);
        var yinIdx=DIZHI.indexOf("寅");
        var monthOffset=((zhiIdx-yinIdx)%12+12)%12;
        var startGanIdx=WUHU_DUN[yearGan]||0;
        var monthGanIdx=(startGanIdx+monthOffset)%10;
        var monthGan=TIANGAN[monthGanIdx];
        return monthGan+monthZhi;
    }

    function calcHourZhi(hour){
        return DIZHI[Math.floor((hour%24+1)/2)%12];
    }

    function calcHourGan(dayGan,hourZhi){
        var zhiIdx=DIZHI.indexOf(hourZhi);
        var startIdx=WUSHU_DUN[dayGan]||0;
        var hourGanIdx=(startIdx+zhiIdx)%10;
        return TIANGAN[hourGanIdx];
    }

    function getWuyun(yearGan){
        var key;
        for(key in WUYUN){
            if(WUYUN.hasOwnProperty(key)){
                if(key.indexOf(yearGan)>=0){return WUYUN[key];}
            }
        }
        return{};
    }

    function getLiuqi(yearZhi){
        var key;
        for(key in LIUQI_SITIAN){
            if(LIUQI_SITIAN.hasOwnProperty(key)){
                if(key.indexOf(yearZhi)>=0){return LIUQI_SITIAN[key];}
            }
        }
        return{};
    }

    // ============================================================
    // Part 4: 优化计算函数
    // ============================================================

    function getZhuqiPrecise(month,day){
        function jq(name){var d=JIEQI_DATES[name];return d[0]*100+d[1];}
        var cur=month*100+day;
        if(cur>=jq("小雪")||cur<jq("大寒")){return LIUQI_ZHUQI[5];}
        else if(cur<jq("春分")){return LIUQI_ZHUQI[0];}
        else if(cur<jq("小满")){return LIUQI_ZHUQI[1];}
        else if(cur<jq("大暑")){return LIUQI_ZHUQI[2];}
        else if(cur<jq("秋分")){return LIUQI_ZHUQI[3];}
        else{return LIUQI_ZHUQI[4];}
    }

    function calcLingguiBafa(dayGan,dayZhi,hourGan,hourZhi){
        var isYangDay=YANG_GAN.hasOwnProperty(dayGan);
        var dayGanNum=GAN_NUM[dayGan]||1;
        var dayZhiNum=ZHI_NUM[dayZhi]||1;
        var hourGanNum=GAN_NUM[hourGan]||1;
        var hourZhiNum=ZHI_NUM[hourZhi]||1;
        var total=dayGanNum+dayZhiNum+hourGanNum+hourZhiNum;
        var divisor=isYangDay?9:6;
        var remainder=total%divisor;
        if(remainder===0){remainder=divisor;}
        var result=LINGGUI_JIUGONG[remainder]||["?","?","?","?"];
        return{
            dayGan:dayGan,dayGanNum:dayGanNum,dayZhi:dayZhi,dayZhiNum:dayZhiNum,
            hourGan:hourGan,hourGanNum:hourGanNum,hourZhi:hourZhi,hourZhiNum:hourZhiNum,
            total:total,isYangDay:isYangDay,divisor:divisor,remainder:remainder,
            xue:result[1],bagua:result[0],jingmai:result[2],tongmai:result[3]
        };
    }

    function calcKeqiSixSteps(sitian){
        var sitianIdx=LIUQI_KEQI_ORDER.indexOf(sitian);
        if(sitianIdx<0){return[];}
        var startIdx=((sitianIdx-2)%6+6)%6;
        var steps=[];
        var i;
        for(i=0;i<6;i++){
            var qiIdx=(startIdx+i)%6;
            var qiName=LIUQI_KEQI_ORDER[qiIdx];
            var stepNum=i+1;
            var position="";
            if(stepNum===3){position="司天";}
            else if(stepNum===6){position="在泉";}
            else{position="间气("+stepNum+")";}
            steps.push({step:stepNum,keqi:qiName,position:position});
        }
        return steps;
    }

    function calcYunqiXianghe(yearGan,yearZhi,wuyunInfo,liuqiInfo){
        var yun=wuyunInfo["运"]||"";
        var yunWx=WUYUN_WUXING[yun]||"";
        var sitian=liuqiInfo["司天"]||"";
        var sitianWx=SITIAN_WUXING[sitian]||"";
        var nianzhiWx=NIANZHI_WUXING[yearZhi]||"";
        var isYangGan=YANG_GAN.hasOwnProperty(yearGan);
        var isTaiGuo=isYangGan;
        var isBuJi=!isYangGan;
        var isTianfu=(yunWx===sitianWx)&&yunWx!=="";
        var isSuihui=(yunWx===nianzhiWx)&&yunWx!=="";
        var isTaiyi=isTianfu&&isSuihui;
        var isPingqi=false;
        if(isTaiGuo&&sitianWx){if(WUXING_KE[sitianWx]===yunWx){isPingqi=true;}}
        if(isBuJi&&sitianWx){if(WUXING_SHENG[sitianWx]===yunWx){isPingqi=true;}}
        var category,desc;
        if(isTaiyi){category="太乙天符";desc="岁运五行=司天五行=年支五行，气化最强，易爆发流行病";}
        else if(isTianfu){category="天符";desc="岁运五行=司天五行，气化极强，气候剧烈波动";}
        else if(isSuihui){category="岁会";desc="岁运五行=年支五行，病势缓和持久";}
        else if(isPingqi){category="平气";desc="太过被克制/不及得资助，气化均衡，气候平稳";}
        else{category="运气异化";desc="运与气不同化，需具体分析";}
        return{
            yun:yun,yunWx:yunWx,sitianWx:sitianWx,nianzhiWx:nianzhiWx,
            tianfu:isTianfu,suihui:isSuihui,taiyi:isTaiyi,pingqi:isPingqi,
            category:category,desc:desc
        };
    }

    function calcKezhuJialin(keqiSteps){
        var results=[];
        var xiangdeCount=0;
        var buxiangdeCount=0;
        var i;
        for(i=0;i<keqiSteps.length;i++){
            var step=keqiSteps[i];
            var stepNum=step.step;
            var keqiName=step.keqi;
            var zhuqi=LIUQI_ZHUQI[i];
            var zhuqiName=zhuqi.name;
            var keWx=KEQI_WUXING[keqiName]||"";
            var zhuWx=ZHUQI_WUXING[zhuqiName]||"";
            var relation="",climate="",severity="";
            if(keWx===zhuWx){relation="同气";climate="平和";xiangdeCount++;}
            else if(WUXING_SHENG[keWx]===zhuWx){relation="客生主";climate="平和";xiangdeCount++;}
            else if(WUXING_SHENG[zhuWx]===keWx){relation="主生客";climate="平和";xiangdeCount++;}
            else if(WUXING_KE[keWx]===zhuWx){relation="客克主(客胜从)";climate="反常";severity="从证(较轻)";buxiangdeCount++;}
            else if(WUXING_KE[zhuWx]===keWx){relation="主克客(主胜逆)";climate="反常";severity="逆证(较重)";buxiangdeCount++;}
            else{relation="无直接关系";climate="一般";xiangdeCount++;}
            results.push({step:stepNum,zhuqi:zhuqiName,keqi:keqiName,zhuWx:zhuWx,keWx:keWx,relation:relation,climate:climate,severity:severity});
        }
        var overall="平和";
        if(xiangdeCount<4){overall=buxiangdeCount>=3?"偏反常":"一般";}
        var disease="气候平和，发病较少";
        if(overall==="偏反常"){disease="气候反常，疾病多发";}
        else if(overall==="一般"){disease="气候一般，注意调养";}
        return{steps:results,xiangdeCount:xiangdeCount,buxiangdeCount:buxiangdeCount,overall:overall,disease:disease};
    }

    // ============================================================
    // 主计算逻辑
    // ============================================================

    // 干支推算（优先使用options.ganzhi）
    var gz, yearGz, dayGz, dayGan, dayZhi, yearGan, yearZhi, monthGz, hourZhi, hourGan;
    if (options.ganzhi && options.ganzhi.yearGz) {
        yearGz = options.ganzhi.yearGz;
        yearGan = yearGz.charAt(0);
        yearZhi = yearGz.charAt(yearGz.length - 1);
        dayGz = options.ganzhi.dayGz || '';
        dayGan = options.ganzhi.dayGan || dayGz.charAt(0);
        dayZhi = options.ganzhi.dayZhi || dayGz.charAt(dayGz.length - 1);
        monthGz = options.ganzhi.monthGz || calcMonthGanZhi(year, month, day, yearGan);
        hourZhi = options.ganzhi.hourGz ? options.ganzhi.hourGz.charAt(options.ganzhi.hourGz.length - 1) : calcHourZhi(hour);
        hourGan = options.ganzhi.hourGan || calcHourGan(dayGan, hourZhi);
    } else {
        gz = solarToGanzhi(year, month, day);
        yearGz = gz.yearGz;
        dayGz = gz.dayGz;
        dayGan = gz.dayGan;
        dayZhi = gz.dayZhi;
        yearGan = gz.yearGan;
        yearZhi = gz.yearZhi;
        monthGz = calcMonthGanZhi(year, month, day, yearGan);
        hourZhi = calcHourZhi(hour);
        hourGan = calcHourGan(dayGan, hourZhi);
    }

    // 五运六气
    var wuyun = getWuyun(yearGan);
    var liuqi = getLiuqi(yearZhi);
    var ziwu = ZIWULIUZHU[hourZhi] || {};
    var najia = NAJIA[dayGan] || {};
    var nazi = NAZI[hourZhi] || "未知";
    var xiaoxi = XIAOXI_GUA[hourZhi] || {};

    // 优化计算
    var zhuqiPrecise = getZhuqiPrecise(month, day);
    var linggui = calcLingguiBafa(dayGan, dayZhi, hourGan, hourZhi);
    var sitian = liuqi["司天"] || "?";
    var keqiSteps = calcKeqiSixSteps(sitian);
    var yunqi = calcYunqiXianghe(yearGan, yearZhi, wuyun, liuqi);
    var kezhu = calcKezhuJialin(keqiSteps);

    // ============================================================
    // 构建维度数据
    // ============================================================

    var dimensions = {};

    // L1 基础排盘 (14维)
    dimensions["年干支"] = yearGz;
    dimensions["月干支"] = monthGz;
    dimensions["日干支"] = dayGz;
    dimensions["年干"] = yearGan;
    dimensions["年支"] = yearZhi;
    dimensions["日干"] = dayGan;
    dimensions["日支"] = dayZhi;
    dimensions["时干"] = hourGan;
    dimensions["时支"] = hourZhi;
    dimensions["五运"] = (wuyun["运"] || '?') + '(' + (wuyun["太过不及"] || '?') + ')';
    dimensions["司天"] = liuqi["司天"] || '?';
    dimensions["在泉"] = liuqi["在泉"] || '?';
    dimensions["当令经脉"] = ziwu["经脉"] || '?';
    dimensions["纳甲经"] = (najia["经脉"] || '?') + '(' + (najia["wuxing"] || '?') + ')';
    dimensions["纳子经"] = nazi;

    // L2 子午流注当令信息 (12维)
    dimensions["当令经脉_全称"] = ziwu["经脉"] || '?';
    dimensions["当令五行"] = ziwu.wuxing || '?';
    dimensions["当令流注"] = ziwu["流注"] || '?';
    dimensions["当令描述"] = ziwu["desc"] || '?';
    dimensions["当令养生"] = ziwu["养生"] || '?';
    dimensions["子午流注_全表"] = ZIWULIUZHU;

    // L3 灵龟八法 (8维)
    dimensions["灵龟_八脉交会穴表"] = LINGGUI_BAFA;
    dimensions["灵龟_开穴"] = linggui.xue;
    dimensions["灵龟_八卦"] = linggui.bagua;
    dimensions["灵龟_经脉"] = linggui.jingmai;
    dimensions["灵龟_通脉"] = linggui.tongmai;
    dimensions["灵龟_日干数"] = linggui.dayGanNum;
    dimensions["灵龟_总数"] = linggui.total;
    dimensions["灵龟_余数"] = linggui.remainder;
    dimensions["灵龟_日类"] = linggui.isYangDay ? '阳日(除9)' : '阴日(除6)';

    // L4 飞腾八法 (8维)
    dimensions["飞腾八法_表"] = FEITENG_BAFA;

    // L5 五运系统 (5维)
    dimensions["五运_运"] = wuyun["运"] || '?';
    dimensions["五运_太过不及"] = wuyun["太过不及"] || '?';
    dimensions["五运_对应脏腑"] = wuyun["对应"] || '?';
    dimensions["五运_特征"] = wuyun["特征"] || '?';
    dimensions["五运_全表"] = WUYUN;

    // L6 六气司天在泉 (6维)
    dimensions["六气_司天"] = liuqi["司天"] || '?';
    dimensions["六气_在泉"] = liuqi["在泉"] || '?';
    dimensions["六气_描述"] = liuqi["desc"] || '?';
    dimensions["六气_全表"] = LIUQI_SITIAN;

    // L7 六气主气 (6维)
    dimensions["当前主气"] = zhuqiPrecise.name;
    dimensions["当前主气_时间"] = zhuqiPrecise.time;
    dimensions["当前主气_五行"] = zhuqiPrecise.wuxing;
    dimensions["当前主气_描述"] = zhuqiPrecise.desc;
    dimensions["六气主气_全表"] = LIUQI_ZHUQI;

    // L8 纳甲法 (10维)
    dimensions["纳甲_本日经脉"] = najia["经脉"] || '?';
    dimensions["纳甲_本日五行"] = najia.wuxing || '?';
    dimensions["纳甲_本日穴位"] = najia["穴位"] || '?';
    dimensions["纳甲_全表"] = NAJIA;

    // L9 纳子法 (12维)
    dimensions["纳子_本时经脉"] = nazi;
    dimensions["纳子_全表"] = NAZI;

    // L10 十二消息卦 (12维)
    dimensions["消息卦"] = xiaoxi["卦"] || '?';
    dimensions["消息卦_描述"] = xiaoxi["desc"] || '?';
    dimensions["消息卦_阴阳比"] = xiaoxi["阴阳"] || '?';
    dimensions["十二消息卦_全表"] = XIAOXI_GUA;

    // L11 五行脏腑 (5维)
    dimensions["五行脏腑_全表"] = WUXING_ZANGFU;

    // L12 时辰养生建议 (12维)
    dimensions["时辰养生_全表"] = ZIWULIUZHU;

    // L13 六气客气推算 (6维) - OPT3
    dimensions["客气六步"] = keqiSteps;

    // L14 运气相合分析 - OPT4
    dimensions["运气相合_分类"] = yunqi.category;
    dimensions["运气相合_描述"] = yunqi.desc;
    dimensions["运气相合_岁运五行"] = yunqi.yunWx;
    dimensions["运气相合_司天五行"] = yunqi.sitianWx;
    dimensions["运气相合_年支五行"] = yunqi.nianzhiWx;
    dimensions["运气相合_天符"] = yunqi.tianfu;
    dimensions["运气相合_岁会"] = yunqi.suihui;
    dimensions["运气相合_太乙天符"] = yunqi.taiyi;
    dimensions["运气相合_平气"] = yunqi.pingqi;

    // L15 经络流注时序 (12维)
    var liuShi = [];
    for (var i = 0; i < 12; i++) {
        var dzA = DIZHI[i];
        var dzB = DIZHI[(i + 1) % 12];
        var infoA = ZIWULIUZHU[dzA] || {};
        var infoB = ZIWULIUZHU[dzB] || {};
        liuShi.push({
            from: dzA, to: dzB,
            fromJing: infoA["经脉"] || '?',
            toJing: infoB["经脉"] || '?',
            wuxingRelation: (infoA.wuxing || '?') + '→' + (infoB.wuxing || '?')
        });
    }
    dimensions["经络流注时序"] = liuShi;

    // L16 当令详细分析 (10维)
    dimensions["当令_时辰"] = hourZhi;
    dimensions["当令_经脉"] = ziwu["经脉"] || '?';
    dimensions["当令_五行"] = ziwu.wuxing || '?';
    dimensions["当令_描述"] = ziwu["desc"] || '?';
    dimensions["当令_养生"] = ziwu["养生"] || '?';
    dimensions["当令_纳甲经脉"] = najia["经脉"] || '?';
    dimensions["当令_纳甲五行"] = najia.wuxing || '?';
    dimensions["当令_纳子经脉"] = nazi;
    dimensions["当令_消息卦"] = (xiaoxi["卦"] || '?') + '(' + (xiaoxi["desc"] || '?') + ')';
    dimensions["当令_阴阳比"] = xiaoxi["阴阳"] || '?';

    // L17 盘面总评 (10维)
    dimensions["总评_年运"] = (wuyun["运"] || '?') + '-' + (wuyun["太过不及"] || '?');
    dimensions["总评_司天在泉"] = (liuqi["司天"] || '?') + '/' + (liuqi["在泉"] || '?');
    dimensions["总评_当令经脉"] = ziwu["经脉"] || '?';
    dimensions["总评_当令五行"] = ziwu.wuxing || '?';
    dimensions["总评_养生建议"] = ziwu["养生"] || '?';
    dimensions["总评_运气相合"] = yunqi.category;
    dimensions["总评_脏腑重点"] = wuyun["对应"] || '?';
    dimensions["总评_气候特征"] = wuyun["特征"] || '?';
    dimensions["总评_消息卦象"] = xiaoxi["卦"] || '?';
    dimensions["总评_综合建议"] = "调养" + (wuyun["对应"] || '?') + "，" + (ziwu["养生"] || '?');

    // OPT5 客主加临分析
    dimensions["客主加临"] = kezhu;

    return { dimensions: dimensions, name: "中医术数" };
};

// ============================================================
// 其他术数系统模块 (qita.js)
// 从 qita.html 提取的纯计算逻辑
// 接口: window.Systems.qita(year, month, day, hour, minute, options)
// ============================================================

window.Systems = window.Systems || {};
window.Systems.qita = function(year, month, day, hour, minute, options) {
    options = options || {};

    // ============================================================
    // Part 1: 基础数据表（从Python适配器v1.1-optimized移植）
    // ============================================================
    var DIZHI=["子","丑","寅","卯","辰","巳","午","未","申","酉","戌","亥"];
    var TIANGAN=["甲","乙","丙","丁","戊","己","庚","辛","壬","癸"];

    var XIAOLIUREN=[
    {name:"大安",dizhi:"寅",wuxing:"木",jixiong:"吉",desc:"事事安稳",xiang:"青龙",yi:"求财/谋事/出行"},
    {name:"留连",dizhi:"卯",wuxing:"水",jixiong:"凶",desc:"事多拖延",xiang:"玄武",yi:"不宜急事"},
    {name:"速喜",dizhi:"辰",wuxing:"火",jixiong:"吉",desc:"喜事速至",xiang:"朱雀",yi:"求财/谋事/求名"},
    {name:"赤口",dizhi:"巳",wuxing:"金",jixiong:"凶",desc:"口舌是非",xiang:"白虎",yi:"防口舌/防官非"},
    {name:"小吉",dizhi:"午",wuxing:"水",jixiong:"吉",desc:"小有吉利",xiang:"六合",yi:"求财/谋事/婚恋"},
    {name:"空亡",dizhi:"未",wuxing:"土",jixiong:"大凶",desc:"万事落空",xiang:"勾陈",yi:"万事不宜"}
    ];

    var JIUGONG_FEIXING={
    1:{name:"一白",gua:"坎",wuxing:"水",fangwei:"正北",desc:"桃花文昌",jixiong:"吉",zhuguan:"事业/人缘"},
    2:{name:"二黑",gua:"坤",wuxing:"土",fangwei:"西南",desc:"病符星",jixiong:"凶",zhuguan:"疾病/健康"},
    3:{name:"三碧",gua:"震",wuxing:"木",fangwei:"正东",desc:"禄存星",jixiong:"凶",zhuguan:"口舌/是非"},

    // ============================================================

    function solarToGanzhi(year,month,day){
        var baseDate=new Date(2024,0,1);
        var targetDate=new Date(year,month-1,day);
        var daysDiff=Math.round((targetDate-baseDate)/(1000*60*60*24));
        var dayIdx=((daysDiff%60)+60)%60;
        var dayGan=TIANGAN[dayIdx%10];
        var dayZhi=DIZHI[dayIdx%12];
        var yearZhi=DIZHI[((4+(year-2024))%12+12)%12];
        var yearGan=TIANGAN[((0+(year-2024))%10+10)%10];
        return{yearGz:yearGan+yearZhi,dayGz:dayGan+dayZhi};
    }

    function getXiaoliuren(month,day,hourZhiIdx){
        var monthPos=(month-1)%6;
        var dayPos=((monthPos+day-1)%6+6)%6;
        var hourPos=((dayPos+hourZhiIdx)%6+6)%6;
        return{month:XIAOLIUREN[monthPos],day:XIAOLIUREN[dayPos],hour:XIAOLIUREN[hourPos]};
    }

    function getCurrentYun(year){
        for(var i=0;i<SANYUAN_JIUYUN.length;i++){
            var yun=SANYUAN_JIUYUN[i];
            if(yun.start<=year&&yun.end>=year){return yun;}
        }
        return SANYUAN_JIUYUN[SANYUAN_JIUYUN.length-1];
    }

    function getAnnualStar(year){
        var yun=getCurrentYun(year);
        var yunStar=yun.star;
        var yearsIntoYun=year-yun.start;
        var centerStar=((yunStar-yearsIntoYun)%9+9)%9;
        if(centerStar===0){centerStar=9;}
        return centerStar;
    }

    // OPT1: 计算年度风水关键方位
    function calcFengshuiPositions(annualStar){
        var positions={};
        for(var i=0;i<FEIXING_POSITIONS.length;i++){
            var pos=FEIXING_POSITIONS[i];
            var star=((annualStar-1+i)%9+9)%9+1;
            if(star===5){positions["五黄方位"]=pos+"("+JIUGONG_FEIXING[5].name+"大煞)";}
            else if(star===2){positions["二黑方位"]=pos+"("+JIUGONG_FEIXING[2].name+"病符)";}
            else if(star===8){positions["财星方位"]=pos+"("+JIUGONG_FEIXING[8].name+"财运)";}
            else if(star===9){positions["喜星方位"]=pos+"("+JIUGONG_FEIXING[9].name+"喜庆)";}
            else if(star===4){positions["文昌方位"]=pos+"("+JIUGONG_FEIXING[4].name+"学业)";}
        }
        return positions;
    }

    // OPT4: 小六壬三宫五行生克分析
    function calcXiaoliurenShengke(xlrMonth,xlrDay,xlrHour){
        var wxM=xlrMonth.wuxing;
        var wxD=xlrDay.wuxing;
        var wxH=xlrHour.wuxing;
        function relation(a,b){
            if(a===b){return"比和";}
            if(WUXING_SHENG[a]===b){return"生(→)";}
            if(WUXING_SHENG[b]===a){return"被生(←)";}
            if(WUXING_KE[a]===b){return"克(→)";}
            if(WUXING_KE[b]===a){return"被克(←)";}
            return"无关系";
        }
        var relMd=relation(wxM,wxD);
        var relDh=relation(wxD,wxH);
        var shengCount=0,keCount=0;
        if(relMd.indexOf("生")>=0){shengCount++;}
        if(relMd.indexOf("克")>=0){keCount++;}
        if(relDh.indexOf("生")>=0){shengCount++;}
        if(relDh.indexOf("克")>=0){keCount++;}
        var trend;
        if(shengCount>=2){trend="顺畅(相生链强)";}
        else if(keCount>=2){trend="阻碍(相克链强)";}
        else if(shengCount>=1&&keCount>=1){trend="波折(生克并存)";}
        else{trend="平稳(关系中性)";}
        return{
            "月→日五行":wxM+"→"+wxD+"("+relMd+")",
            "日→时五行":wxD+"→"+wxH+"("+relDh+")",
            "三宫五行链":wxM+"→"+wxD+"→"+wxH,
            "生克趋势":trend,
            "生链数":shengCount,
            "克链数":keCount
        };
    }

    // OPT5: 太岁冲合刑害分析
    function calcTaisuiRelation(yearZhi,dayZhi){
        var relations=[];
        if(LIU_CHONG[yearZhi]===dayZhi){relations.push("冲(日支"+dayZhi+"冲太岁"+yearZhi+")");}
        if(LIU_HE[yearZhi]===dayZhi){relations.push("合(日支"+dayZhi+"合太岁"+yearZhi+")");}
        var xingList=XIANG_XING[yearZhi]||[];
        for(var i=0;i<xingList.length;i++){
            if(xingList[i]===dayZhi){relations.push("刑(日支"+dayZhi+"刑太岁"+yearZhi+")");break;}
        }
        if(XIANG_HAI[yearZhi]===dayZhi){relations.push("害(日支"+dayZhi+"害太岁"+yearZhi+")");}
        if(relations.length===0){relations.push("无特殊关系");}
        var hasChong=false,hasXing=false,hasHai=false,hasHe=false;
        for(var j=0;j<relations.length;j++){
            if(relations[j].indexOf("冲")>=0){hasChong=true;}
            if(relations[j].indexOf("刑")>=0){hasXing=true;}
            if(relations[j].indexOf("害")>=0){hasHai=true;}
            if(relations[j].indexOf("合")>=0){hasHe=true;}
        }
        var advice;
        if(hasChong){advice="日冲太岁，行事需谨慎";}
        else if(hasXing){advice="日刑太岁，注意纠纷";}
        else if(hasHai){advice="日害太岁，注意小人口舌";}
        else if(hasHe){advice="日合太岁，诸事顺遂";}
        else{advice="与太岁无冲合刑害，平稳";}
        return{"关系类型":relations.join("、"),"综合建议":advice};
    }

            else if(star===8){marks.push("💰财星@"+pos);}
            else if(star===9){marks.push("🎉喜星@"+pos);}
            else if(star===4){marks.push("📚文昌@"+pos);}
        }
        return marks.join(" · ");

    var TUAN_ZHUAN={"乾为天":"大哉乾元，万物资始，乃统天","坤为地":"至哉坤元，万物资生，乃顺承天","水雷屯":"屯，刚柔始交而难生，动乎险中，大亨贞","山水蒙":"蒙，山下有险，险而止，蒙。蒙亨，以亨行时中也","水天需":"需，须也。险在前也。刚健而不陷，其义不困穷矣","天水讼":"讼，上刚下险，险而健，讼","地水师":"师，众也。贞，正也。能以众正，可以王矣","水地比":"比，吉也。比，辅也，下顺从也","风天小畜":"小畜，柔得位而上下应之，曰小畜","天泽履":"履，柔履刚也。说而应乎乾，是以履虎尾，不咥人，亨","地天泰":"泰，小往大来，吉亨。则是天地交而万物通也","天地否":"否之匪人，不利君子贞，大往小来","天火同人":"同人，柔得位得中而应乎乾，曰同人","火天大有":"大有，柔得尊位大中，而上下应之","地山谦":"谦亨，天道下济而光明，地道卑而上行","雷地豫":"豫，刚应而志行，顺以动，豫","泽雷随":"随，刚来而下柔，动而说，随","山风蛊":"蛊，刚上而柔下，巽而止，蛊","地泽临":"临，刚浸而长","风地观":"观，盥而不荐，有孚颙若，下观而化也","火雷噬嗑":"颐中有物曰噬嗑。噬嗑而亨","山火贲":"贲亨，柔来而文刚，故亨","山地剥":"剥，剥也，柔变刚也","地雷复":"复亨，刚反，动而以顺行","天雷无妄":"无妄，刚自外来而为主于内，动而健","山天大畜":"大畜，刚健笃实辉光，日新其德","山雷颐":"颐，贞吉，养正则吉也","泽风大过":"大过，大者过也","坎为水":"习坎，重险也。水流而不盈，行险而不失其信","离为火":"离，丽也。日月丽乎天，百谷草木丽乎土","泽山咸":"咸，感也。柔上而刚下，二气感应以相与","雷风恒":"恒，久也。刚上而柔下，雷风相与","天山遁":"遁亨，遁而亨也","雷天大壮":"大壮，大者壮也。刚以动，故壮","火地晋":"晋，进也。明出地上","地火明夷":"明入地中，明夷","风火家人":"家人，女正位乎内，男正位乎外","火泽睽":"睽，火动而上，泽动而下","水山蹇":"蹇，难也，险在前也","雷水解":"解，险以动，动而免乎险，解","山泽损":"损，损下益上，其道上行","风雷益":"益，损上益下，民说无疆","泽天夬":"夬，决也，刚决柔也","天风姤":"姤，遇也，柔遇刚也","泽地萃":"萃，聚也。顺以说，刚中而应","地风升":"柔以时升，巽而顺，刚中而应","泽水困":"困，刚揜也。险以说，困而不失其所亨","水风井":"巽乎水而上水，井。井养而不穷也","泽火革":"革，水火相息","火风鼎":"鼎，象也。以木巽火，亨饪也","震为雷":"震亨。震来虩虩，恐致福也","艮为山":"艮，止也。时止则止，时行则行","风山渐":"渐，之进也，女归吉也","雷泽归妹":"归妹，天地之大义也","雷火丰":"丰，大也。明以动，故丰","火山旅":"旅，小亨。柔得中乎外而顺乎刚","巽为风":"重巽以申命，刚巽乎中正而志行","兑为泽":"兑，说也。刚中而柔外","风水涣":"涣亨，刚来而不穷，柔得位乎外而上同","水泽节":"节亨，刚柔分而刚得中","风泽中孚":"中孚，柔在内而刚得中","雷山小过":"小过，小者过而亨也","水火既济":"既济亨，小者亨也","火水未济":"未济亨，柔得中也"};

    var XIAO_XIANG_FULL={"乾为天":"初九潜藏勿用，九二见龙在田，九三终日乾乾，九四或跃在渊，九五飞龙在天，上九亢龙有悔","坤为地":"初六履霜坚冰，六二直方大不习无不利，六三含章可贞，六四括囊无咎，六五黄裳元吉，上六龙战于野","水雷屯":"初九磐桓居贞，六二屯如邅如，六三即鹿无虞，六四乘马班如，九五屯其膏，上六泣血涟如","山水蒙":"初六发蒙利用刑人，九二包蒙吉，六三勿用取女，六四困蒙吝，六五童蒙吉，上九击蒙不利为寇","水天需":"初九需于郊不犯难，九二需于沙小有言，九三需于泥致寇至，六四需于血出自穴，九五需于酒食贞吉，上六入于穴不速之客来","天水讼":"初六不永所事，九二不克讼归逋，六三食旧德，九四不克讼复即命，九五讼元吉，上九或锡之鞶带终朝三褫","地水师":"初六师出以律否臧凶，九二在师中吉，六三师或舆尸凶，六四师左次无咎，六五田有禽利执言，上六大君有命开国承家","水地比":"初六有孚比之无咎，六二比之自内贞吉，六三比之匪人不亦伤乎，六四外比之贞吉，九五显比王用三驱，上六比之无首凶","风天小畜":"初九复自道何其咎，九二牵复吉，九三舆说辐夫妻反目，六四有孚血去惕出，九五有孚挛如富以其邻，上九既雨既处尚德载","天泽履":"初九素履往无咎，九二履道坦坦幽人贞吉，六三眇能视跛能履履虎尾咥人凶，九四履虎尾愬愬终吉，九五夬履贞厉，上九视履考祥其旋元吉","地天泰":"初九拔茅茹以其汇征吉，九二包荒用冯河不遐遗，九三无平不陂无往不复，六四翩翩不富以其邻，六五帝乙归妹以祉元吉，上六城复于隍勿用师","天地否":"初六拔茅茹以其汇贞吉，六二包承小人吉大人否，六三包羞，九四有命无咎畴离祉，九五休否大人吉其亡其亡，上九倾否先否后喜","天火同人":"初九同人于门无咎，六二同人于宗吝，九三伏戎于莽升其高陵，九四乘其墉弗克攻吉，九五同人先号咷而后笑大师克相遇，上九同人于郊无悔","火天大有":"初九无交害匪咎艰则无咎，九二大车以载有攸往无咎，九三公用亨于天子小人弗克，九四匪其彭无咎，六五厥孚交如威如吉，上九自天佑之吉无不利","地山谦":"初六谦谦君子用涉大川吉，六二鸣谦贞吉，九三劳谦君子有终吉，六四无不利撝谦，六五不富以其邻利用侵伐，上六鸣谦利用行师征邑国","雷地豫":"初六鸣豫凶，六二介于石不终日贞吉，六三盱豫悔迟有悔，九四由豫大有得勿疑朋盍簪，六五贞疾恒不死，上六冥豫成有渝无咎","泽雷随":"初九官有渝贞吉出门交有功，六二系小子失丈夫，六三系丈夫失小子随有求得，九四随有获贞凶有孚在道明，九五孚于嘉吉，上六拘系之乃从维之","山风蛊":"初六干父之蛊有子考无咎，九二干母之蛊不可贞，九三干父之蛊小有悔无大咎，六四裕父之蛊往见吝，六五干父之蛊用誉，上九不事王侯高尚其事","地泽临":"初九咸临贞吉，九二咸临吉无不利，六三甘临无攸利既忧之无咎，六四至临无咎，六五知临大君之宜吉，上六敦临吉无咎","风地观":"初六童观小人无咎君子吝，六二窥观利女贞，六三观我生进退，六四观国之光利用宾于王，九五观我生君子无咎，上九观其生君子无咎","火雷噬嗑":"初九屦校灭趾无咎，六二噬肤灭鼻无咎，六三噬腊肉遇毒小吝无咎，九四噬干胏得金矢利艰贞吉，六五噬干肉得黄金贞厉无咎，上九何校灭耳凶","山火贲":"初九贲其趾舍车而徒，六二贲其须，九三贲如濡如永贞吉，六四贲如皤如白马翰如匪寇婚媾，六五贲于丘园束帛戋戋吝终吉，上九白贲无咎","山地剥":"初六剥床以足蔑贞凶，六二剥床以辨蔑贞凶，六三剥之无咎，六四剥床以肤凶，六五贯鱼以宫人宠无不利，上九硕果不食君子得舆小人剥庐","地雷复":"初九不远复无祗悔元吉，六二休复吉，六三频复厉无咎，六四中行独复，六五敦复无悔，上六迷复凶有灾眚","天雷无妄":"初九无妄往吉，六二不耕获不菑畲则利有攸往，六三无妄之灾或系之牛行人之得邑人之灾，九四可贞无咎，九五无妄之疾勿药有喜，上九无妄行有眚无攸利","山天大畜":"初九有厉利已，九二舆说輹，九三良马逐利艰贞日闲舆卫利有攸往，六四童牛之牿元吉，六五豮豕之牙吉，上九何天之衢亨","山雷颐":"初九舍尔灵龟观我朵颐凶，六二颠颐拂经于丘颐征凶，六三拂颐贞凶十年勿用无攸利，六四颠颐吉虎视眈眈其欲逐逐无咎，六五拂经居贞吉不可涉大川，上九由颐厉吉利涉大川","泽风大过":"初六藉用白茅无咎，九二枯杨生稊老夫得其女妻无不利，九三栋桡凶，九四栋隆吉有它吝，九五枯杨生华老妇得其士夫无咎无誉，上六过涉灭顶凶无咎","坎为水":"初六习坎入于坎窞凶，九二坎有险求小得，六三来之坎坎险且枕入于坎窞勿用，六四樽酒簋贰用缶纳约自牖终无咎，九五坎不盈祗既平无咎，上六系用徽纆置于丛棘三岁不得凶","离为火":"初九履错然敬之无咎，六二黄离元吉，九三日昃之离不鼓缶而歌则大耋之嗟凶，九四突如其来如焚如死如弃如，六五出涕沱若戚嗟若吉，上九王用出征有嘉折首获匪其丑无咎","泽山咸":"初六咸其拇，六二咸其腓凶居吉，九三咸其股执其随往吝，九四贞吉悔亡憧憧往来朋从尔思，九五咸其脢无悔，上六咸其辅颊舌","雷风恒":"初六浚恒贞凶无攸利，九二悔亡，九三不恒其德或承之羞贞吝，九四田无禽，六五恒其德贞妇人吉夫子凶，上六振恒凶","天山遁":"初六遁尾厉勿用有攸往，六二执之用黄牛之革莫之胜说，九三系遁有疾厉畜臣妾吉，九四好遁君子吉小人否，九五嘉遁贞吉，上九肥遁无不利","雷天大壮":"初九壮于趾征凶有孚，九二贞吉，九三小人用壮君子用罔贞厉羝羊触藩羸其角，九四贞吉悔亡藩决不羸壮于大舆之輹，六五丧羊于易无悔，上六羝羊触藩不能退不能遂无攸利艰则吉","火地晋":"初六晋如摧如贞吉罔孚裕无咎，六二晋如愁如贞吉受兹介福于其王母，六三众允悔亡，九四晋如鼫鼠贞厉，六五悔亡失得勿恤往吉无不利，上九晋其角维用伐邑厉吉无咎贞吝","地火明夷":"初九明夷于飞垂其翼君子于行三日不食有攸往主人有言，六二明夷夷于左股用拯马壮吉，九三明夷于南狩得其大首不可疾贞，六四入于左腹获明夷之心于出门庭，六五箕子之明夷利贞，上六不明晦初登于天后入于地","风火家人":"初九闲有家悔亡，六二无攸遂在中馈贞吉，九三家人嗃嗃悔厉吉妇子嘻嘻终吝，六四富家大吉，九五王假有家勿恤吉，上九有孚威如终吉","火泽睽":"初九悔亡丧马勿逐自复见恶人无咎，九二遇主于巷无咎，六三见舆曳其牛掣其人天且劓无初有终，九四睽孤遇元夫交孚厉无咎，六五悔亡厥宗噬肤往何咎，上九睽孤见豕负涂载鬼一车先张之弧后说之弧匪寇婚媾往遇雨则吉","水山蹇":"初六往蹇来誉，六二王臣蹇蹇匪躬之故，九三往蹇来反，六四往蹇来连，九五大蹇朋来，上六往蹇来硕吉利见大人","雷水解":"初六无咎，九二田获三狐得黄矢贞吉，六三负且乘致寇至贞吝，九四解而拇朋至斯孚，六五君子维有解吉有孚于小人，上六公用射隼于高墉之上获之无不利","山泽损":"初九已事遄往无咎酌损之，九二利贞征凶勿用损益之，六三三人行则损一人一人行则得其友，六四损其疾使遄有喜无咎，六五或益之十朋之龟弗克违元吉，上九弗损益之无咎贞吉利有攸往得臣无家","风雷益":"初九利用为大作元吉无咎，六二或益之十朋之龟弗克违永贞吉王用享于帝吉，六三益之用凶事无咎有孚中行告公用圭，六四中行告公从利用为依迁国，九五有孚惠心勿问元吉有孚惠我德，上九莫益之或击之立心勿恒凶","泽天夬":"初九壮于前趾往不胜为咎，九二惕号莫夜有戎勿恤，九三壮于頄有凶君子夬夬独行遇雨若濡有愠无咎，九四臀无肤其行次且牵羊悔亡闻言不信，九五苋陆夬夬中行无咎，上六无号终有凶","天风姤":"初六系于金柅贞吉有攸往见凶羸豕孚蹢躅，九二包有鱼无咎不利宾，九三臀无肤其行次且厉无大咎，九四包无鱼起凶，九五以杞包瓜含章有陨自天，上九姤其角吝无咎","泽地萃":"初六有孚不终乃乱乃萃若号一握为笑勿恤往无咎，六二引吉无咎孚乃利用禴，六三萃如嗟如无攸利往无咎小吝，九四大吉无咎，九五萃有位无咎匪孚元永贞悔亡，上六赍咨涕洟无咎","地风升":"初六允升大吉，九二孚乃利用禴无咎，九三升虚邑，六四王用亨于岐山吉无咎，六五贞吉升阶，上六冥升利于不息之贞","泽水困":"初六臀困于株木入于幽谷三岁不觌，九二困于酒食朱绂方来利用享祀征凶无咎，六三困于石据于蒺藜入于其宫不见其妻凶，九四来徐徐困于金车吝有终，九五劓刖困于赤绂乃徐有说利用祭祀，上六困于葛藟于臲卼曰动悔有悔征吉","水风井":"初六井泥不食旧井无禽，九二井谷射鲋瓮敝漏，九三井渫不食为我心恻可用汲王明并受其福，六四井甃无咎，九五井冽寒泉食，上六井收勿幕有孚元吉","泽火革":"初九巩用黄牛之革，六二己日乃革之征吉无咎，九三征凶贞厉革言三就有孚，九四悔亡有孚改命吉，九五大人虎变未占有孚，上六君子豹变小人革面征凶居贞吉","火风鼎":"初六鼎颠趾利出否得妾以其子无咎，九二鼎有实我仇有疾不我能即吉，九三鼎耳革其行塞雉膏不食方雨亏悔终吉，九四鼎折足覆公餗其形渥凶，六五鼎黄耳金铉利贞，上九鼎玉铉大吉无不利","震为雷":"初九震来虩虩后笑言哑哑吉，六二震来厉亿丧贝跻于九陵勿逐七日得，六三震苏苏震行无眚，九四震遂泥，六五震往来厉亿无丧有事，上六震索索视矍矍征凶震不于其躬于其邻无咎婚媾有言","艮为山":"初六艮其趾无咎利永贞，六二艮其腓不拯其随其心不快，九三艮其限列其夤厉熏心，六四艮其身无咎，六五艮其辅言有序悔亡，上九敦艮吉","风山渐":"初六鸿渐于干小子厉有言无咎，六二鸿渐于磐饮食衎衎吉，九三鸿渐于陆夫征不复妇孕不育凶利用御寇，六四鸿渐于木或得其桷无咎，九五鸿渐于陵妇三岁不孕终莫之胜吉，上九鸿渐于陆其羽可用为仪吉","雷泽归妹":"初九归妹以娣跛能履征吉，九二眇能视利幽人之贞，六三归妹以须反归以娣，九四归妹愆期迟归有时，六五帝乙归妹其君之袂不如其娣之袂良月几望吉，上六女承筐无实士刲羊无血无攸利","雷火丰":"初九遇其配主虽旬无咎往有尚，六二丰其蔀日中见斗往得疑疾有孚发若吉，九三丰其沛日中见沫折其右肱无咎，九四丰其蔀日中见斗遇其夷主吉，六五来章有庆誉吉，上六丰其屋蔀其家窥其户阒其无人三岁不觌凶","火山旅":"初六旅琐琐斯其所取灾，六二旅即次怀其资得童仆贞，九三旅焚其次丧其童仆贞厉，九四旅于处得其资斧我心不快，六五射雉一矢亡终以誉命，上九鸟焚其巢旅人先笑后号咷丧牛于易凶","巽为风":"初六进退利武人之贞，九二巽在床下用史巫纷若吉无咎，九三频巽吝，六四悔亡田获三品，九五贞吉悔亡无不利无初有终先庚三日後庚三日吉，上九巽在床下丧其资斧贞凶","兑为泽":"初九和兑吉，九二孚兑吉悔亡，六三来兑凶，九四商兑未宁介疾有喜，九五孚于剥有厉，上六引兑","风水涣":"初六用拯马壮吉，九二涣奔其机悔亡，六三涣其躬无悔，六四涣其群元吉涣有丘匪夷所思，九五涣汗其大号涣王居无咎，上九涣其血去逖出无咎","水泽节":"初九不出户庭无咎，九二不出门庭凶，六三不节若则嗟若无咎，六四安节亨，九五甘节吉往有尚，上六苦节贞凶悔亡","风泽中孚":"初九虞吉有它不燕，九二鸣鹤在阴其子和之我有好爵吾与尔靡之，六三得敌或鼓或罢或泣或歌，六四月几望马匹亡无咎，九五有孚挛如无咎，上九翰音登于天贞凶","雷山小过":"初六飞鸟以凶，六二过其祖遇其妣不及其君遇其臣无咎，九三弗过防之从或戕之凶，九四无咎弗过遇之往厉必戒勿用永贞，六五密云不雨自我西郊公弋取彼在穴，上六弗遇过之飞鸟离之凶是谓灾眚","水火既济":"初九曳其轮濡其尾无咎，六二妇丧其茀勿逐七日得，九三高宗伐鬼方三年克之小人勿用，六四繻有衣袽终日戒，九五东邻杀牛不如西邻之禴祭实受其福，上六濡其首厉","火水未济":"初六濡其尾吝，九二曳其轮贞吉，六三未济征凶利涉大川，九四贞吉悔亡震用伐鬼方三年有赏于大国，六五贞吉无悔君子之光有孚吉，上九有孚于饮酒无咎濡其首有孚失是"};

    function flipBit(b){return b==='0'?'1':'0';}

    function binaryToTrigrams(binary){
        var lower=binary.substring(0,3);
        var upper=binary.substring(3,6);
        return{lower:BINARY_TO_TRIGRAM[lower]||'?',upper:BINARY_TO_TRIGRAM[upper]||'?'};
    }

    function getHexagramByBinary(binary){
        for(var palace in PALACES){
            var pure=PALACES[palace]["pure_binary"];
            for(var pos=1;pos<=8;pos++){
                var changed=pure.split('');
                var changes=PALACE_CHANGES[pos];
                for(var c=0;c<changes.length;c++){changed[changes[c]]=flipBit(changed[changes[c]]);}
                if(changed.join('')===binary){
                    return{name:PALACES[palace]["names"][pos-1],palace:palace,palacePos:pos,palaceElem:PALACES[palace]["element"]};
                }
            }
        }
        return{name:null,palace:null,palacePos:null,palaceElem:null};
    }

    function cuoHexagram(binary){var r='';for(var i=0;i<binary.length;i++){r+=flipBit(binary[i]);}return r;}
    function zongHexagram(binary){return binary.split('').reverse().join('');}
    function huHexagram(binary){return binary[1]+binary[2]+binary[3]+binary[2]+binary[3]+binary[4];}
    function bianHexagram(binary,movingLine){var lst=binary.split('');lst[movingLine-1]=flipBit(lst[movingLine-1]);return lst.join('');}
    function fuHexagram(binary,palace){var pure=PALACES[palace]["pure_binary"];return cuoHexagram(pure);}
    function lianHu(binary){var hu=huHexagram(binary);return huHexagram(hu);}

    function getLiuQin(zhiElem,palaceElem){
        if(zhiElem===palaceElem)return'兄弟';
        if(WUXING_SHENG[palaceElem]===zhiElem)return'子孙';
        if(WUXING_SHENG[zhiElem]===palaceElem)return'父母';
        if(WUXING_KE[palaceElem]===zhiElem)return'妻财';
        if(WUXING_KE[zhiElem]===palaceElem)return'官鬼';
        return'未知';
    }

    function getNaJiaForHexagram(binary,palace){
        var tr=binaryToTrigrams(binary);
        var palaceElem=PALACES[palace]["element"];
        var naJiaLower=NA_JIA[tr.lower]["internal"];
        var naJiaUpper=NA_JIA[tr.upper]["external"];
        var all=naJiaLower.concat(naJiaUpper);
        var result=[];
        for(var i=0;i<all.length;i++){
            var gan=all[i][0],zhi=all[i][1];
            var elem=ZHI_WUXING[zhi];
            var liuQin=getLiuQin(elem,palaceElem);
            result.push({gan:gan,zhi:zhi,element:elem,liuQin:liuQin,ganElement:GAN_WUXING[gan]});
        }
        return result;
    }

    function getShiYing(palacePos){var r=SHI_YING[palacePos];return r?{shi:r[0],ying:r[1]}:{shi:null,ying:null};}

    function getZhengXuanForLine(linePos,isYang){
        var idx=linePos-1;
        var zhi=isYang?ZHENG_XUAN_YANG_ZHI[idx]:ZHENG_XUAN_YIN_ZHI[idx];
        var lv=LV_LU[zhi];
        return{zhi:zhi,lvLu:lv};
    }

    function getWuxingRelation(elem1,elem2){
        if(elem1===elem2)return'比和';
        if(WUXING_SHENG[elem1]===elem2)return'相生';
        if(WUXING_SHENG[elem2]===elem1)return'被生';
        if(WUXING_KE[elem1]===elem2)return'相克';
        if(WUXING_KE[elem2]===elem1)return'被克';
        return'无关';
    }

    function getTiYong(binary){
        var tr=binaryToTrigrams(binary);
        var tiElem=TRIGRAMS[tr.lower]["element"];

            var diffs=[];

        var judgments={"相生":"大吉·用生体·有助益","比和":"大吉·比和·同类相辅","被克":"凶中有吉·体克用·费力可成","被生":"耗损·体生用·付出多","相克":"凶·用克体·外力压制","无关":"平·无生克"};
        return judgments[relation]||'平·无生克';

    function getBianXiang(bianBinary){
        if(!bianBinary)return'无变卦';
        var tr=binaryToTrigrams(bianBinary);
        return TRIGRAMS[tr.upper]["nature"]+'在'+TRIGRAMS[tr.lower]["nature"]+'上';
    }

    function getLiuQinWangShuaiSummary(binary,palace,monthZhi){
        var naJia=getNaJiaForHexagram(binary,palace);
        var palaceElem=PALACES[palace]["element"];
        var season=monthZhi?(MONTH_TO_SEASON[monthZhi]||'四季'):'四季';
        var liuqinStatus={};
        for(var i=0;i<naJia.length;i++){
            var lq=naJia[i]["liuQin"];
            var elem=naJia[i]["element"];
            var ws=(WANG_SHUAI[season]||{})[elem]||'未知';
            if(!liuqinStatus[lq])liuqinStatus[lq]=[];
            liuqinStatus[lq].push({zhi:naJia[i]["zhi"],element:elem,wangShuai:ws});
        }
        var parts=[];
        for(var lq in liuqinStatus){
            var statuses=liuqinStatus[lq].map(function(e){return e["wangShuai"];});
            var summary='待月令';
            if(statuses.indexOf('旺')>=0)summary='旺相';
            else if(statuses.indexOf('相')>=0)summary='得令';
            else if(statuses.indexOf('休')>=0)summary='休囚';
            else if(statuses.indexOf('囚')>=0)summary='失令';
            else if(statuses.indexOf('死')>=0)summary='死绝';
            parts.push(lq+summary);
        }
        var palacePos=getPalacePos(binary,palace);
        var sy=getShiYing(palacePos);
        var yongshenJudge='待月令';
        if(sy.shi&&sy.shi<=naJia.length){
            var shiLq=naJia[sy.shi-1]["liuQin"];
            var shiElem=naJia[sy.shi-1]["element"];
            var shiWs=(WANG_SHUAI[season]||{})[shiElem]||'未知';
            yongshenJudge='用神('+shiLq+')'+shiWs;
            if(shiWs==='旺'||shiWs==='相')yongshenJudge+='·有力';
            else if(shiWs==='休')yongshenJudge+='·尚可';
            else if(shiWs==='囚'||shiWs==='死')yongshenJudge+='·无力';
            else yongshenJudge+='·待月令';
        }
        return{liuqinWangShuai:parts.join('、'),yongshenYouli:yongshenJudge};

        var hourZhi=hourZhiMap[hour]||'子';
        var zhiToNum={"子":1,"丑":2,"寅":3,"卯":4,"辰":5,"巳":6,"午":7,"未":8,"申":9,"酉":10,"戌":11,"亥":12};
        var hourNum=zhiToNum[hourZhi];

        var upperNum=(yearNum+lMonth+lDay)%8;
        var lowerNum=(yearNum+lMonth+lDay+hourNum)%8;
        var moving=(yearNum+lMonth+lDay+hourNum)%6;
        if(moving===0)moving=6;
        var numToTrigram={1:'乾',2:'兑',3:'离',4:'震',5:'巽',6:'坎',7:'艮',0:'坤',8:'坤'};
        var upperTri=numToTrigram[upperNum];
        var lowerTri=numToTrigram[lowerNum];
        var binary=TRIGRAMS[lowerTri]["binary"]+TRIGRAMS[upperTri]["binary"];
        return{upperTrigram:upperTri,lowerTrigram:lowerTri,movingLine:moving,binary:binary,lunarYear:lYear,lunarMonth:lMonth,lunarDay:lDay,hourZhi:hourZhi,hourNum:hourNum,upperNum:upperNum,lowerNum:lowerNum};
    }

    // 梅花易数起卦

    var cuoInfo = getHexagramByBinary(cuoBin);
    var zongBin = zongHexagram(binary);
    var zongInfo = getHexagramByBinary(zongBin);
    var fuBin = fuHexagram(binary, palace);

    // 纳甲

    var yaoAna = getYaoPositionAnalysis(binary, movingLine);

    // 爻位关系
    var lineRels = getLineRelations(binary);

    // 占法专用
    var divSpec = getDivinationSpecific(binary, palace, movingLine);

    var zhengXuan = getZhengXuanAll(binary);

    // 卦象细分
    var gxFine = getGuaXiangFine(binary);

    var wxFamily = getWuxingFamily(binary);

    // 三才
    var sanCai = getSanCai(binary);

    // 六神
    var sixSpirits = getSixSpiritsForDay(dayGan);

    // OPT5
    var lqWs = getLiuQinWangShuaiSummary(binary, palace, monthZhi);

    // OPT4: 变象
    var bianXiangStr = getBianXiang(bianBin);

    // ============================================================
    // 构建维度数据
    // ============================================================

    var dimensions = {};

    // L1 结构层 (8维)

    dimensions["世爻六亲_关系"] = njRel.shiLiuQin;
    dimensions["世爻空亡"] = kongWangZhi.length > 0 && sy.shi ? (kongWangZhi.indexOf(naJia[sy.shi - 1].zhi) >= 0 ? '空亡' : '不空') : '待日干支';

    dimensions["下卦"] = qg.lowerTrigram;
    dimensions["动爻"] = '第' + movingLine + '爻';
    dimensions["宫五行"] = palaceElem;
    dimensions["日干支"] = dayGanZhi;
    dimensions["月支"] = monthZhi;
    dimensions["空亡"] = kongWangZhi.length > 0 ? kongWangZhi.join('、') : '无';
    dimensions["体用精断"] = preciseJudgment;
    dimensions["六神"] = sixSpirits;

    // OPT5 六亲旺衰
    dimensions["六亲旺衰"] = lqWs.liuqinWangShuai;
    dimensions["用神有力"] = lqWs.yongshenYouli;

    return { dimensions: dimensions, name: "易经卦象" };
};

    function daysSince1900(year, month, day) {
        var d1 = Date.UTC(1900, 0, 1);
        var d2 = Date.UTC(year, month-1, day);
        return Math.round((d2 - d1) / 86400000);
    }

    function solar_to_bazi(year, month, day, hour) {
        var lichun_m = 2, lichun_d = 4;
        var gz_year;
        if (month < lichun_m || (month === lichun_m && day < lichun_d)) {
            gz_year = ((year - 1 - 4) % 60 + 60) % 60;
        } else {
            gz_year = ((year - 4) % 60 + 60) % 60;
        }
        var jieqi_for_month = {1:12, 2:1, 3:2, 4:3, 5:4, 6:5, 7:6, 8:7, 9:8, 10:9, 11:10, 12:11};
        var month_branch = jieqi_for_month[month] || 1;
        var mg_idx = ((gz_year % 10) * 2 + month_branch) % 10;
        var mz_idx = ((month_branch + 2) % 12 + 12) % 12;
        var delta = daysSince1900(year, month, day);
        var gz_day_idx = ((10 + delta) % 60 + 60) % 60;
        var hour_zhi_idx = (Math.floor((hour + 1) / 2)) % 12;
        var day_gan_idx = gz_day_idx % 10;
        var hg_idx = ((day_gan_idx * 2 + hour_zhi_idx) % 10 + 10) % 10;
        return {
            year_gan: TIANGAN[gz_year % 10], year_zhi: DIZHI[gz_year % 12],
            year_ganzhi: LIUSHIJIAZI[gz_year],
            month_gan: TIANGAN[mg_idx], month_zhi: DIZHI[mz_idx],
            month_ganzhi: TIANGAN[mg_idx] + DIZHI[mz_idx],
            day_gan: TIANGAN[gz_day_idx % 10], day_zhi: DIZHI[gz_day_idx % 12],
            day_ganzhi: LIUSHIJIAZI[gz_day_idx],
            hour_gan: TIANGAN[hg_idx], hour_zhi: DIZHI[hour_zhi_idx],
            hour_ganzhi: TIANGAN[hg_idx] + DIZHI[hour_zhi_idx],
            day_gz_idx: gz_day_idx, hour_zhi_idx: hour_zhi_idx
        };
    }

        else if (WUXING_KE[c2_wx] === c1_wx) c1c2 = "末克中";
        else if (c1_wx === c2_wx) c1c2 = "中末比和";
        else c1c2 = "中末无克";
        if (WUXING_SHENG[c0_wx] === c2_wx) c0c2 = "初生末";
        else if (WUXING_KE[c0_wx] === c2_wx) c0c2 = "初克末";
        else if (WUXING_SHENG[c2_wx] === c0_wx) c0c2 = "末生初";
        else if (WUXING_KE[c2_wx] === c0_wx) c0c2 = "末克初";
        else if (c0_wx === c2_wx) c0c2 = "初末比和";
        else c0c2 = "初末无克";
        var trend;
        if (c0c1 === "初生中" && c1c2 === "中生末") trend = "递生·顺利渐进";
        else if (c0c1 === "初克中" && c1c2 === "中克末") trend = "递克·阻碍递增";
        else if (c0c2 === "初生末") trend = "初生末·始助终成";
        else if (c0c2 === "初克末") trend = "初克末·始阻终败";
        else if (c0c2 === "末生初") trend = "末生初·回光返照";
        else if (c0c2 === "末克初") trend = "末克初·终克始因";
        else if (c0_wx === c1_wx && c1_wx === c2_wx) trend = "三传同气·纯粹";
        else trend = "交错生克·复杂多变";
        return { c0c1: c0c1, c1c2: c1c2, c0c2: c0c2, trend: trend };
    }

    function find_chuan_tianjiang(chuan_zhi, tianpan, tianjiang) {
        var tianpan_val = tianpan[chuan_zhi] || chuan_zhi;
        for (var jiang_name in tianjiang) { if (tianjiang[jiang_name] === tianpan_val) { return jiang_name; } }
        return "未知";
    }

    // ===== Part 3: 标签生成 =====

    function _generate(year, month, day, hour, minute, options) {
        options = options || {};
        var bazi;

        // 优先使用 options.ganzhi 中的干支数据
        if (options.ganzhi && options.ganzhi.dayGz) {
            var gz = options.ganzhi;
            var yg = gz.yearGz || '';
            var mg = gz.monthGz || '';
            var dg = gz.dayGz || '';
            var hg = gz.hourGz || '';
            bazi = {
                year_gan: yg ? yg[0] : '', year_zhi: yg ? yg[1] : '', year_ganzhi: yg,
                month_gan: mg ? mg[0] : '', month_zhi: mg ? mg[1] : '', month_ganzhi: mg,
                day_gan: dg ? dg[0] : '', day_zhi: dg ? dg[1] : '', day_ganzhi: dg,
                hour_gan: hg ? hg[0] : '', hour_zhi: hg ? hg[1] : '', hour_ganzhi: hg,
                day_gz_idx: 0, hour_zhi_idx: DIZHI.indexOf(hg ? hg[1] : '子')
            };
        } else {
            bazi = solar_to_bazi(year, month, day, hour);
        }

        var yuejiang = get_yuejiang(month, day);
        var yj_info = YUEJIANG[yuejiang] || ["未知",""];
        var yuejiang_name = yj_info[0];
        var yuejiang_range = yj_info[1];

        var tianpan = arrange_tianpan(yuejiang, bazi.hour_zhi);
        var si_ke = get_si_ke(tianpan, bazi.day_gan, bazi.day_zhi);

        var sc_result = get_san_chuan_advanced(si_ke, bazi.day_gan, tianpan);
        var san_chuan = sc_result.chuan;
        var zongmen = sc_result.zongmen;

        var gr_result = get_guiren(bazi.day_gan, bazi.hour_zhi);
        var guiren = gr_result.guiren;
        var guiren_type = gr_result.type;

        var tianjiang = arrange_tianjiang_fixed(tianpan, guiren, bazi.hour_zhi);

        var kw_result = get_kongwang(bazi.hour_ganzhi);
        var kong = kw_result.kong;
        var xun_shou = kw_result.xun_shou;

        var yima = get_yima(bazi.day_zhi);

        var ganGong = GAN_JI_GONG[bazi.day_gan] || ["寅","木"];
        var gan_gong = ganGong[0];
        var gan_gong_wx = ganGong[1];

        var dungan_list = [];
        var chuan_names = ["初传","中传","末传"];
        for (var i = 0; i < 3; i++) {
            var dg = calc_dungan(bazi.day_gan, san_chuan[i]);
            var xy = DUNGAN_XIANGYI[dg] || "";
            dungan_list.push(dg + "(" + xy + ")");
        }

        var keti_ext = detect_keti_extended(si_ke, san_chuan, tianpan, bazi.day_gan, bazi.day_zhi);
        var ext_triggered_count = 0;
        for (var kn in keti_ext) { if (keti_ext[kn]) ext_triggered_count++; }

        var trend = analyze_chuan_trend(san_chuan);

        var chuan_tianjiang = [];
        for (var i = 0; i < 3; i++) {
            chuan_tianjiang.push(find_chuan_tianjiang(san_chuan[i], tianpan, tianjiang));
        }

        // 基础课体检测
        var all_chuan_meng = san_chuan.every(function(z){ return ["寅","申","巳","亥"].indexOf(z) >= 0; });
        var all_chuan_zhong = san_chuan.every(function(z){ return ["子","午","卯","酉"].indexOf(z) >= 0; });
        var all_chuan_ji = san_chuan.every(function(z){ return ["辰","戌","丑","未"].indexOf(z) >= 0; });
        var keti_results = {};
        for (var keti in KETI_LIST) {
            var desc = KETI_LIST[keti];
            var triggered = false;
            if (keti === "伏吟课") {
                var allSame = true;
                for (var d = 0; d < 12; d++) { if (tianpan[DIZHI[d]] !== DIZHI[d]) { allSame = false; break; } }
                triggered = allSame;
            } else if (keti === "反吟课") {
                var allFan = true;
                for (var d = 0; d < 12; d++) {
                    var exp = DIZHI_LIUCHONG[DIZHI[d]] || DIZHI[d];
                    if (tianpan[DIZHI[d]] !== exp) { allFan = false; break; }
                }
                triggered = allFan;
            } else if (keti === "玄胎课") { triggered = all_chuan_meng; }
            else if (keti === "三交课") { triggered = all_chuan_zhong; }
            else if (keti === "游子课") { triggered = all_chuan_ji; }
            else if (keti === "全局课") {
                for (var he in DIZHI_SANHE) {
                    var allIn = true;
                    for (var ci = 0; ci < san_chuan.length; ci++) { if (he.indexOf(san_chuan[ci]) < 0) { allIn = false; break; } }
                    if (allIn) { triggered = true; break; }
                }
            }
            keti_results[keti] = triggered ? ("✅" + desc) : "未触发";
        }

        // 覆盖扩展检测结果
        for (var kn2 in keti_ext) {
            if (keti_ext[kn2]) {
                var desc2 = KETI_LIST[kn2] || "";
                keti_results[kn2] = "✅" + desc2;
            }
        }

        var triggered_keti = [];
        for (var k in keti_results) { if (keti_results[k].indexOf("✅") >= 0) { triggered_keti.push(k); } }

        // 九宗门检测
        var ke_ke_count = 0;
        for (var ki = 0; ki < SI_KE_ORDER.length; ki++) {
            var kk = si_ke[SI_KE_ORDER[ki]];
            var tw = DIZHI_WUXING[kk[0]] || "土";
            var bw = DIZHI_WUXING[kk[1]] || "土";
            if (WUXING_KE[tw] === bw || WUXING_KE[bw] === tw) ke_ke_count++;
        }
        var zongmen_results = {};
        for (var zi = 0; zi < JIU_ZONGMEN.length; zi++) {
            var zm = JIU_ZONGMEN[zi];
            var trig = false;
            if (zm === "贼克" && ke_ke_count === 1) trig = true;
            else if (zm === "比用" && ke_ke_count === 2) trig = true;
            else if (zm === "涉害" && ke_ke_count >= 3) trig = true;
            else if (zm === "伏吟") {
                var allF = true;
                for (var d = 0; d < 12; d++) { if (tianpan[DIZHI[d]] !== DIZHI[d]) { allF = false; break; } }
                trig = allF;
            } else if (zm === "反吟") {
                var allR = true;
                for (var d = 0; d < 12; d++) {
                    var exp2 = DIZHI_LIUCHONG[DIZHI[d]] || DIZHI[d];
                    if (tianpan[DIZHI[d]] !== exp2) { allR = false; break; }
                }
                trig = allR;
            }
            zongmen_results[zm] = trig ? "✅触发" : "未触发";
        }

        // 主客分析
        var day_gan_wx = gan_gong_wx;
        var day_zhi_wx = DIZHI_WUXING[bazi.day_zhi] || "土";
        var gx;
        if (day_gan_wx === day_zhi_wx) gx = "干支比和";
        else if (WUXING_SHENG[day_gan_wx] === day_zhi_wx) gx = "干生支(利支)";
        else if (WUXING_SHENG[day_zhi_wx] === day_gan_wx) gx = "支生干(利干)";
        else if (WUXING_KE[day_gan_wx] === day_zhi_wx) gx = "干克支(干强)";
        else if (WUXING_KE[day_zhi_wx] === day_gan_wx) gx = "支克干(支强)";
        else gx = "无特殊关系";
        var zhengti_zhuke;
        if (day_gan_wx && WUXING_KE[day_gan_wx] === day_zhi_wx) zhengti_zhuke = "主胜客";
        else if (WUXING_KE[day_zhi_wx] === day_gan_wx) zhengti_zhuke = "客胜主";
        else zhengti_zhuke = "主客平衡";

        // 盘面总评
        var zhengti_jixiong;
        var tnames = triggered_keti.join("");
        if (triggered_keti.length > 0 && tnames.indexOf("凶") < 0) { zhengti_jixiong = "吉"; }
        else if (triggered_keti.some(function(k){ return (KETI_LIST[k] || "").indexOf("凶") >= 0; })) { zhengti_jixiong = "凶"; }
        else { zhengti_jixiong = "平"; }
        var kongwang_yingxiang;
        if (san_chuan.some(function(z){ return kong.indexOf(z) >= 0; })) { kongwang_yingxiang = "用神空亡·事难成"; }
        else { kongwang_yingxiang = "用神不空·事可成"; }
        var sanchuan_qushi;
        var is_di_sheng = true;
        for (var si = 0; si < 2; si++) {
            var wx1 = DIZHI_WUXING[san_chuan[si]] || "土";
            var wx2 = DIZHI_WUXING[san_chuan[si+1]] || "土";
            if (WUXING_SHENG[wx1] !== wx2) { is_di_sheng = false; break; }
        }
        sanchuan_qushi = is_di_sheng ? "递生·吉" : "非递生";
        var sike_vals = SI_KE_ORDER.map(function(k){ return si_ke[k][0] + "/" + si_ke[k][1]; });
        var unique_sike = new Set(sike_vals).size;
        var sike_wanbei = unique_sike === 4 ? "四课完备" : "四课不全";

        // === 构建 layers ===
        var layers = {};
        var chuan_meanings = ["事发端始·动机","事中变·移易之门","事归宿·结局定论"];

        // L1 基础排盘
        layers['L1_基础排盘'] = {
            '日干': bazi.day_gan,
            '日支': bazi.day_zhi,
            '日干支': bazi.day_ganzhi,
            '月将': yuejiang + '(' + yuejiang_name + ')',
            '月将范围': yuejiang_range,
            '占时': bazi.hour_zhi,
            '昼夜': guiren_type,
            '贵人': guiren,
            '空亡': kong.join(','),
            '旬首': xun_shou,
            '驿马': yima,
            '日干寄宫': gan_gong + '(' + gan_gong_wx + ')',
            '年干支': bazi.year_ganzhi,
            '月干支': bazi.month_ganzhi
        };

        // L2 天地盘
        layers['L2_天地盘'] = {};
        for (var i = 0; i < 12; i++) {
            var zhi = DIZHI[i];
            layers['L2_天地盘'][zhi + '→天盘'] = tianpan[zhi] || '';
        }

        // L3 四课
        layers['L3_四课'] = {};
        for (var ki = 0; ki < SI_KE_ORDER.length; ki++) {
            var kn = SI_KE_ORDER[ki];
            var kk = si_ke[kn];
            layers['L3_四课'][kn + '_上神'] = kk[0];
            layers['L3_四课'][kn + '_下神'] = kk[1];
        }

        // L4 三传
        layers['L4_三传'] = {};
        for (var i = 0; i < 3; i++) {
            var cn = chuan_names[i];
            var cz = san_chuan[i];
            var cwx = DIZHI_WUXING[cz] || "土";
            layers['L4_三传'][cn + '_地支'] = cz;
            layers['L4_三传'][cn + '_五行'] = cwx;
            layers['L4_三传'][cn + '_天将'] = chuan_tianjiang[i];
            layers['L4_三传'][cn + '_遁干'] = dungan_list[i];
            layers['L4_三传'][cn + '_旺衰'] = get_dizhi_wangshuai(cz, month);
            layers['L4_三传'][cn + '_含义'] = chuan_meanings[i];
        }

        // L5 十二天将分布
        layers['L5_十二天将分布'] = {};
        for (var i = 0; i < TIANJIANG_ORDER.length; i++) {
            var jiang = TIANJIANG_ORDER[i];
            layers['L5_十二天将分布'][jiang] = tianjiang[jiang] || '';
        }

        // L6 十二天将属性
        layers['L6_十二天将属性'] = {};
        for (var i = 0; i < TIANJIANG_ORDER.length; i++) {
            var jiang = TIANJIANG_ORDER[i];
            var attr = TIANJIANG[jiang] || {};
            layers['L6_十二天将属性'][jiang + '_五行'] = attr.wuxing || '';
            layers['L6_十二天将属性'][jiang + '_吉凶'] = attr.jixiong || '';
            layers['L6_十二天将属性'][jiang + '_核心象意'] = attr.meaning || '';
            layers['L6_十二天将属性'][jiang + '_人物象意'] = attr.person || '';
            layers['L6_十二天将属性'][jiang + '_事物象意'] = attr.thing || '';
            layers['L6_十二天将属性'][jiang + '_宜忌'] = attr.yiji || '';
        }

        // L7 十二月将属性
        layers['L7_十二月将属性'] = {};
        for (var i = 0; i < 12; i++) {
            var zhi = DIZHI[i];
            var yj = YUEJIANG[zhi] || ["未知",""];
            layers['L7_十二月将属性'][zhi] = yj[0] + '/' + yj[1];
        }

        // L8 课体格局判断
        layers['L8_课体格局判断'] = {};
        for (var keti in KETI_LIST) {
            var val = keti_results[keti] || "未触发";
            var shortDesc = val === "未触发" ? "未触发" : val.substring(1);
            layers['L8_课体格局判断'][keti] = shortDesc;
        }
        layers['L8_课体格局判断']['OPT4扩展'] = '共检测' + ext_triggered_count + '个触发';

        // L9 九宗门
        layers['L9_九宗门'] = {};
        for (var zi = 0; zi < JIU_ZONGMEN.length; zi++) {
            var zm = JIU_ZONGMEN[zi];
            layers['L9_九宗门'][zm] = zongmen_results[zm] || "未触发";
        }
        layers['L9_九宗门']['OPT2实际'] = '✅' + zongmen + '法取用';

        // L10 十干寄宫
        layers['L10_十干寄宫'] = {};
        for (var i = 0; i < TIANGAN.length; i++) {
            var gan = TIANGAN[i];
            var gp = GAN_JI_GONG[gan] || ["?","?"];
            layers['L10_十干寄宫'][gan] = '寄' + gp[0] + '宫/' + gp[1];
        }

        // L11 四课关系
        layers['L11_四课关系'] = {};
        for (var ki = 0; ki < SI_KE_ORDER.length; ki++) {
            var kn = SI_KE_ORDER[ki];
            var kk = si_ke[kn];
            var top = kk[0], bot = kk[1];
            var tw = DIZHI_WUXING[top] || "土";
            var bw = DIZHI_WUXING[bot] || "土";
            var rel;
            if (WUXING_KE[tw] === bw) rel = "上克下";
            else if (WUXING_KE[bw] === tw) rel = "下贼上";
            else if (tw === bw) rel = "比和";
            else if (WUXING_SHENG[tw] === bw) rel = "上生下";
            else if (WUXING_SHENG[bw] === tw) rel = "下生上";
            else rel = "无克";
            layers['L11_四课关系'][kn + '_关系'] = rel;
            layers['L11_四课关系'][kn + '_上神旺衰'] = get_dizhi_wangshuai(top, month);
        }

        // L12 三传趋势
        layers['L12_三传趋势'] = {};
        for (var i = 0; i < 3; i++) {
            var cn = chuan_names[i];
            layers['L12_三传趋势'][cn + '含义'] = chuan_meanings[i];
            layers['L12_三传趋势'][cn + '旺衰'] = get_dizhi_wangshuai(san_chuan[i], month);
        }
        layers['L12_三传趋势']['OPT5初中'] = trend.c0c1;
        layers['L12_三传趋势']['OPT5中末'] = trend.c1c2;
        layers['L12_三传趋势']['OPT5初末'] = trend.c0c2;
        layers['L12_三传趋势']['OPT5综合'] = trend.trend;

        // L13 贵人系统
        var gr = GUIREN[bazi.day_gan] || ["丑","未"];
        layers['L13_贵人系统'] = {
            '昼贵': gr[0],
            '夜贵': gr[1],
            '当前用贵': guiren,
            '贵人所在': tianjiang["贵人"] || ''
        };

        // L14 神煞
        layers['L14_神煞'] = {
            '驿马': yima,
            '空亡': kong.join(','),
            '日支六合': DIZHI_LIUHE[bazi.day_zhi] || '',
            '日支六冲': DIZHI_LIUCHONG[bazi.day_zhi] || '',
            '太岁': bazi.year_zhi,
            '月建': bazi.month_zhi
        };

        // L15 旺衰评估
        layers['L15_旺衰评估'] = {};
        for (var i = 0; i < 12; i++) {
            var zhi = DIZHI[i];
            layers['L15_旺衰评估'][zhi] = get_dizhi_wangshuai(zhi, month);
        }

        // L16 主客分析
        layers['L16_主客分析'] = {
            '日干(主)': bazi.day_gan + '(' + day_gan_wx + ')',
            '日支(客)': bazi.day_zhi + '(' + day_zhi_wx + ')',
            '干支关系': gx,
            '主旺衰': get_dizhi_wangshuai(gan_gong, month),
            '客旺衰': get_dizhi_wangshuai(bazi.day_zhi, month),
            '整体主客': zhengti_zhuke
        };

        // L17 盘面总评
        layers['L17_盘面总评'] = {
            '整体吉凶': zhengti_jixiong,
            '主要课体': triggered_keti.length > 0 ? triggered_keti.join(',') : '无特殊课体',
            '初传吉凶': (TIANJIANG[chuan_tianjiang[0]] || {}).jixiong || '',
            '末传吉凶': (TIANJIANG[chuan_tianjiang[2]] || {}).jixiong || '',
            '贵人吉凶': '贵人临身',
            '空亡影响': kongwang_yingxiang,
            '三传趋势': sanchuan_qushi,
            '四课完备': sike_wanbei,
            '格局数量': triggered_keti.length + '个',
            '总评': '课体' + triggered_keti.length + '个·三传' + san_chuan[0] + '→' + san_chuan[1] + '→' + san_chuan[2]
        };

        return { layers: layers, zongmen: zongmen, san_chuan: san_chuan, triggered_keti: triggered_keti };
    }

    // ===== 标准接口 =====

    window.Systems.liuren = function(year, month, day, hour, minute, options) {
        hour = hour || 12;
        minute = minute || 0;
        options = options || {};

        var result = _generate(year, month, day, hour, minute, options);
        var layers = result.layers;
        var dimensions = {};

        var layerKeys = Object.keys(layers);
        for (var i = 0; i < layerKeys.length; i++) {
            var layerName = layerKeys[i];
            var layerData = layers[layerName];
            var dk = Object.keys(layerData);
            for (var j = 0; j < dk.length; j++) {
                var key = dk[j];
                var val = layerData[key];
                if (val !== null && val !== '' && val !== false) {
                    dimensions[layerName + '.' + key] = val;
                }
            }
        }

        // 生成摘要
        var summaryParts = [];
        if (result.zongmen) summaryParts.push(result.zongmen + '法');
        if (result.san_chuan) summaryParts.push('三传:' + result.san_chuan.join('→'));
        if (result.triggered_keti && result.triggered_keti.length > 0) summaryParts.push('格局' + result.triggered_keti.length + '个');

        return {
            dimensions: dimensions,
            name: '大六壬',
            summary: summaryParts.join(' · ')
        };
    };

})();

/**
 * 奇门遁甲 (Qi Men Dun Jia) 标签生成模块

window.Systems = window.Systems || {};

(function() {

    // ===== Part 1: 基础数据表 =====

    var TIANGAN = ['甲','乙','丙','丁','戊','己','庚','辛','壬','癸'];

    var LIUSHIJIAZI = [];
    for (var i = 0; i < 60; i++) { LIUSHIJIAZI.push(TIANGAN[i%10] + DIZHI[i%12]); }

    var JIUGONG = {
        1:{gua:'坎',wx:'水',fang:'北'},

    // ===== Part 2: 计算函数 =====

    function solar_to_bazi(year, month, day, hour) {
        var lichun_month = 2, lichun_day = 4;
        var gz_year;
        if (month < lichun_month || (month === lichun_month && day < lichun_day)) {
            gz_year = ((year - 1 - 4) % 60 + 60) % 60;
        } else {
            gz_year = ((year - 4) % 60 + 60) % 60;
        }
        var jieqi_for_month = {1:['小寒',12],2:['立春',1],3:['惊蛰',2],4:['清明',3],
            5:['立夏',4],6:['芒种',5],7:['小暑',6],8:['立秋',7],
            9:['白露',8],10:['寒露',9],11:['立冬',10],12:['大雪',11]};
        var jq_info = jieqi_for_month[month] || ['立春',1];
        var jq_name = jq_info[0], prev_month_idx = jq_info[1];
        var jq_date = JIEQI_DATES[jq_name] || [month,1];
        var jq_m = jq_date[0], jq_d = jq_date[1];
        var month_branch_idx;
        if (day < jq_d) { month_branch_idx = prev_month_idx; } else { month_branch_idx = month; }
        var year_gan_idx = gz_year % 10;
        var gz_month_gan = (year_gan_idx * 2 + month_branch_idx) % 10;
        var gz_month_zhi = (month_branch_idx + 2) % 12;
        var mg = TIANGAN[gz_month_gan];
        var mz = DIZHI[gz_month_zhi];
        var base_date = new Date(1900, 0, 1);
        var target_date = new Date(year, month - 1, day);
        var delta_days = Math.round((target_date - base_date) / (86400000));
        var base_gz_idx = 10;
        var gz_day_idx = ((base_gz_idx + delta_days) % 60 + 60) % 60;
        var hour_zhi_idx = Math.floor((hour + 1) / 2) % 12;
        var day_gan_idx = gz_day_idx % 10;
        var hour_gan_idx = (day_gan_idx * 2 + hour_zhi_idx) % 10;
        var gz_hour_idx = hour_gan_idx * 12 + hour_zhi_idx;
        return {
            'year_gan': TIANGAN[gz_year % 10], 'year_zhi': DIZHI[gz_year % 12], 'year_ganzhi': LIUSHIJIAZI[gz_year],
            'month_gan': mg, 'month_zhi': mz, 'month_ganzhi': mg + mz,
            'day_gan': TIANGAN[gz_day_idx % 10], 'day_zhi': DIZHI[gz_day_idx % 12], 'day_ganzhi': LIUSHIJIAZI[gz_day_idx],
            'hour_gan': TIANGAN[hour_gan_idx], 'hour_zhi': DIZHI[hour_zhi_idx], 'hour_ganzhi': TIANGAN[hour_gan_idx] + DIZHI[hour_zhi_idx],
            'day_gz_idx': gz_day_idx, 'hour_gz_idx': gz_hour_idx
        };
    }

    function get_jieqi(month, day) {
        var current_jieqi = '冬至';
        for (var qi = 0; qi < JIEQI_SEQUENCE.length; qi++) {
            var jq = JIEQI_SEQUENCE[qi];
            var jd = JIEQI_DATES[jq];
            var jm = jd[0], jdd = jd[1];
            if (month > jm || (month === jm && day >= jdd)) { current_jieqi = jq; }
        }
        return current_jieqi;
    }

    function get_yuan(day_ganzhi) {
        var futou = XUN_SHOU[day_ganzhi] || '甲子';
        if (futou === '甲子' || futou === '甲午') { return ['上元', futou]; }
        else if (futou === '甲申' || futou === '甲寅') { return ['中元', futou]; }
        else { return ['下元', futou]; }
    }

    function determine_ju(month, day, day_ganzhi) {

    function arrange_dipan(dun_type, ju) {
        var dipan = {};

            var order = [];
            for (var i = 0; i < 18; i++) { order.push(JIUGONG_ORDER[i % 9]); }
            var start_idx = ju - 1;
            for (var i = 0; i < 9; i++) { dipan[order[start_idx + i]] = SANQI_LIUYI[i]; }
        } else {
            var rev = [];
            for (var i = 8; i >= 0; i--) { rev.push(JIUGONG_ORDER[i]); }
            var order = [];
            for (var i = 0; i < 18; i++) { order.push(rev[i % 9]); }
            var start_idx = 9 - ju;
            for (var i = 0; i < 9; i++) { dipan[order[start_idx + i]] = SANQI_LIUYI[i]; }
        }
        return dipan;
    }

    function find_xun_shou(hour_ganzhi) { return XUN_SHOU[hour_ganzhi] || '甲子'; }

        if (zhifu_palace === null) { zhifu_palace = 1; }

        for (var star in JIUXING) {

        }
        var zhishi_door = '休门';
        for (var door in BAMEN) {
            if (BAMEN.hasOwnProperty(door)) {
                if (BAMEN[door]['palace'] === zhifu_palace) { zhishi_door = door; break; }
            }
        }
        return [zhifu_star, zhishi_door, zhifu_palace, dun_gan];

    function arrange_tianpan(dipan, dun_type, zhifu_star, zhifu_palace, hour_gan) {

    function arrange_renpan_fixed(dun_type, zhishi_door, zhifu_palace, hour_zhi, xun_shou) {

        var offset = ((hour_zhi_idx - xun_shou_zhi_idx) % 12 + 12) % 12;
        var zhifu_gong_idx = gong_seq.indexOf(zhifu_palace);

    function analyze_zhuke(dipan, day_gan, hour_gan) {

            else if (WUXING_KE[shi_wx] === ri_wx) { result['主客生克'] = '客克主(利客)'; result['整体主客'] = '客胜主'; }
        }
        return result;

    function calc_gan_shengke(dipan, tianpan_gan) {

            else if (WUXING_SHENG[dg_wx] === tg_wx) result[palace + '宫天地盘干关系'] = dg + '生' + tg + ' 地盘生天盘';
            else if (WUXING_KE[tg_wx] === dg_wx) result[palace + '宫天地盘干关系'] = tg + '克' + dg + ' 天盘克地盘';
            else if (WUXING_KE[dg_wx] === tg_wx) result[palace + '宫天地盘干关系'] = dg + '克' + tg + ' 地盘克天盘';

    // ===== Part 3: 标签生成 =====

    function _generate(year, month, day, hour, minute, options) {
        options = options || {};
        var bazi;

        if (options.ganzhi && options.ganzhi.dayGz) {
            var gz = options.ganzhi;

            var hg = gz.hourGz || '';
            bazi = {

                'month_gan': mg ? mg[0] : '', 'month_zhi': mg ? mg[1] : '', 'month_ganzhi': mg,
                'day_gan': dg ? dg[0] : '', 'day_zhi': dg ? dg[1] : '', 'day_ganzhi': dg,
                'hour_gan': hg ? hg[0] : '', 'hour_zhi': hg ? hg[1] : '', 'hour_ganzhi': hg,
                'day_gz_idx': 0, 'hour_gz_idx': 0
            };
        } else {
            bazi = solar_to_bazi(year, month, day, hour);

        var ju_result = determine_ju(month, day, bazi['day_ganzhi']);
        var dun_type = ju_result[0], ju = ju_result[1], jieqi = ju_result[2], yuan = ju_result[3], futou = ju_result[4];
        var dipan = arrange_dipan(dun_type, ju);
        var xun_shou = find_xun_shou(bazi['hour_ganzhi']);
        var zf_result = find_zhifu_zhishi(dipan, xun_shou);
        var zhifu_star = zf_result[0], zhishi_door = zf_result[1], zhifu_palace = zf_result[2], dun_gan = zf_result[3];
        var tianpan = arrange_tianpan(dipan, dun_type, zhifu_star, zhifu_palace, bazi['hour_gan']);
        var shenpan = arrange_shenpan(dun_type, tianpan, zhifu_star);
        var tianpan_gan = arrange_tianpan_gan(dipan, tianpan);
        var renpan = arrange_renpan_fixed(dun_type, zhishi_door, zhifu_palace, bazi['hour_zhi'], xun_shou);
        var kw_result = get_kongwang(bazi['hour_ganzhi']);
        var kong_gongs = kw_result[0], kong_zhis = kw_result[1];
        var yima = get_yima(bazi['day_zhi']);
        var geju_ext = check_geju_extended(dipan, tianpan, tianpan_gan, renpan, shenpan, bazi['hour_gan'], bazi['day_gan'], zhishi_door, zhifu_palace);
        var zhuke = analyze_zhuke(dipan, bazi['day_gan'], bazi['hour_gan']);
        var gan_shengke = calc_gan_shengke(dipan, tianpan_gan);

        var layers = {};

        // L1 基础排盘
        layers['L1_基础排盘'] = {
            '阴阳遁': dun_type + '遁' + ju + '局',
            '局数': String(ju),
            '节气': jieqi,

            '符头': futou,
            '旬首': xun_shou,
            '值符星': zhifu_star,
            '值使门': zhishi_door,
            '时干': bazi['hour_gan'],
            '日干': bazi['day_gan'],
            '空亡地支': kong_zhis.join(','),
            '驿马': yima
        };

        // L2 九宫属性
        layers['L2_九宫属性'] = {};
        for (var g = 1; g <= 9; g++) {
            var ginfo = JIUGONG[g];
            layers['L2_九宫属性'][g + '宫'] = ginfo['gua'] + '/' + ginfo['wx'] + '/' + ginfo['fang'];
        }

        // L3 地盘干分布
        layers['L3_地盘干分布'] = {};
        for (var g = 1; g <= 9; g++) {
            layers['L3_地盘干分布'][g + '宫地盘干'] = dipan[g] || '';
        }

        // L4 天盘星分布
        layers['L4_天盘星分布'] = {};
        for (var g = 1; g <= 9; g++) {
            var star = tianpan[g] || '';
            layers['L4_天盘星分布'][g + '宫天盘星'] = star;

    // ===== Part 2: 计算函数 =====

    function mod(n, m) { return ((n % m) + m) % m; }

    function solarToBazi(year, month, day, hour, minute) {
        var yearGanIdx = mod(year - 4, 10);
        var yearZhiIdx = mod(year - 4, 12);
        var yearGan = TIANGAN[yearGanIdx];
        var yearZhi = DIZHI[yearZhiIdx];
        var monthZhiIdx = ((month + 9) % 12) + 2;
        if (monthZhiIdx >= 12) monthZhiIdx -= 12;
        var monthZhi = DIZHI[monthZhiIdx];
        var startGan = WU_HU_DUN[yearGan];
        var monthGanIdx = mod(startGan + monthZhiIdx - 2, 10);
        var monthGan = TIANGAN[monthGanIdx];
        var baseDate = new Date(2000, 0, 7);
        var targetDate = new Date(year, month - 1, day);
        var dayDiff = Math.round((targetDate.getTime() - baseDate.getTime()) / 86400000);
        var dayIdx = mod(dayDiff + 54, 60);
        var dayGan = TIANGAN[dayIdx % 10];
        var dayZhi = DIZHI[dayIdx % 12];
        var timeZhiIdx = Math.floor((hour * 2 + (minute >= 30 ? 1 : 0)) / 2);
        if (timeZhiIdx >= 12) timeZhiIdx -= 12;
        if (timeZhiIdx === 0 && hour < 1) timeZhiIdx = 0;
        var timeZhi = DIZHI[timeZhiIdx];
        var startShi = WU_SHU_DUN[dayGan];
        var timeGanIdx = mod(startShi + timeZhiIdx, 10);
        var timeGan = TIANGAN[timeGanIdx];
        return {year_gan:yearGan,year_zhi:yearZhi,year_gan_idx:yearGanIdx,year_zhi_idx:yearZhiIdx,
            month_gan:monthGan,month_zhi:monthZhi,month_zhi_idx:monthZhiIdx,
            day_gan:dayGan,day_zhi:dayZhi,day_idx:dayIdx,
            time_gan:timeGan,time_zhi:timeZhi,time_zhi_idx:timeZhiIdx};
    }

    function solarToLunarApprox(year, month, day) {
        var lunarMonth = month;
        var lunarDay = day;
        if (month === 1 || (month === 2 && day < 17)) {
            lunarMonth = (month === 1) ? 12 : 1;
            lunarDay = (month === 1) ? (day + 15) : day;
        }
        if (lunarMonth < 1) lunarMonth = 1;
        if (lunarMonth > 12) lunarMonth = 12;
        if (lunarDay < 1) lunarDay = 1;
        if (lunarDay > 30) lunarDay = 30;
        return [lunarMonth, lunarDay];
    }

    function getMingGong(lunarMonth, timeZhiIdx) { return mod(2 + (lunarMonth - 1) - timeZhiIdx, 12); }
    function getShenGong(lunarMonth, timeZhiIdx) { return mod(2 + (lunarMonth - 1) + timeZhiIdx, 12); }

    function getMingGongGan(yearGan, mingGongZhiIdx) {
        var startGan = WU_HU_DUN[yearGan];
        var ganIdx = mod(startGan + mingGongZhiIdx - 2, 10);
        return TIANGAN[ganIdx];
    }

    function getWuxingJu(mingGongGan, mingGongZhi) {
        var ganIdx = TIANGAN.indexOf(mingGongGan);
        var zhiIdx = DIZHI.indexOf(mingGongZhi);
        var jiaziIdx = mod(ganIdx * 12 + zhiIdx, 60);
        for (var i = 0; i < 60; i++) { if (JIAZI[i] === mingGongGan + mingGongZhi) { jiaziIdx = i; break; } }
        var nayin = NAYIN_60[jiaziIdx];
        var nayinWuxing = nayin.charAt(nayin.length - 1);
        var ju = NAYIN_WUXING_TO_JU[nayinWuxing] || 2;
        return [ju, nayin];
    }

    function getZiweiPos(ju, lunarDay) {
        var shang = Math.floor(lunarDay / ju);
        var yu = lunarDay % ju;
        var pos;
        if (yu === 0) { pos = mod(1 + (shang - 1), 12); }
        else { pos = mod(1 + shang, 12); if ((shang + yu) % 2 === 1) { pos = mod(pos - 1, 12); } else { pos = mod(pos + 1, 12); } }
        return pos;
    }

    function getZiweiPosCorrected(ju, lunarDay) {
        if (ju < 2 || ju > 6) return 0;
        if (lunarDay < 1) lunarDay = 1;
        if (lunarDay > 30) lunarDay = 30;
        var shang = Math.floor(lunarDay / ju);

            var pIdx16 = mod(mingGongIdx + i16, 12);
            var oppIdx16 = OPPOSITE_PALACE[pIdx16];
            var oppName16 = PALACES[mod(oppIdx16 - mingGongIdx, 12)];
            layers['L16_宫位互涉'][PALACES[i16] + '_对宫'] = oppName16;
        }

        // L17: 命盘格局
        var mingStars17 = getPalaceStars(starPositions, mingGongIdx);
        var mingMw17 = {}; mingStars17.forEach(function(s){ mingMw17[s] = miaoWangMap[s] || '平'; });
        var strongCnt17 = 0, weakCnt17 = 0;
        for (var mw17 in mingMw17) { if (mingMw17[mw17] === '庙' || mingMw17[mw17] === '旺') strongCnt17++; if (mingMw17[mw17] === '陷') weakCnt17++; }
        var panStrength = '命宫中等'; if (strongCnt17 > weakCnt17) panStrength = '命宫强'; else if (weakCnt17 > strongCnt17) panStrength = '命宫弱';
        var gejuGuige = 0, gejuFuge = 0;
        matchedGejuExt.forEach(function(g){ if (g.type === '贵格' || g.type === '武贵格') gejuGuige++; if (g.type === '富格') gejuFuge++; });
        var level17 = '杂格'; if (gejuGuige >= 2) level17 = '贵格突出'; else if (gejuFuge >= 2) level17 = '富格突出'; else if (gejuGuige + gejuFuge >= 1) level17 = '有成格';
        var shaCnt17 = 0, jiCnt17 = 0;
        var sfAll17 = [mingGongIdx].concat(SANHE_PALACES[mingGongIdx]).concat([OPPOSITE_PALACE[mingGongIdx]]);
        ['擎羊','陀罗','火星','铃星','地空','地劫'].forEach(function(s){ if (sfAll17.indexOf(auxStars[s] || -1) >= 0) shaCnt17++; });
        ['左辅','右弼','天魁','天钺','文昌','文曲'].forEach(function(s){ if (sfAll17.indexOf(auxStars[s] || -1) >= 0) jiCnt17++; });

        layers['L17_命盘格局'] = {
            '命宫主星': mingStars17.length ? mingStars17.join('、') : '空宫',
            '命宫庙旺': mingStars17.length ? mingStars17.map(function(s){ return s + '(' + mingMw17[s] + ')'; }).join('、') : '空宫',
            '命盘强弱': panStrength,
            '富贵层次': level17,
            '成立格局数': matchedGejuExt.length + '个',
            '成立格局名': matchedGejuExt.length ? matchedGejuExt.map(function(g){ return g.name; }).join('、') : '无成格',
            '三方四正吉星数': jiCnt17 + '颗',
            '三方四正煞星数': shaCnt17 + '颗',
            '身宫位置': DIZHI[shenGongIdx] + '宫(' + PALACES[mod(shenGongIdx - mingGongIdx, 12)] + ')',
            '五行局纳音': nayin
        };
        if (ziweiChanged) layers['L17_命盘格局']['OPT5修正'] = '紫微星位置从' + DIZHI[ziweiPosOrig] + '宫修正为' + DIZHI[ziweiPosNew] + '宫';

        return { layers: layers, mingGongZhi: mingGongZhi, ju: ju, nayin: nayin, ziweiPos: ziweiPos, sihua: sihua, matchedGejuExt: matchedGejuExt };
    }

    // ===== 标准接口 =====

    window.Systems.ziwei = function(year, month, day, hour, minute, options) {
        hour = hour || 12;
        minute = minute || 0;
        options = options || {};

        var result = _generate(year, month, day, hour, minute, options);
        var layers = result.layers;
        var dimensions = {};

        var layerKeys = Object.keys(layers);
        for (var i = 0; i < layerKeys.length; i++) {
            var layerName = layerKeys[i];
            var layerData = layers[layerName];
            var dk = Object.keys(layerData);
            for (var j = 0; j < dk.length; j++) {
                var key = dk[j];
                var val = layerData[key];
                if (val !== null && val !== '' && val !== false) {
                    dimensions[layerName + '.' + key] = val;
                }
            }
        }

        var summaryParts = [];
        if (result.mingGongZhi) summaryParts.push('命宫:' + result.mingGongZhi + '宫');
        if (result.nayin) summaryParts.push(result.nayin);
        if (result.sihua) summaryParts.push('禄→' + (result.sihua['禄'] || '') + ' 忌→' + (result.sihua['忌'] || ''));
        if (result.matchedGejuExt && result.matchedGejuExt.length > 0) summaryParts.push('格局' + result.matchedGejuExt.length + '个');

        return {
            dimensions: dimensions,
            name: '紫微斗数',
            summary: summaryParts.join(' · ')
        };
    };

})();


// 启动
renderHome();
</script>
