// ✅ 优化点#2: 真实日历天数+时辰+种子化RNG+逆位
function dayOfYear(y, m, d) {
  const daysInMonth = [31,28,31,30,31,30,31,31,30,31,30,31];
  let isLeap = (y%4===0 && y%100!==0) || y%400===0;
  let doy = d;
  for (let i = 0; i < m - 1; i++) doy += daysInMonth[i];
  if (m > 2 && isLeap) doy++;
  return doy;
}

function generateAll() {
  const y = parseInt(document.getElementById("year").value);
  const m = parseInt(document.getElementById("month").value);
  const d = parseInt(document.getElementById("day").value);
  const h = parseInt(document.getElementById("hour").value);
  
  // 计算真实天数（从1900-01-01）
  function daysFromEpoch(yr, mo, dy) {
    let total = 0;
    for (let i = 1900; i < yr; i++) {
      total += ((i%4===0 && i%100!==0) || i%400===0) ? 366 : 365;
    }
    total += dayOfYear(yr, mo, dy) - 1;
    return total;
  }
  
  const realDays = daysFromEpoch(y, m, d);
  const seed = realDays * 24 + h;
  
  // 种子化伪随机
  function rng(s) {
    s = s & 0x7FFFFFFF;
    s = (s * 1103515245 + 12345) & 0x7FFFFFFF;
    return s;
  }
  
  // ✅ 注意: 此处使用Number运算，但1103515245 * 0x7FFFFFFF可能超2^53
  // 实际上seed通常远小于0x7FFFFFFF，且乘法结果用&0x7FFFFFFF截断
  // 但为安全起见使用BigInt (BUG-002防护)
  function rngBig(s) {
    let st = BigInt(s & 0x7FFFFFFF);
    const MULT = 1103515245n;
    const INC = 12345n;
    const MASK = 0x7FFFFFFFn;
    st = (st * MULT + INC) & MASK;
    return Number(st);
  }
  
  let s1 = rngBig(seed);
  let s2 = rngBig(s1);
  let s3 = rngBig(s2);
  
  const pastCard = MAJOR_ARCANA[s1 % 22];
  const presentCard = MAJOR_ARCANA[s2 % 22];
  const futureCard = MAJOR_ARCANA[s3 % 22];
  const pastRev = s1 % 7 === 0;
  const presentRev = s2 % 7 === 0;
  const futureRev = s3 % 7 === 0;
  
  let html = "";
  
  // === 高亮卡片：三牌解读 ===
  html += '<div class="highlight-card">';
  html += '<h3>🃏 塔罗三牌解读</h3>';
  html += '<div class="three-cards">';
  html += '<div class="tarot-card"><div class="card-num">'+pastCard.num+'</div><div class="card-name">'+pastCard.name+'</div><div class="card-meaning">'+(pastRev?pastCard.ni:pastCard.zheng)+'</div>'+(pastRev?'<div class="card-reversed">逆位</div>':'')+'</div>';
  html += '<div class="tarot-card"><div class="card-num">'+presentCard.num+'</div><div class="card-name">'+presentCard.name+'</div><div class="card-meaning">'+(presentRev?presentCard.ni:presentCard.zheng)+'</div>'+(presentRev?'<div class="card-reversed">逆位</div>':'')+'</div>';
  html += '<div class="tarot-card"><div class="card-num">'+futureCard.num+'</div><div class="card-name">'+futureCard.name+'</div><div class="card-meaning">'+(futureRev?futureCard.ni:futureCard.zheng)+'</div>'+(futureRev?'<div class="card-reversed">逆位</div>':'')+'</div>';
  html += '</div>';
  html += '</div>';
